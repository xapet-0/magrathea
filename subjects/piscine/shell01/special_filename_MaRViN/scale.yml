    (no C compilation applies).
- id: explain_before_checking
  title: 'Step 2: Conceptual Defense (Explain Before Checking)'
  points: 30
  checks:
  - Student explains the shell, git, SSH, or diff/patch steps used to construct `"\?$*'MaRViN'*$?\"`.
- id: live_mutation
  title: 'Step 3: Live Reproduction & Edge-Case Verification'
  points: 50
  checks:
  - Verify the artifact cleanly reproduces or passes validation checks on edge inputs
    (quoting, whitespace, key/patch check).
