mode: c_program
fixed_tests:
- name: pool_cat_T01
  description: cat_file
  args:
  - a.txt
  expected: 'hello

    world

    '
  category: Functional
  tier: baseline
  files:
    a.txt: 'hello

      world

      '
- name: pool_cat_T02
  description: cat_stdin
  args: []
  expected: 'stdin text

    '
  category: Functional
  tier: baseline
  stdin: 'stdin text

    '
- name: pool_cat_T03_multi_files
  description: cat_two_files_concatenated
  args:
  - f1.txt
  - f2.txt
  expected: 'first

    second

    '
  category: Functional
  tier: edge_case
  files:
    f1.txt: 'first

      '
    f2.txt: 'second

      '
- name: pool_cat_T04_empty_file
  description: cat_empty_file
  args:
  - empty.txt
  expected: ''
  category: Edge Case
  tier: edge_case
  files:
    empty.txt: ''
- name: test_05_three_files
  args:
  - f1.txt
  - f2.txt
  - f3.txt
  files:
    f1.txt: 'A

      '
    f2.txt: 'B

      '
    f3.txt: 'C

      '
  tier: baseline
  stdout: 'A

    B

    C

    '
- name: test_06_no_trailing_newline
  args:
  - nonl.txt
  files:
    nonl.txt: no_newline_here
  tier: edge
  stdout: no_newline_here
- name: test_07_stdin_multiline
  args: []
  stdin: 'line1

    line2

    line3

    '
  tier: baseline
  stdout: 'line1

    line2

    line3

    '
- name: test_08_stdin_empty
  args: []
  stdin: ''
  tier: edge
  stdout: ''
- name: test_09_empty_between_nonempty
  args:
  - a.txt
  - empty.txt
  - b.txt
  files:
    a.txt: 'start

      '
    empty.txt: ''
    b.txt: 'end

      '
  tier: edge
  stdout: 'start

    end

    '
- name: test_10_tabs_and_symbols
  args:
  - sym.txt
  files:
    sym.txt: "42\t1337\n!@#$%^&*()\n"
  tier: stress
  stdout: "42\t1337\n!@#$%^&*()\n"
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./ft_cat a.txt
  args:
  - a.txt
  expected: 'hello

    world

    '
  cat_e: false
- id: subj_ex_02
  origin: subject.en.txt
  command: printf "stdin text\n" | ./ft_cat
  args:
  - stdin text\n
  expected: 'stdin text

    '
  cat_e: false
folder_examples:
- id: folder_fixture_01
  origin: subject_folder/srcs/main.c
  input: srcs/main.c
  expected: '/* **************************************************************************
    */

    /*                                                                            *'
near_examples:
- id: near_subj_01_lexical_shift
  derived_from: subj_ex_01
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input:
  - a.txt
  perturbed_input:
  - b.txt
- id: near_subj_01_whitespace_envelope
  derived_from: subj_ex_01
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input:
  - a.txt
  perturbed_input:
  - '  a.txt  '
- id: near_subj_02_lexical_shift
  derived_from: subj_ex_02
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input:
  - stdin text\n
  perturbed_input:
  - ttdin text\n
- id: near_subj_02_whitespace_envelope
  derived_from: subj_ex_02
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input:
  - stdin text\n
  perturbed_input:
  - '  stdin text\n  '
