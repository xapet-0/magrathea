mode: c_program
fixed_tests:
- name: pool_tail_T01
  description: tail_bytes
  args:
  - -c
  - '5'
  - a.txt
  expected: 'orld

    '
  category: Functional
  tier: baseline
  files:
    a.txt: 'hello world

      '
- name: pool_tail_T02
  description: case_tail_exact_file
  args:
  - -c
  - '11'
  - a.txt
  expected: 'ello world

    '
  category: Functional
  tier: baseline
  files:
    a.txt: 'hello world

      '
- name: pool_tail_T03
  description: case_tail_more_than_file
  args:
  - -c
  - '99'
  - a.txt
  expected: 'abc

    '
  category: Functional
  tier: baseline
  files:
    a.txt: 'abc

      '
- name: pool_tail_T04_zero_bytes
  description: tail_zero_bytes
  args:
  - -c
  - '0'
  - a.txt
  expected: ''
  category: Edge Case
  tier: edge_case
  files:
    a.txt: 'hello world

      '
- name: test_05_last_1_byte
  args:
  - -c
  - '1'
  - a.txt
  files:
    a.txt: 'abcdef

      '
  tier: edge
  stdout: '

    '
- name: test_06_empty_file
  args:
  - -c
  - '10'
  - empty.txt
  files:
    empty.txt: ''
  tier: edge
  stdout: ''
- name: test_07_attached_c_flag
  args:
  - -c4
  - a.txt
  files:
    a.txt: '12345678

      '
  tier: edge
  stdout: '678

    '
- name: test_08_two_files_headers
  args:
  - -c
  - '3'
  - f1.txt
  - f2.txt
  files:
    f1.txt: 'hello

      '
    f2.txt: 'world

      '
  tier: baseline
  stdout: '==> f1.txt <==

    lo


    ==> f2.txt <==

    ld

    '
- name: test_09_stdin_tail
  args:
  - -c
  - '4'
  stdin: 'magrathea

    '
  tier: baseline
  stdout: 'hea

    '
- name: test_10_exact_multiline
  args:
  - -c
  - '6'
  - m.txt
  files:
    m.txt: 'line1

      line2

      '
  tier: stress
  stdout: 'line2

    '
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./tail "-c" "5" "a.txt" | cat -e
  args: &id001
  - -c
  - '5'
  - a.txt
  expected: 'orld

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: ./tail "-c" "11" "a.txt" | cat -e
  args: &id002
  - -c
  - '11'
  - a.txt
  expected: 'ello world

    '
  cat_e: true
- id: subj_ex_03
  origin: subject.en.txt
  command: ./tail "-c" "99" "a.txt" | cat -e
  args: &id003
  - -c
  - '99'
  - a.txt
  expected: 'abc

    '
  cat_e: true
folder_examples:
- id: folder_fixture_01
  origin: subject_folder/out1
  input: out1
  expected: '==> toto.txt <==

    123456789


    ==> Makefile <==

    fclean re'
- id: folder_fixture_02
  origin: subject_folder/out2
  input: out2
  expected: '==> toto.txt <==

    123456789


    ==> Makefile <==

    fclean re'
- id: folder_fixture_03
  origin: subject_folder/srcs/main.c
  input: srcs/main.c
  expected: '/* **************************************************************************
    */

    /*                                                                            *'
- id: folder_fixture_04
  origin: subject_folder/toto.txt
  input: toto.txt
  expected: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789
near_examples:
- id: near_subj_01_lexical_shift
  derived_from: subj_ex_01
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input: *id001
  perturbed_input:
  - -d
  - '6'
  - b.txt
- id: near_subj_01_whitespace_envelope
  derived_from: subj_ex_01
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input: *id001
  perturbed_input:
  - '  -c  '
  - '5'
  - a.txt
- id: near_subj_02_lexical_shift
  derived_from: subj_ex_02
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input: *id002
  perturbed_input:
  - -d
  - '12'
  - b.txt
- id: near_subj_02_whitespace_envelope
  derived_from: subj_ex_02
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input: *id002
  perturbed_input:
  - '  -c  '
  - '11'
  - a.txt
- id: near_subj_03_lexical_shift
  derived_from: subj_ex_03
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input: *id003
  perturbed_input:
  - -d
  - '100'
  - b.txt
- id: near_subj_03_whitespace_envelope
  derived_from: subj_ex_03
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input: *id003
  perturbed_input:
  - '  -c  '
  - '99'
  - a.txt
- id: near_folder_01_boundary_neighbor
  derived_from: folder_fixture_01
  strategy: Neighbouring perturbation of folder example (subject_folder/out1)
  original_input: out1
  perturbed_input: put1
- id: near_folder_02_boundary_neighbor
  derived_from: folder_fixture_02
  strategy: Neighbouring perturbation of folder example (subject_folder/out2)
  original_input: out2
  perturbed_input: put2
