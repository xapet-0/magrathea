subject_id: ft_print_numbers
fixed_tests:
- name: test_01_call
  call: ft_print_numbers()
  stdout: 0123456789
  tier: baseline
- name: case_numbers_once
  call: ft_print_numbers(); write(1, "\n", 1)
  stdout: '0123456789

    '
  tier: baseline
- name: case_numbers_twice
  call: ft_print_numbers(); ft_print_numbers(); write(1, "\n", 1)
  stdout: '01234567890123456789

    '
  tier: baseline
- name: case_numbers_delimited
  call: write(1, "<", 1); ft_print_numbers(); write(1, ">\n", 2)
  stdout: '<0123456789>

    '
  tier: edge_case
- name: test_05_bracketed
  call: write(1, "[", 1); ft_print_numbers(); write(1, "]\n", 2)
  tier: baseline
  stdout: '[0123456789]

    '
- name: test_06_colon_separated
  call: ft_print_numbers(); write(1, ":", 1); ft_print_numbers(); write(1, "\n", 1)
  tier: baseline
  stdout: '0123456789:0123456789

    '
- name: test_07_prefix_tag
  call: write(1, "DIGITS=", 7); ft_print_numbers(); write(1, "\n", 1)
  tier: edge
  stdout: 'DIGITS=0123456789

    '
- name: test_08_suffix_tag
  call: ft_print_numbers(); write(1, "=10\n", 4)
  tier: edge
  stdout: '0123456789=10

    '
- name: test_09_triple_call
  call: ft_print_numbers(); write(1, "-", 1); ft_print_numbers(); write(1, "-", 1);
    ft_print_numbers(); write(1, "\n", 1)
  tier: stress
  stdout: '0123456789-0123456789-0123456789

    '
- name: test_10_pipe_wrapped
  call: write(1, "|", 1); ft_print_numbers(); write(1, "|\n", 2)
  tier: edge
  stdout: '|0123456789|

    '
oracle_tests:
- name: edge_ft_print_numbers_oracle
  source: "\nvoid ft_print_numbers(void);\nint main(void)\n{\n    ft_print_numbers();\n\
    \    return (0);\n}\n"
  stdout: 0123456789
mode: c_function
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt (contract specification)
  command: eval ft_print_numbers
  args: []
  expected: Conform to subject.en.txt prototype and output specification
  cat_e: false
folder_examples:
- id: folder_ex_01
  origin: subject_folder/examples.txt
  input: ft_print_numbers baseline folder fixture
  expected: Matches reference correction
near_examples:
- id: near_subj_01_arity_perturbation
  derived_from: subj_ex_01
  strategy: Perturb argument count / adjacent input around subject.en.txt example
  original_input: eval ft_print_numbers
  perturbed_input:
  - ft_print_numbers_near_arg_1
  - ft_print_numbers_near_arg_2
- id: near_folder_01_boundary_neighbor
  derived_from: folder_ex_01
  strategy: Neighbouring perturbation of folder example (subject_folder/examples.txt)
  original_input: ft_print_numbers baseline folder fixture
  perturbed_input: gt_print_numbers baseline folder fixture
