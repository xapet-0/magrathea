subject_id: ft_putchar
fixed_tests:
- name: test_01_a
  call: ft_putchar('a')
  stdout: a
  tier: baseline
- name: test_02_z
  call: ft_putchar('z')
  stdout: z
  tier: baseline
- name: test_03_0
  call: ft_putchar('0')
  stdout: '0'
  tier: baseline
- name: test_04_newline
  call: ft_putchar('\n')
  stdout: '

    '
  tier: edge_case
- name: test_05_upper_A
  call: ft_putchar('A')
  tier: baseline
  stdout: A
- name: test_06_digit_9
  call: ft_putchar('9')
  tier: baseline
  stdout: '9'
- name: test_07_space
  call: ft_putchar(' ')
  tier: edge
  stdout: ' '
- name: test_08_tilde
  call: ft_putchar('~')
  tier: edge
  stdout: '~'
- name: test_09_tab
  call: ft_putchar('\t')
  tier: edge
  stdout: "\t"
- name: test_10_sequence_42
  call: ft_putchar('4'); ft_putchar('2'); ft_putchar('\n')
  tier: stress
  stdout: '42

    '
oracle_tests:
- name: oracle_stress
  source: "#include <unistd.h>\nvoid ft_putchar(char c);\nint main(void) {\n    ft_putchar('a');\n\
    \    ft_putchar('\\n');\n    ft_putchar('0');\n    return 0;\n}\n"
  stdout: 'a

    0'
mode: c_function
