  expr: ft_str_is_alpha("abcdefghijklmnopqrstuvwxyz")
  tier: baseline
  stdout: '1

    '
- name: test_06_all_uppercase
  expr: ft_str_is_alpha("ABCDEFGHIJKLMNOPQRSTUVWXYZ")
  tier: baseline
  stdout: '1

    '
- name: test_07_boundary_before_A
  expr: ft_str_is_alpha("@abc")
  tier: edge
  stdout: '0

    '
- name: test_08_boundary_after_Z
  expr: ft_str_is_alpha("ABC[")
  tier: edge
  stdout: '0

    '
- name: test_09_boundary_before_a
  expr: ft_str_is_alpha("abc`")
  tier: edge
  stdout: '0

    '
- name: test_10_boundary_after_z
  expr: ft_str_is_alpha("xyz{")
  tier: edge
  stdout: '0

    '
