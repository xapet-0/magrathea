mode: c_function
fixed_tests:
- name: pool_ft_putstr_non_printable_T01
  description: 'Functional verification of input: `ft_putstr_non_printable("Coucou\ntu
    vas bien `'
  expr: ft_putstr_non_printable("Coucou\ntu vas bien ?")
  stdout: 'Coucou\0atu vas bien ?

    '
  category: Functional
  tier: baseline
- name: pool_ft_putstr_non_printable_T02
  description: case_non_printable_tabs
  expr: ft_putstr_non_printable("A\tB\nC\177D")
  stdout: 'A\09B\0aC\7fD

    '
  category: Functional
  tier: baseline
- name: pool_ft_putstr_non_printable_T03
  description: case_non_printable_clean
  expr: ft_putstr_non_printable("Printable 42!")
  stdout: 'Printable 42!

    '
  category: Functional
  tier: baseline
- name: pool_ft_putstr_non_printable_T04
  description: case_putstr_non_printable_edges
  call: ft_putstr_non_printable(""); write(1, "\|", 1); ft_putstr_non_printable("a\nb");
    write(1, "\|", 1); ft_putstr_non_printable(" \t "); write(1, "\n", 1)
  stdout: "|a\\0ab| \\09 \n"
  category: Edge Case
  tier: baseline
- name: test_05_control_chars_1_to_3
  call: char s[] = {1, 2, 3, 0}; ft_putstr_non_printable(s); write(1, "\n", 1)
  tier: edge
  stdout: '\01\02\03

    '
- name: test_06_del_127
  call: char s[] = {127, 0}; ft_putstr_non_printable(s); write(1, "\n", 1)
  tier: edge
  stdout: '\7f

    '
- name: test_07_cr_vt_ff
  call: ft_putstr_non_printable("\r\v\f"); write(1, "\n", 1)
  tier: baseline
  stdout: '\0d\0b\0c

    '
- name: test_08_unit_separator_31
  call: char s[] = {31, ' ', 126, 0}; ft_putstr_non_printable(s); write(1, "\n", 1)
  tier: edge
  stdout: '\1f ~

    '
- name: test_09_bell_and_backspace
  call: ft_putstr_non_printable("\a\b"); write(1, "\n", 1)
  tier: baseline
  stdout: '\07\08

    '
- name: test_10_mixed_string
  call: ft_putstr_non_printable("Line1\nLine2\tEnd\r"); write(1, "\n", 1)
  tier: stress
  stdout: 'Line1\0aLine2\09End\0d

    '
