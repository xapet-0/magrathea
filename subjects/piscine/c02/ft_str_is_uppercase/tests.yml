mode: c_function
fixed_tests:
- name: pool_ft_str_is_uppercase_T01
  description: 'Functional verification of input: `ft_str_is_uppercase("ABC")`'
  expr: ft_str_is_uppercase("ABC")
  stdout: '1

    '
  category: Functional
  tier: baseline
- name: pool_ft_str_is_uppercase_T02
  description: 'Functional verification of input: `ft_str_is_uppercase("ABc")`'
  expr: ft_str_is_uppercase("ABc")
  stdout: '0

    '
  category: Functional
  tier: baseline
- name: pool_ft_str_is_uppercase_T03
  description: 'Functional verification of input: `ft_str_is_uppercase("")`'
  expr: ft_str_is_uppercase("")
