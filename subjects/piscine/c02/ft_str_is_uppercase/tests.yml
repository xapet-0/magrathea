  expr: ft_str_is_uppercase("@ABC")
  tier: edge
  stdout: '0

    '
- name: test_08_boundary_left_bracket
  expr: ft_str_is_uppercase("ABC[")
  tier: edge
  stdout: '0

    '
- name: test_09_with_space
  expr: ft_str_is_uppercase("HELLO WORLD")
  tier: edge
  stdout: '0

    '
- name: test_10_single_lower
  expr: ft_str_is_uppercase("a")
  tier: edge
  stdout: '0

    '
