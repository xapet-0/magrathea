subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./colle-2 42 | cat -e
  args:
  - '42'
  expected: 'forty two

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: ./colle-2 -42 | cat -e
  args:
  - '-42'
  expected: 'Error

    '
  cat_e: true
folder_examples:
- id: pool_colle02_T01
  origin: subject_folder/tests.yml (fixed_tests)
  input: '[''42'']'
  expected: forty two\n
- id: pool_colle02_T02
  origin: subject_folder/tests.yml (fixed_tests)
  input: '[''0'']'
  expected: zero\n
- id: pool_colle02_T03
  origin: subject_folder/tests.yml (fixed_tests)
  input: '[''100000'']'
  expected: one hundred thousand\n
near_examples:
- id: near_subj_01_lexical_shift
  derived_from: subj_ex_01
  strategy: Perturb numeric argument around subject.en.txt example
  original_input:
  - '42'
  perturbed_input:
  - '43'
- id: near_subj_02_lexical_shift
  derived_from: subj_ex_02
  strategy: Perturb negative error argument around subject.en.txt example
  original_input:
  - '-42'
  perturbed_input:
  - invalid
- id: near_subj_01_whitespace_envelope
  derived_from: subj_ex_01
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input:
  - '42'
  perturbed_input:
  - '  42  '
- id: near_subj_02_whitespace_envelope
  derived_from: subj_ex_02
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input:
  - '-42'
  perturbed_input:
  - '  -42  '
- id: near_folder_01_boundary_neighbor
  derived_from: pool_colle02_T01
  strategy: Neighbouring perturbation of folder example (subject_folder/tests.yml
    (fixed_tests))
  original_input: '[''42'']'
  perturbed_input: '[''43'']'
- id: near_folder_02_boundary_neighbor
  derived_from: pool_colle02_T02
  strategy: Neighbouring perturbation of folder example (subject_folder/tests.yml
    (fixed_tests))
  original_input: '[''0'']'
  perturbed_input: '[''1'']'
