project: c09_libft
scale_version: 1337HUB-v4.2
stop_on_first_failure: true
zero_tolerance_gates:
- segfault
- memory_leak
- norme_error
- forbidden_function
sections:
- id: preliminaries
  title: 'Step 1: Preliminaries & Vogsphere Integrity Check'
  points: 20
  checks:
  - Clone official Vogsphere repository into an empty folder and verify expected files
    (libft_creator.sh ft_putchar.c ft_swap.c ft_putstr.c ft_strlen.c ft_strcmp.c).
  - Run `norminette` and verify clean compilation with `cc -Wall -Wextra -Werror`.
  - 'Verify exact `c09_libft` prototype and allowed functions: write.'
- id: explain_before_checking
  title: 'Step 2: Conceptual Defense (Explain Before Checking)'
  points: 30
  checks:
  - Student explains pointer handling, memory safety, and control flow before running
    tests.
- id: live_mutation
  title: 'Step 3: Live Mutation & Edge-Case Verification'
  points: 50
  checks:
  - Call the function from a live test driver with NULL, empty, zero, and boundary
    values and verify deterministic return/output.
