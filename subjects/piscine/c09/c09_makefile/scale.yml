project: c09_makefile
scale_version: 1337HUB-v4.2
stop_on_first_failure: true
zero_tolerance_gates:
- missing_required_rule
- relink_on_second_make
- norme_error
sections:
- id: preliminaries
  title: 'Step 1: Preliminaries & Makefile Rules Check'
  points: 20
  checks:
  - Verify expected build file (Makefile) exists with no extraneous files.
  - Verify required rules (`$(NAME)`, `all`, `clean`, `fclean`, `re`), explicit object
    rules, and `cc -Wall -Wextra -Werror` compilation of library sources.
  - Run `make` twice consecutively and verify zero unnecessary relinking occurs.
- id: explain_before_checking
  title: 'Step 2: Build Graph & Dependency Defense'
  points: 30
  checks:
  - Student explains target dependencies, archive indexing (`ar rcs`), header paths,
    and cleanup targets.
- id: live_mutation
  title: 'Step 3: Live Clean/Rebuild & Edge-Case Verification'
  points: 50
  checks:
  - Execute `make fclean && make && make clean && make re` and verify clean archive
    linking against a C test driver.
