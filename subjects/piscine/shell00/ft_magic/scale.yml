project: ft_magic
scale_version: 1337HUB-v4.2
stop_on_first_failure: true
zero_tolerance_gates:
- syntax_error
- shnorm_error
- forbidden_command
sections:
- id: preliminaries
  title: 'Step 1: Preliminaries & Repository Integrity Check'
  points: 20
  checks:
  - Verify expected script (ft_magic) exists in the Vogsphere repository with no unauthorized
    files.
  - Run `shnorm` / POSIX shell hygiene checks and verify script execution without
    C compilation.
  - 'Verify only allowed shell commands/utilities are used: Standard shell / Unix
    commands permitted by subject.en.txt.'
- id: explain_before_checking
  title: 'Step 2: Conceptual Defense (Explain Before Checking)'
  points: 30
  checks:
  - Student explains pipelines, quoting/escaping, environment variables, and exit-status
    handling before executing tests.
- id: live_mutation
  title: 'Step 3: Live Environment & Edge-Case Verification'
  points: 50
  checks:
  - Run the script against varied environment variables, whitespace, and edge inputs
    checking exact `| cat -e` output.
