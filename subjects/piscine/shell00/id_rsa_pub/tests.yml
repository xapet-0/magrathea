mode: shell_file
fixed_tests:
- name: test_01_regex
  expected_regex: ^ssh-(rsa|ed25519|ecdsa)\s+[A-Za-z0-9+/=]+
  tier: baseline
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: cat id_rsa_pub
  args: []
  expected: 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAAB... user@host

    '
  cat_e: false
folder_examples:
- id: folder_ex_01
  origin: subject_folder/examples.txt
  input: id_rsa_pub baseline folder fixture
  expected: Matches reference correction
near_examples:
- id: near_subj_01_arity_perturbation
  derived_from: subj_ex_01
  strategy: Perturb public key header / format around subject.en.txt example
  original_input: cat id_rsa_pub
  perturbed_input:
  - id_rsa_pub_ed25519
  - id_rsa_pub_private_key_rejected
- id: near_folder_01_boundary_neighbor
  derived_from: folder_ex_01
  strategy: Neighbouring perturbation of folder example (subject_folder/examples.txt)
  original_input: id_rsa_pub baseline folder fixture
  perturbed_input: id_rsa_pub empty key fixture
