mode: c_function
fixed_tests:
- name: cur_ft_strcat_T01
  description: 'Functional verification of input: `char d[20] = "Hello"; ft_strcat(d,
    " World");`'
  call: char d[20] = "Hello"; ft_strcat(d, " World"); printf("%s\n", d)
  stdout: 'Hello World

    '
  category: Edge Case
  tier: baseline
- name: cur_ft_strcat_T02
  description: append_empty
  call: char d[20] = "42"; ft_strcat(d, ""); printf("%s\n", d)
  stdout: '42

    '
  category: Edge Case
  tier: baseline
- name: cur_ft_strcat_T03
  description: into_empty
  call: char d[20] = ""; ft_strcat(d, "1337"); printf("%s\n", d)
  stdout: '1337

    '
  category: Edge Case
  tier: baseline
- name: cur_ft_strcat_T04_return_pointer
  description: returns_dest_pointer
  call: char d[20] = "A"; char *r = ft_strcat(d, "BC"); printf("%s|%d\n", r, r ==
    d)
  stdout: 'ABC|1

    '
  category: Edge Case
  tier: edge_case
- name: test_05_both_empty
  call: char d[16] = ""; ft_strcat(d, ""); printf("[%s]\n", d)
  tier: edge
  stdout: '[]

    '
- name: test_06_chained_calls
  call: char d[32] = "1"; ft_strcat(d, "3"); ft_strcat(d, "3"); ft_strcat(d, "7");
    printf("%s\n", d)
  tier: stress
  stdout: '1337

    '
- name: test_07_spaces_and_symbols
  call: char d[32] = "foo "; ft_strcat(d, "bar!@#"); printf("%s\n", d)
  tier: baseline
  stdout: 'foo bar!@#

    '
- name: test_08_null_terminated
  call: char d[16] = "ab"; d[4] = 'X'; ft_strcat(d, "cd"); printf("%s|%d\n", d, d[4]
    == 0)
  tier: edge
  stdout: 'abcd|1

    '
- name: test_09_single_char_append
  call: char d[16] = "4"; ft_strcat(d, "2"); printf("%s\n", d)
  tier: baseline
  stdout: '42

    '
- name: test_10_longer_sentence
  call: char d[64] = "Welcome to "; ft_strcat(d, "Magrathea 42!"); printf("%s\n",
    d)
  tier: baseline
  stdout: 'Welcome to Magrathea 42!

    '
