- name: test_05_unsigned_char_high_byte
  call: printf("%d:%d\n", ft_strncmp("\200", "a", 1) > 0, ft_strncmp("a", "\200",
    1) < 0);
  tier: edge
  stdout: '0:0

    '
- name: test_06_empty_strings
  call: printf("%d:%d:%d\n", ft_strncmp("", "", 5), ft_strncmp("", "a", 1) < 0, ft_strncmp("a",
    "", 1) > 0);
  tier: edge
  stdout: '0:1:1

    '
- name: test_07_diff_after_n_ignored
  call: printf("%d\n", ft_strncmp("abcdef", "abcxyz", 3));
  tier: edge
  stdout: '0

    '
- name: test_08_prefix_shorter_first
  call: printf("%d:%d\n", ft_strncmp("abc", "abcdef", 3), ft_strncmp("abc", "abcdef",
    4) < 0);
  tier: baseline
  stdout: '0:1

    '
- name: test_09_first_char_diff
  call: printf("%d:%d\n", ft_strncmp("z", "a", 1) > 0, ft_strncmp("a", "z", 1) < 0);
  tier: baseline
  stdout: '1:1

    '
- name: test_10_stop_at_nul
  call: char a[] = {'a', 'b', 0, 'z'}; char b[] = {'a', 'b', 0, 'a'}; printf("%d\n",
    ft_strncmp(a, b, 4));
  tier: edge
  stdout: '0

    '
