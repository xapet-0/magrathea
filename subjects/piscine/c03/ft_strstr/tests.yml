mode: c_function
fixed_tests:
- name: cur_ft_strstr_T01
  description: 'Functional verification of input: `printf("%s\n", ft_strstr("Hello
    World", "Worl`'
  call: printf("%s\n", ft_strstr("Hello World", "World"))
  stdout: 'World

    '
  category: Functional
  tier: baseline
- name: cur_ft_strstr_T02
  description: empty_needle
  call: printf("%s\n", ft_strstr("1337", ""))
  stdout: '1337

    '
  category: Edge Case
  tier: baseline
- name: cur_ft_strstr_T03
  description: not_found
  call: printf("%d\n", ft_strstr("1337", "42") == NULL)
  stdout: '1

    '
  category: Edge Case
  tier: baseline
- name: cur_ft_strstr_T04
  description: repeated_prefix
  call: printf("%s\n", ft_strstr("aaab", "aab"))
  stdout: 'aab

    '
  category: Functional
  tier: baseline
- name: test_05_needle_at_start
  call: printf("%s\n", ft_strstr("abcdef", "abc"))
  tier: baseline
  stdout: 'abcdef

    '
- name: test_06_needle_equals_haystack
  call: printf("%s\n", ft_strstr("42school", "42school"))
  tier: baseline
  stdout: '42school

    '
- name: test_07_needle_longer_than_haystack
  call: printf("%d\n", ft_strstr("ab", "abcdef") == NULL)
  tier: edge
  stdout: '1

    '
- name: test_08_both_empty
  call: char s[] = ""; printf("%d\n", ft_strstr(s, "") == s)
  tier: edge
  stdout: '1

    '
- name: test_09_empty_haystack_nonempty_needle
  call: printf("%d\n", ft_strstr("", "a") == NULL)
  tier: edge
  stdout: '1

    '
- name: test_10_overlapping_prefix_backtrack
  call: printf("%s\n", ft_strstr("mississippi", "issip"))
  tier: stress
  stdout: 'issippi

    '
