subject_id: ft_sort_int_tab
fixed_tests:
- name: test_01_t_5_for_int_i_0_i_5
  call: int t[] = {5,3,1,4,2}; ft_sort_int_tab(t, 5); for(int i=0;i<5;i++) printf("%d
    ", t[i]); printf("\n")
  stdout: "1 2 3 4 5 \n"
  tier: baseline
- name: with_duplicates_and_negatives
  call: int a[] = {5, -2, 5, 0, -10}; ft_sort_int_tab(a, 5); printf("%d,%d,%d,%d,%d\n",
    a[0], a[1], a[2], a[3], a[4])
  stdout: '-10,-2,0,5,5

    '
  tier: baseline
- name: single_element
  call: int a[] = {42}; ft_sort_int_tab(a, 1); printf("%d\n", a[0])
  stdout: '42

    '
  tier: baseline
- name: already_sorted_and_zero_size
  call: int a[] = {-5, 0, 5, 10}; ft_sort_int_tab(a, 4); ft_sort_int_tab(a, 0); printf("%d,%d,%d,%d\n",
    a[0], a[1], a[2], a[3])
  stdout: '-5,0,5,10

    '
  tier: edge_case
- name: test_05_reverse_sorted
  call: int a[] = {9, 7, 5, 3, 1, -1}; ft_sort_int_tab(a, 6); for(int i=0;i<6;i++)
    printf("%d ", a[i]); printf("\n")
  tier: baseline
  stdout: "-1 1 3 5 7 9 \n"
- name: test_06_two_elements_swapped
  call: int a[] = {42, -42}; ft_sort_int_tab(a, 2); printf("%d,%d\n", a[0], a[1])
  tier: baseline
  stdout: '-42,42

    '
- name: test_07_all_identical
  call: int a[] = {7, 7, 7, 7}; ft_sort_int_tab(a, 4); printf("%d,%d,%d,%d\n", a[0],
    a[1], a[2], a[3])
  tier: edge
  stdout: '7,7,7,7

    '
- name: test_08_int_limits
  call: int a[] = {2147483647, 0, -2147483648, -1, 1}; ft_sort_int_tab(a, 5); for(int
    i=0;i<5;i++) printf("%d ", a[i]); printf("\n")
  tier: edge
  stdout: "-2147483648 -1 0 1 2147483647 \n"
- name: test_09_all_negatives
  call: int a[] = {-5, -100, -1, -42, -2}; ft_sort_int_tab(a, 5); for(int i=0;i<5;i++)
    printf("%d ", a[i]); printf("\n")
  tier: baseline
  stdout: "-100 -42 -5 -2 -1 \n"
- name: test_10_eight_elements_mixed
  call: int a[] = {42, 0, -13, 42, 100, -100, 1, -1}; ft_sort_int_tab(a, 8); for(int
    i=0;i<8;i++) printf("%d ", a[i]); printf("\n")
  tier: stress
  stdout: "-100 -13 -1 0 1 42 42 100 \n"
oracle_tests:
- name: ft_sort_int_tab_oracle_stress
  source: "static int is_sorted(int *a, int n)\n{\n    int i;\n    for (i = 1; i <\
    \ n; ++i)\n        if (a[i - 1] > a[i])\n            return (0);\n    return (1);\n\
    }\n\nint main(void)\n{\n    int a0[] = {42};\n    int a1[] = {5, 4, 3, 2, 1, 0,\
    \ -1, -1, 7};\n    int a2[] = {3, 3, 3, 2, 2, 1};\n    ft_sort_int_tab(a0, 1);\n\
    \    ft_sort_int_tab(a1, 9);\n    ft_sort_int_tab(a2, 6);\n    if (!is_sorted(a0,\
    \ 1) || !is_sorted(a1, 9) || !is_sorted(a2, 6))\n    {\n        fprintf(stderr,\
    \ \"ft_sort_int_tab did not sort ascending\\n\");\n        return (1);\n    }\n\
    \    return (0);\n}\n"
mode: c_function
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt (contract specification)
  command: eval ft_sort_int_tab
  args: []
  expected: Conform to subject.en.txt prototype and output specification
  cat_e: false
folder_examples:
- id: folder_ex_01
  origin: subject_folder/examples.txt
  input: ft_sort_int_tab baseline folder fixture
  expected: Matches reference correction
near_examples:
- id: near_subj_01_arity_perturbation
  derived_from: subj_ex_01
  strategy: Perturb argument count / adjacent input around subject.en.txt example
  original_input: eval ft_sort_int_tab
  perturbed_input:
  - ft_sort_int_tab_near_arg_1
  - ft_sort_int_tab_near_arg_2
- id: near_folder_01_boundary_neighbor
  derived_from: folder_ex_01
  strategy: Neighbouring perturbation of folder example (subject_folder/examples.txt)
  original_input: ft_sort_int_tab baseline folder fixture
  perturbed_input: gt_sort_int_tab baseline folder fixture
