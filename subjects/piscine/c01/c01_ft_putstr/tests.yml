subject_id: c01_ft_putstr
fixed_tests:
- name: test_01_Hello_World
  call: ft_putstr("Hello World")
  stdout: Hello World
  tier: baseline
- name: test_02_call
  call: ft_putstr("")
  stdout: ''
  tier: baseline
- name: edge_ft_putstr_spaces
  call: ft_putstr("42 school")
  stdout: 42 school
  tier: baseline
- name: empty_string
  call: ft_putstr(""); write(1, "\n", 1)
  stdout: '

    '
  tier: baseline
- name: single_char
  call: ft_putstr("Z"); write(1, "\n", 1)
  stdout: 'Z

    '
  tier: baseline
- name: with_spaces
  call: ft_putstr("1337 Benguerir"); write(1, "\n", 1)
  stdout: '1337 Benguerir

    '
  tier: baseline
- name: test_07_tabs_and_newlines
  call: ft_putstr("a\tb\nc\n")
  tier: edge
  stdout: "a\tb\nc\n"
- name: test_08_digits
  call: ft_putstr("0123456789\n")
  tier: baseline
  stdout: '0123456789

    '
- name: test_09_punctuation
  call: ft_putstr("!@#$%^&*()_+-=\n")
  tier: edge
  stdout: '!@#$%^&*()_+-=

    '
- name: test_10_embedded_nul
  call: char s[] = {'4', '2', 0, 'X', 0}; ft_putstr(s); write(1, "\n", 1)
  tier: edge
  stdout: '42

    '
mode: c_function
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt (contract specification)
  command: eval c01_ft_putstr
  args: []
  expected: Conform to subject.en.txt prototype and output specification
  cat_e: false
folder_examples:
- id: folder_ex_01
  origin: subject_folder/examples.txt
  input: c01_ft_putstr baseline folder fixture
  expected: Matches reference correction
near_examples:
- id: near_subj_01_arity_perturbation
  derived_from: subj_ex_01
  strategy: Perturb argument count / adjacent input around subject.en.txt example
  original_input: eval c01_ft_putstr
  perturbed_input:
  - c01_ft_putstr_near_arg_1
  - c01_ft_putstr_near_arg_2
- id: near_folder_01_boundary_neighbor
  derived_from: folder_ex_01
  strategy: Neighbouring perturbation of folder example (subject_folder/examples.txt)
  original_input: c01_ft_putstr baseline folder fixture
  perturbed_input: d01_ft_putstr baseline folder fixture
