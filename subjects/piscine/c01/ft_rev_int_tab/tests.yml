subject_id: ft_rev_int_tab
fixed_tests:
- name: test_01_t_5_for_int_i_0_i_5
  call: int t[] = {1,2,3,4,5}; ft_rev_int_tab(t, 5); for(int i=0;i<5;i++) printf("%d
    ", t[i]); printf("\n")
  stdout: "5 4 3 2 1 \n"
  tier: baseline
- name: single_elem
  call: int a[] = {42}; ft_rev_int_tab(a, 1); printf("%d\n", a[0])
  stdout: '42

    '
  tier: baseline
- name: even_length
  call: int a[] = {1, 2, 3, 4}; ft_rev_int_tab(a, 4); printf("%d,%d,%d,%d\n", a[0],
    a[1], a[2], a[3])
  stdout: '4,3,2,1

    '
  tier: baseline
- name: zero_length_tab
  call: int a[] = {7, 8}; ft_rev_int_tab(a, 0); printf("%d,%d\n", a[0], a[1])
  stdout: '7,8

    '
  tier: edge_case
- name: test_05_two_elements
  call: int a[] = {10, 20}; ft_rev_int_tab(a, 2); printf("%d,%d\n", a[0], a[1])
  tier: baseline
  stdout: '20,10

    '
- name: test_06_negatives
  call: int a[] = {-1, -2, -3, -4, -5}; ft_rev_int_tab(a, 5); printf("%d,%d,%d,%d,%d\n",
    a[0], a[1], a[2], a[3], a[4])
  tier: baseline
  stdout: '-5,-4,-3,-2,-1

    '
- name: test_07_int_limits
  call: int a[] = {-2147483648, 0, 2147483647}; ft_rev_int_tab(a, 3); printf("%d,%d,%d\n",
    a[0], a[1], a[2])
  tier: edge
  stdout: '2147483647,0,-2147483648

    '
- name: test_08_six_elements
  call: int a[] = {10, 20, 30, 40, 50, 60}; ft_rev_int_tab(a, 6); for(int i=0;i<6;i++)
    printf("%d ", a[i]); printf("\n")
  tier: baseline
  stdout: "60 50 40 30 20 10 \n"
- name: test_09_double_reverse_idempotent
  call: int a[] = {4, 8, 15, 16, 23, 42}; ft_rev_int_tab(a, 6); ft_rev_int_tab(a,
    6); for(int i=0;i<6;i++) printf("%d ", a[i]); printf("\n")
  tier: stress
  stdout: "4 8 15 16 23 42 \n"
- name: test_10_negative_size_untouched
  call: int a[] = {11, 22}; ft_rev_int_tab(a, -3); printf("%d,%d\n", a[0], a[1])
  tier: edge
  stdout: '11,22

    '
oracle_tests:
- name: ft_rev_int_tab_oracle_stress
  source: "static int same(int *a, int *b, int n)\n{\n    int i;\n    for (i = 0;\
    \ i < n; ++i)\n        if (a[i] != b[i])\n            return (0);\n    return\
    \ (1);\n}\n\nint main(void)\n{\n    int a0[] = {42};\n    int e0[] = {42};\n \
    \   int a1[] = {1, 2, 3, 4, 5};\n    int e1[] = {5, 4, 3, 2, 1};\n    int a2[]\
    \ = {-1, 7, 7, 0, 42, -9};\n    int e2[] = {-9, 42, 0, 7, 7, -1};\n    ft_rev_int_tab(a0,\
    \ 1);\n    ft_rev_int_tab(a1, 5);\n    ft_rev_int_tab(a2, 6);\n    if (!same(a0,\
    \ e0, 1) || !same(a1, e1, 5) || !same(a2, e2, 6))\n    {\n        fprintf(stderr,\
    \ \"ft_rev_int_tab mismatch\\n\");\n        return (1);\n    }\n    return (0);\n\
    }\n"
mode: c_function
