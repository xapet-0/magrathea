  call: int d = 0, m = 0; ft_div_mod(17, -5, &d, &m); printf("%d,%d\n", d, m)
  tier: edge
  stdout: '-3,2

    '
- name: test_06_neg_by_neg
  call: int d = 0, m = 0; ft_div_mod(-17, -5, &d, &m); printf("%d,%d\n", d, m)
  tier: edge
  stdout: '3,-2

    '
- name: test_07_dividend_smaller
  call: int d = 9, m = 9; ft_div_mod(3, 10, &d, &m); printf("%d,%d\n", d, m)
  tier: edge
  stdout: '0,3

    '
- name: test_08_divide_by_one
  call: int d = 0, m = 0; ft_div_mod(1337, 1, &d, &m); printf("%d,%d\n", d, m)
  tier: baseline
  stdout: '1337,0

    '
- name: test_09_int_max
  call: int d = 0, m = 0; ft_div_mod(2147483647, 10, &d, &m); printf("%d,%d\n", d,
    m)
  tier: stress
  stdout: '214748364,7

    '
- name: test_10_int_min
  call: int d = 0, m = 0; ft_div_mod(-2147483648, 10, &d, &m); printf("%d,%d\n", d,
