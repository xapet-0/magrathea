mode: c_function
fixed_tests:
- name: pool_ft_div_mod_T01
  description: 'Functional verification of input: `int d, m; ft_div_mod(10, 3, &d,
    &m); printf("`'
  call: int d, m; ft_div_mod(10, 3, &d, &m); printf("%d %d\n", d, m)
  stdout: '3 1

    '
  category: Edge Case
  tier: baseline
- name: pool_ft_div_mod_T02
  description: exact_div
  call: int d = 0, m = 0; ft_div_mod(42, 7, &d, &m); printf("%d,%d\n", d, m)
  stdout: '6,0

    '
  category: Edge Case
  tier: baseline
- name: pool_ft_div_mod_T03
  description: negative_dividend
  call: int d = 0, m = 0; ft_div_mod(-17, 5, &d, &m); printf("%d,%d\n", d, m)
  stdout: '-3,-2

    '
  category: Edge Case
  tier: baseline
- name: pool_ft_div_mod_T04_zero_dividend
  description: zero_dividend
  call: int d = 99, m = 99; ft_div_mod(0, 5, &d, &m); printf("%d,%d\n", d, m)
  stdout: '0,0

    '
  category: Edge Case
  tier: edge_case
