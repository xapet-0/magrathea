project: ft_boolean.h
scale_version: 1337HUB-v4.2
stop_on_first_failure: true
zero_tolerance_gates:
- compile_error
- norme_error
- missing_include_guard
sections:
- id: preliminaries
  title: 'Step 1: Preliminaries & Header Norm Check'
  points: 20
  checks:
  - Verify expected header (ft_boolean.h) exists with proper include guards and no
    unauthorized files.
  - Run `norminette -R CheckDefine` and verify clean inclusion in a test driver compiled
    with `cc -Wall -Wextra -Werror`.
- id: explain_before_checking
  title: 'Step 2: Conceptual Defense (Explain Before Checking)'
  points: 30
  checks:
  - Student explains include guards, macro parameter parenthesization, and declarations/typedefs
    before testing.
- id: live_mutation
  title: 'Step 3: Macro Expansion & Driver Verification'
  points: 50
  checks:
  - Include the header twice and test tricky expressions (operator precedence, signed
    boundaries) for deterministic behavior.
