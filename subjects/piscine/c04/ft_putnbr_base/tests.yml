  call: ft_putnbr_base(2147483647, "0123456789ABCDEF"); printf("\n")
  tier: edge
  stdout: '7FFFFFFF

    '
- name: test_10_custom_octal_poneyvif
  call: ft_putnbr_base(-64, "poneyvif"); printf("\n")
  tier: baseline
  stdout: '-opp

    '
