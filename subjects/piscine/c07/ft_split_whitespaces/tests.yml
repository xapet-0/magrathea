    0);
  stdout: 'single|1

    '
  category: Edge Case
  tier: baseline
- name: cur_ft_split_whitespaces_T04
  description: 'Functional verification of input: `char **w = ft_split_whitespaces("a
    b c d"); p`'
  call: char **w = ft_split_whitespaces("a b c d"); printf("%s,%s,%s,%s,%d\n", w[0],
    w[1], w[2], w[3], w[4] == 0);
  stdout: 'a,b,c,d,1

    '
  category: Edge Case
  tier: baseline
- name: test_05_empty_string
  call: char **w = ft_split_whitespaces(""); printf("%d\n", w[0] == 0);
  tier: edge
  stdout: '1

    '
- name: test_06_tabs_only
  call: char **w = ft_split_whitespaces("\t\t\t"); printf("%d\n", w[0] == 0);
  tier: edge
  stdout: '1

    '
- name: test_07_newlines_only
  call: char **w = ft_split_whitespaces("\n\n"); printf("%d\n", w[0] == 0);
  tier: edge
  stdout: '1

    '
- name: test_08_leading_and_trailing_spaces
  call: char **w = ft_split_whitespaces("   first   second   "); printf("%s|%s|%d\n",
    w[0], w[1], w[2] == 0);
  tier: baseline
  stdout: 'first|second|1

    '
- name: test_09_newlines_between_words
  call: char **w = ft_split_whitespaces("one\ntwo\nthree"); printf("%s,%s,%s,%d\n",
    w[0], w[1], w[2], w[3] == 0);
  tier: baseline
  stdout: 'one,two,three,1

    '
- name: test_10_five_words_mixed_ws
  call: char **w = ft_split_whitespaces(" \t 1 \n 2 \t 3   4 \n 5 "); for(int i=0;w[i];i++)
    printf("[%s]",w[i]); printf("\n");
  tier: stress
  stdout: '[1][2][3][4][5]

    '
