subject_id: csv_sum
fixed_tests:
- name: test_01_no_args
  files:
    data.csv: 'alice,student,100

      bob,staff,50

      charlie,student,42

      '
  env:
    FT_CSV: data.csv
  args: []
  stdout: '142

    '
  tier: baseline
- name: test_02_no_args
  files:
    data2.csv: 'bob,staff,50

      '
