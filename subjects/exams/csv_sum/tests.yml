      bob,student2,200

      marie claire,student,21

      '
  env:
    FT_CSV: data7.csv
  args: []
  stdout: '42

    '
  tier: edge_case
mode: shell
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
