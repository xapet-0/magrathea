mode: c_program
fixed_tests:
- name: can_alpha_mirror_T01
  description: 'Functional verification of input: `[''abc XYZ'']`'
  args:
  - abc XYZ
  expected: 'zyx CBA

    '
  category: Functional
  tier: baseline
- name: can_alpha_mirror_T02
  description: mixed_letters_symbols
  args:
  - My horse is Amazing.
  expected: 'Nb slihv rh Znzarmt.

    '
  category: Functional
  tier: baseline
- name: can_alpha_mirror_T03
  description: wrong_arg_count
  args: []
  expected: '

    '
  category: Functional
  tier: baseline
- name: can_alpha_mirror_T04
  description: case_level2_alpha_lower_alphabet
  args:
  - abcdefghijklmnopqrstuvwxyz
  expected: 'zyxwvutsrqponmlkjihgfedcba

    '
  category: Functional
  tier: baseline
- name: can_alpha_mirror_T05
  description: case_level2_alpha_upper_alphabet
  args:
  - ABCDEFGHIJKLMNOPQRSTUVWXYZ
  expected: 'ZYXWVUTSRQPONMLKJIHGFEDCBA

    '
  category: Functional
  tier: baseline
- name: can_alpha_mirror_T06
  description: case_level2_alpha_bad_argc_many
  args:
  - abc
  - def
  expected: '

    '
  category: Functional
  tier: baseline
- name: can_alpha_mirror_T07
  description: case_level2_alpha_mixed_punctuation
  args:
  - aBc-Zz!
  expected: 'zYx-Aa!

    '
  category: Functional
  tier: baseline
- name: can_alpha_mirror_T08
  description: edge_alpha_mirror_empty
  args:
  - ''
  expected: '

    '
  category: Edge Case
  tier: baseline
- name: can_alpha_mirror_T09
  description: edge_alpha_mirror_whitespace
  args:
  - " \t "
  expected: " \t \n"
  category: Edge Case
  tier: baseline
- name: subj_ex_01
  tier: subject_example
  args:
  - abc
  expected: 'zyx

    '
- name: near_ex_too_many_args
  tier: near_example
  args:
  - near_arg_1
  - near_arg_2
  expected: '

    '
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./alpha_mirror "abc"
  args: &id001
  - abc
  expected: 'zyx

    '
  cat_e: false
- id: subj_ex_02
  origin: subject.en.txt
  command: ./alpha_mirror "My horse is Amazing." | cat -e
  args: &id002
  - My horse is Amazing.
  expected: 'Nb slihv rh Znzarmt.

    '
  cat_e: true
- id: subj_ex_03
  origin: subject.en.txt
  command: ./alpha_mirror | cat -e
  args: []
  expected: '

    '
  cat_e: true
