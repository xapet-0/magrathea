subject_examples:
- id: subj_ex_01
  origin: subject.en.txt (contract specification)
  command: eval wdmatch_alt
  args: []
  expected: Conform to subject.en.txt prototype and output specification
  cat_e: false
folder_examples:
- id: cur_wdmatch_alt_T01
  origin: subject_folder/tests.yml (fixed_tests)
  input: '[''faya'', ''fgvvfdxcacpolhyghbreda'']'
  expected: faya\n
- id: cur_wdmatch_alt_T02
  origin: subject_folder/tests.yml (fixed_tests)
  input: '[''faya'', ''fgvvfdxcacpolhyghbred'']'
  expected: '`\n` (Clean newline termination)'
- id: cur_wdmatch_alt_T03
  origin: subject_folder/tests.yml (fixed_tests)
  input: '[''quarante deux'', ''qfqfsudf arzgsayns tsregfdgs sjytdekuoixq '']'
