near_examples:
- id: near_subj_01_arity_perturbation
  derived_from: subj_ex_01
  strategy: Perturb argument count / adjacent input around subject.en.txt example
  original_input: eval wdmatch_alt
  perturbed_input:
  - wdmatch_alt_near_arg_1
  - wdmatch_alt_near_arg_2
- id: near_folder_01_boundary_neighbor
  derived_from: cur_wdmatch_alt_T01
  strategy: Neighbouring perturbation of folder example (subject_folder/tests.yml
    (fixed_tests))
  original_input: '[''faya'', ''fgvvfdxcacpolhyghbreda'']'
  perturbed_input: '[''gaya'', ''fgvvfdxcacpolhyghbreda'']'
- id: near_folder_02_boundary_neighbor
  derived_from: cur_wdmatch_alt_T02
  strategy: Neighbouring perturbation of folder example (subject_folder/tests.yml
    (fixed_tests))
  original_input: '[''faya'', ''fgvvfdxcacpolhyghbred'']'
  perturbed_input: '[''gaya'', ''fgvvfdxcacpolhyghbred'']'
edge_cases:
- name: edge_01_B
  code: '[B]'
  title: Empty string and whitespace-only string in `wdmatch_alt`
  input: "wdmatch_alt(\"   \t\t   \")"
  expected: Print newline only with no extra spaces
- name: edge_02_B
  code: '[B]'
  title: Single word surrounded by spaces vs string without spaces in `wdmatch_alt`
  input: wdmatch_alt("   word   ") and wdmatch_alt("word")
  expected: Identical output 'word$' for both inputs
- name: edge_03_B
  code: '[B]'
  title: Extended ASCII characters and repetitive tokens in `wdmatch_alt`
  input: wdmatch_alt("aaa bbb ccc")
  expected: Format words with exact single space separation and terminating newline
- name: edge_04_B
  code: '[B]'
  title: Argument count check (argc < 2 or argc > 2) in `wdmatch_alt`
  input: Execute wdmatch_alt with no arguments and with 3 arguments
  expected: Print newline only
