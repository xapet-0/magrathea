edge_cases:
- name: edge_01_B
  code: '[B]'
  title: Empty array (size = 0), single element, and NULL pointer in `find_pivot`
  input: find_pivot(tab, 0) and find_pivot(NULL, 0)
  expected: Safe return without memory violation
- name: edge_02_B
  code: '[B]'
  title: Array with duplicate elements and all elements identical in `find_pivot`
  input: find_pivot([5, 5, 5, 5], 4)
  expected: Preserve stable sort or return correct count
- name: edge_03_B
  code: '[B]'
  title: Array already sorted in reverse order in `find_pivot`
  input: find_pivot([9, 8, 7, 6, 5], 5)
  expected: Properly sort array with no missing elements
- name: edge_04_T
  code: '[T]'
  title: Performance verification on large array in `find_pivot`
  input: Run find_pivot on array of 10,000 elements
  expected: Complete within timeout limit
fixed_tests:
- name: test_01_a_6
  expr: find_pivot(a, 6)
  setup:
  - int a[] = {1, 7, 3, 6, 5, 6}
  stdout: '3

    '
- name: test_02_a_3
  expr: find_pivot(a, 3)
  setup:
  - int a[] = {1, 2, 3}
  stdout: '-1

    '
- name: test_03_a_3
  expr: find_pivot(a, 3)
  setup:
  - int a[] = {2, 1, -1}
  stdout: '0

    '
- name: test_04_a_1
  expr: find_pivot(a, 1)
  setup:
  - int a[] = {42}
  stdout: '0

    '
- name: test_05_a_3
  expr: find_pivot(a, 3)
  setup:
  - int a[] = {-5, 5, 10}
  stdout: '2

    '
- name: test_06_pivot_at_index_0
  setup:
  - int a[] = {10, -5, 5};
  expr: find_pivot(a, 3)
  tier: edge
  stdout: '0

    '
- name: test_07_pivot_at_last_index
  setup:
  - int a[] = {5, -5, 99};
  expr: find_pivot(a, 3)
  tier: edge
  stdout: '2

    '
- name: test_08_all_zeros
  setup:
  - int a[] = {0, 0, 0, 0};
  expr: find_pivot(a, 4)
  tier: edge
  stdout: '0

    '
- name: test_09_negative_elements_pivot
  setup:
  - int a[] = {-3, -1, -2, 5, -4};
  expr: find_pivot(a, 5)
  tier: baseline
  stdout: '-1

    '
- name: test_10_seven_elements
  setup:
  - int a[] = {2, 4, 6, 99, 3, 4, 5};
  expr: find_pivot(a, 7)
  tier: stress
  stdout: '3

    '
