    free(a)
  tier: baseline
  stdout: '-4,-3,-2,-1,

    '
- name: test_09_pos_to_neg
  call: int *a=ft_rrange(2,-2); for(int i=0;i<5;i++) printf("%d,",a[i]); printf("\n");
    free(a)
  tier: edge
  stdout: '-2,-1,0,1,2,

