subject_id: only_digits_sh
fixed_tests:
- name: test_01
  env:
    FT_LINE: a1b2c3
  stdout: '123

    '
- name: test_02
  env:
    FT_LINE: 42 is 1337!
  stdout: '421337

    '
- name: test_03
  env:
    FT_LINE: abc
  stdout: '

    '
- name: test_04_leading_zeros
  env:
    FT_LINE: 007_bond_99
  stdout: '00799

    '
- name: test_05_empty_line
  env:
    FT_LINE: ''
  tier: edge
  stdout: '

    '
- name: test_06_all_digits
  env:
    FT_LINE: 0123456789
  tier: baseline
  stdout: '0123456789

    '
- name: test_07_symbols_only
  env:
    FT_LINE: '!@#$%^&*()_+-='
  tier: edge
  stdout: '

    '
- name: test_08_single_digit_in_text
  env:
    FT_LINE: hello 7 world
  tier: baseline
  stdout: '7

    '
- name: test_09_spaces_and_tabs_stripped
  env:
    FT_LINE: " 1 \t 3 \t 3 \t 7 "
  tier: edge
  stdout: '1337

    '
- name: test_10_long_interleaved
  env:
    FT_LINE: a9b8c7d6e5f4g3h2i1j0
  tier: stress
  stdout: '9876543210

    '
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: export FT_LINE="42 is the answer to 1337!"
  args:
  - FT_LINE=42 is the answer to 1337!
  expected: ''
  cat_e: false
- id: subj_ex_02
  origin: subject.en.txt
  command: ./only_digits_sh.sh | cat -e
  args: []
  expected: '421337

    '
  cat_e: true
folder_examples: []
near_examples:
- id: near_subj_01_lexical_shift
  derived_from: subj_ex_01
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input:
  - FT_LINE=42 is the answer to 1337!
  perturbed_input:
  - GT_LINE=42 is the answer to 1337!
- id: near_subj_01_whitespace_envelope
  derived_from: subj_ex_01
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input:
  - FT_LINE=42 is the answer to 1337!
  perturbed_input:
  - '  FT_LINE=42 is the answer to 1337!  '
