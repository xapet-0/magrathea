subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./epur_str "See? It's easy to print the same thing" | cat -e
  args: &id001
  - See? It's easy to print the same thing
  expected: 'See? It''s easy to print the same thing

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: ./epur_str " this        time it      will     be    more complex  . "
    | cat -e
  args: &id002
