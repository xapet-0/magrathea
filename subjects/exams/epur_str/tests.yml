mode: c_program
fixed_tests:
- name: can_epur_str_T01
  description: 'Functional verification of input: `[''  hello   world  '']`'
  args:
  - '  hello   world  '
  expected: 'hello world

    '
  category: Functional
  tier: baseline
- name: can_epur_str_T02
  description: case_tabs_spaces
  args:
  - "\t hello\t\tworld  42\t"
  expected: 'hello world 42

    '
  category: Edge Case
  tier: baseline
- name: can_epur_str_T03
  description: case_single_word
  args:
  - '   hello   '
  expected: 'hello

    '
  category: Edge Case
  tier: baseline
- name: can_epur_str_T04
  description: case_empty_after_trim
  args:
  - "     \t   "
  expected: '

    '
  category: Edge Case
  tier: baseline
- name: can_epur_str_T05
  description: case_bad_argc
  args: []
  expected: '

    '
  category: Functional
  tier: baseline
- name: subj_ex_01
  tier: subject_example
  args:
