near_examples:
- id: near_subj_01_lexical_shift
  derived_from: subj_ex_01
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input:
  - See? It's easy to print the same thing
  perturbed_input:
  - Tee? It's easy to print the same thing
- id: near_subj_01_whitespace_envelope
  derived_from: subj_ex_01
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input:
  - See? It's easy to print the same thing
  perturbed_input:
  - '  See? It''s easy to print the same thing  '
- id: near_subj_02_lexical_shift
  derived_from: subj_ex_02
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input:
  - ' this        time it      will     be    more complex  . '
  perturbed_input:
  - ' uhis        time it      will     be    more complex  . '
- id: near_subj_02_whitespace_envelope
  derived_from: subj_ex_02
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input:
  - ' this        time it      will     be    more complex  . '
  perturbed_input:
  - '   this        time it      will     be    more complex  .   '
- id: near_subj_03_lexical_shift
  derived_from: subj_ex_03
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input:
  - No S*** Sherlock...
  - nAw S*** ShErLaWQ...
  perturbed_input:
  - Oo S*** Sherlock...
  - oAw S*** ShErLaWQ...
- id: near_subj_03_whitespace_envelope
  derived_from: subj_ex_03
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input:
  - No S*** Sherlock...
  - nAw S*** ShErLaWQ...
  perturbed_input:
  - '  No S*** Sherlock...  '
  - nAw S*** ShErLaWQ...
- id: near_subj_04_lexical_shift
  derived_from: subj_ex_04
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input:
  - ''
  perturbed_input:
  - ' '
- id: near_subj_04_whitespace_envelope
  derived_from: subj_ex_04
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input:
  - ''
  perturbed_input:
  - '    '
- id: near_folder_01_boundary_neighbor
  derived_from: can_epur_str_T06
  strategy: Neighbouring perturbation of folder example (subject_folder/42ExamPractice/epur_str/tester.sh)
  original_input: ./epur_str "comme c'est cocasse" "vous avez entendu, Mathilde ?"
  perturbed_input: ./epur_str 'domme c'"'"'est cocasse' 'wous avez entendu, Mathilde
    ?'
- id: near_folder_02_boundary_neighbor
  derived_from: can_epur_str_T07
  strategy: Neighbouring perturbation of folder example (subject_folder/42ExamPractice/epur_str/tester.sh)
  original_input: ./epur_str "See? It's easy to print the same thing"
  perturbed_input: ./epur_str 'Tee? It'"'"'s easy to print the same thing'
