edge_cases:
- name: edge_01_B
  code: '[B]'
  title: Empty array (size = 0), single element, and NULL pointer in `unmatch`
  input: unmatch(tab, 0) and unmatch(NULL, 0)
  expected: Safe return without memory violation
- name: edge_02_B
  code: '[B]'
  title: Array with duplicate elements and all elements identical in `unmatch`
  input: unmatch([5, 5, 5, 5], 4)
  expected: Preserve stable sort or return correct count
- name: edge_03_B
  code: '[B]'
  title: Array already sorted in reverse order in `unmatch`
  input: unmatch([9, 8, 7, 6, 5], 5)
  expected: Properly sort array with no missing elements
- name: edge_04_T
  code: '[T]'
  title: Performance verification on large array in `unmatch`
  input: Run unmatch on array of 10,000 elements
  expected: Complete within timeout limit
fixed_tests:
- name: test_01_a_7
  expr: unmatch(a, 7)
  setup:
  - int a[] = {1, 1, 2, 4, 3, 4, 2};
  stdout: '3

    '
- name: test_02_a_1
  expr: unmatch(a, 1)
  setup:
  - int a[] = {42};
  stdout: '42

    '
- name: test_03_a_5
  expr: unmatch(a, 5)
  setup:
  - int a[] = {9, 7, 9, 5, 7};
  stdout: '5

    '
- name: test_04_a_3
  expr: unmatch(a, 3)
  setup:
  - int a[] = {-1, -1, -42};
  stdout: '-42

    '
- name: test_05_unmatched_at_first
  setup:
  - int a[] = {99, 1, 1, 2, 2};
  expr: unmatch(a, 5)
  tier: edge
  stdout: '99

    '
- name: test_06_unmatched_at_last
  setup:
  - int a[] = {1, 1, 2, 2, 77};
  expr: unmatch(a, 5)
  tier: edge
  stdout: '77

    '
- name: test_07_odd_multiplicity_3
  setup:
  - int a[] = {5, 5, 5};
  expr: unmatch(a, 3)
  tier: edge
  stdout: '5

    '
- name: test_08_zero_is_unmatched
  setup:
  - int a[] = {4, 0, 4};
  expr: unmatch(a, 3)
  tier: edge
  stdout: '0

    '
- name: test_09_negative_pairs
  setup:
  - int a[] = {-10, -20, -10, -30, -20};
  expr: unmatch(a, 5)
  tier: baseline
  stdout: '-30

    '
- name: test_10_nine_elements
  setup:
  - int a[] = {10, 20, 30, 40, 1337, 40, 30, 20, 10};
  expr: unmatch(a, 9)
  tier: stress
  stdout: '1337

    '
