fixed_tests:
- name: test_01_stdin
  stdin: "  hello   world  \nignore\n  foo   bar  \n"
  stdout: 'hello world

    foo bar

    '
  tier: baseline
- name: folder_ex_01
  tier: folder_example
  args: []
  stdout: 'hello world

    foo bar

    '
  stdin: "  hello   world  \nignore\n  foo   bar  \n"
- name: folder_ex_02
  tier: folder_example
  args: []
  stdout: '42 1337

    '
  stdin: "   42   1337   \n"
- name: folder_ex_03
  tier: folder_example
  args: []
  stdout: 'a b

    e f

    '
  stdin: 'a   b

    c   d

    e   f

    '
- name: odd_epur_tabs_and_multiple_spaces
  args: []
  stdin: "\t  one\t\t two   three \t\nignored_even\n\t four\n"
  stdout: 'one two three

    four

    '
  tier: edge_case
- name: odd_epur_even_line_count
  args: []
  stdin: 'first

    second

    third

    fourth

    '
  stdout: 'first

    third

    '
  tier: edge_case
- name: odd_epur_single_line
  args: []
  stdin: "   solo   \n"
  stdout: 'solo

    '
  tier: edge_case
- name: odd_epur_empty_input
  args: []
  stdin: ''
  stdout: ''
  tier: edge_case
subject_id: odd_epur
mode: shell
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: printf "  hello   world  \nignore\n  foo   bar  \n" | sh odd_epur.sh |
    cat -e
  args:
  - '  hello   world  \nignore\n  foo   bar  \n'
  expected: 'hello world

    foo bar

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: printf "   42   1337   \n" | sh odd_epur.sh | cat -e
  args:
  - '   42   1337   \n'
  expected: '42 1337

    '
  cat_e: true
- id: subj_ex_03
  origin: subject.en.txt
  command: printf "a   b\nc   d\ne   f\n" | sh odd_epur.sh | cat -e
  args:
  - a   b\nc   d\ne   f\n
  expected: 'a b

    e f

    '
  cat_e: true
folder_examples:
- id: e1337_odd_epur_T04
  origin: subject_folder/examples.txt
  input: printf "  hello   world  \nignore\n  foo   bar  \n" \| sh odd_epur.sh \|
    cat -e
  expected: hello world$\nfoo bar$
- id: e1337_odd_epur_T05
  origin: subject_folder/examples.txt
  input: printf "   42   1337   \n" \| sh odd_epur.sh \| cat -e
  expected: 42 1337$
- id: e1337_odd_epur_T06
  origin: subject_folder/examples.txt
  input: printf "a   b\nc   d\ne   f\n" \| sh odd_epur.sh \| cat -e
  expected: a b$\ne f$
- id: folder_fixture_04
  origin: subject_folder/tests.yml
  input: tests.yml
  expected: "fixed_tests:\n- stdin: \"  hello   world  \\nignore\\n  foo   bar  \\\
    n\"\n  stdout: 'hello world\n\n    foo bar\n\n    '\n- stdin: \"   42   1337 \
    \  \\n\"\n  stdout: '42 1337\n\n "
near_examples:
- id: near_subj_01_lexical_shift
  derived_from: subj_ex_01
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input:
  - '  hello   world  \nignore\n  foo   bar  \n'
  perturbed_input:
  - '  iello   world  \nignore\n  foo   bar  \n'
- id: near_subj_01_whitespace_envelope
  derived_from: subj_ex_01
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input:
  - '  hello   world  \nignore\n  foo   bar  \n'
  perturbed_input:
  - '    hello   world  \nignore\n  foo   bar  \n  '
- id: near_subj_02_lexical_shift
  derived_from: subj_ex_02
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input:
  - '   42   1337   \n'
  perturbed_input:
  - '   42   1337   \o'
- id: near_subj_02_whitespace_envelope
  derived_from: subj_ex_02
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input:
  - '   42   1337   \n'
  perturbed_input:
  - '     42   1337   \n  '
- id: near_subj_03_lexical_shift
  derived_from: subj_ex_03
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input:
  - a   b\nc   d\ne   f\n
  perturbed_input:
  - b   b\nc   d\ne   f\n
- id: near_subj_03_whitespace_envelope
  derived_from: subj_ex_03
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input:
  - a   b\nc   d\ne   f\n
  perturbed_input:
  - '  a   b\nc   d\ne   f\n  '
