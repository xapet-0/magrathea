subject_id: odd_epur
mode: shell
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: printf "  hello   world  \nignore\n  foo   bar  \n" | sh odd_epur.sh |
    cat -e
  args: &id001
  - '  hello   world  \nignore\n  foo   bar  \n'
  expected: 'hello world

    foo bar

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: printf "   42   1337   \n" | sh odd_epur.sh | cat -e
  args: &id002
  - '   42   1337   \n'
  expected: '42 1337

    '
  cat_e: true
- id: subj_ex_03
  origin: subject.en.txt
  command: printf "a   b\nc   d\ne   f\n" | sh odd_epur.sh | cat -e
  args: &id003
