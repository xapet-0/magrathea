  - k'aime le fromage de chevre
- id: near_subj_02_whitespace_envelope
  derived_from: subj_ex_02
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input: *id002
  perturbed_input:
  - '  j''aime le fromage de chevre  '
- id: near_subj_03_arity_perturbation
  derived_from: subj_ex_03
  strategy: Perturb argument count / adjacent input around subject.en.txt example
  original_input: ./aff_first_param
  perturbed_input:
  - aff_first_param_near_arg_1
  - aff_first_param_near_arg_2
- id: near_folder_01_boundary_neighbor
  derived_from: can_aff_first_param_T05
  strategy: Neighbouring perturbation of folder example (subject_folder/examples.txt)
  original_input: ./aff_first_param vincent mit "l'ane" dans un pre et "s'en" vint
    \| cat -e
  perturbed_input: ./bff_first_param vincent mit "l'ane" da
