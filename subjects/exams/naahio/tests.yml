mode: c_program
fixed_tests:
- name: cur_naahio_T01
  description: 'Functional verification of input: `[''Hello_Open_AI_is_cool'']`'
  args:
  - Hello_Open_AI_is_cool
  expected: 'Reversed: cool is AI Open Hello

    Vowel count: 9

    '
  category: Functional
  tier: baseline
- name: cur_naahio_T02
  description: 'Functional verification of input: `[''1337_is_awesome'']`'
  args:
  - 1337_is_awesome
  expected: 'Reversed: awesome is 1337

    Vowel count: 5

    '
  category: Functional
  tier: baseline
- name: cur_naahio_T03
  description: Standard baseline execution and behavior check for `naahio`
  args: []
  expected: '

    '
  category: Functional
  tier: baseline
- name: cur_naahio_T04
  description: edge_empty_str
  args:
  - ''
  expected: "Reversed: \nVowel count: 0\n"
  category: Edge Case
  tier: baseline
- name: cur_naahio_T05
  description: edge_whitespace
  args:
  - "   \t  "
  expected: "Reversed: \t\nVowel count: 0\n"
  category: Edge Case
  tier: baseline
- name: edge_naahio_underscores_only
  args:
  - ___
  expected: "Reversed: \nVowel count: 0\n"
  tier: edge_case
- name: edge_naahio_vowels_only
  args:
  - AEIOUaeiou
  expected: 'Reversed: AEIOUaeiou

    Vowel count: 10

    '
  tier: edge_case
- name: edge_naahio_single_letters
  args:
  - a_b_c
  expected: 'Reversed: c b a

    Vowel count: 1

    '
  tier: edge_case
- name: edge_naahio_extra_arg
  args:
  - a
  - b
  expected: '

    '
  tier: edge_case
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./naahio Hello_Open_AI_is_cool | cat -e
  args:
  - Hello_Open_AI_is_cool
  expected: 'Reversed: cool is AI Open Hello

    Vowel count: 9

    '
  cat_e: true
folder_examples:
- id: cur_naahio_T01
  origin: subject_folder/tests.yml (fixed_tests)
  input: '[''Hello_Open_AI_is_cool'']'
  expected: 'Reversed: cool is AI Open Hello\nVowel count: 9\n'
- id: cur_naahio_T02
  origin: subject_folder/tests.yml (fixed_tests)
  input: '[''1337_is_awesome'']'
  expected: 'Reversed: awesome is 1337\nVowel count: 5\n'
- id: cur_naahio_T03
  origin: subject_folder/tests.yml (fixed_tests)
  input: '`./naahio` (no CLI arguments passed, `argc == 1`)'
  expected: '`\n` (Clean newline termination)'
near_examples:
- id: near_subj_01_lexical_shift
  derived_from: subj_ex_01
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input:
  - Hello_Open_AI_is_cool
  perturbed_input:
  - Iello_Open_AI_is_cool
- id: near_subj_01_whitespace_envelope
  derived_from: subj_ex_01
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input:
  - Hello_Open_AI_is_cool
  perturbed_input:
  - '  Hello_Open_AI_is_cool  '
- id: near_folder_01_boundary_neighbor
  derived_from: cur_naahio_T01
  strategy: Neighbouring perturbation of folder example (subject_folder/tests.yml
    (fixed_tests))
  original_input: '[''Hello_Open_AI_is_cool'']'
  perturbed_input: '[''Iello_Open_AI_is_cool'']'
- id: near_folder_02_boundary_neighbor
  derived_from: cur_naahio_T02
  strategy: Neighbouring perturbation of folder example (subject_folder/tests.yml
    (fixed_tests))
  original_input: '[''1337_is_awesome'']'
  perturbed_input: '[''1337_js_awesome'']'
