edge_cases:
- name: edge_01_B
  code: '[B]'
  title: Extreme boundary values (INT_MIN, INT_MAX, 0, 1, -1) in `ft_sub`
  input: ft_sub(INT_MIN), ft_sub(0), ft_sub(1)
  expected: Correct mathematical result without signed overflow UB
- name: edge_02_S
  code: '[S]'
  title: Arithmetic overflow and infinite recursion protection in `ft_sub`
  input: Run ft_sub with large inputs
  expected: Safe return or termination without stack overflow
- name: edge_03_B
  code: '[B]'
  title: Zero factorial and power edge cases in `ft_sub`
  input: ft_sub(0)
  expected: Canonical mathematical result for 0
- name: edge_04_T
  code: '[T]'
  title: Time complexity guard against exponential runtime in `ft_sub`
  input: Call ft_sub on large prime or composite integer
  expected: Execute within 0.5s limit without timing out
fixed_tests:
- name: test_01_d_n_x
  call: printf("%d\n", x)
  setup:
  - int x = 50
  - ft_sub(8, &x)
  stdout: '42

    '
- name: test_02_d_n_x
  call: printf("%d\n", x)
  setup:
  - int x = 0
  - ft_sub(10, &x)
  stdout: '-10

    '
- name: test_03_d_n_x
  call: printf("%d\n", x)
  setup:
  - int x = -10
  - ft_sub(-10, &x)
  stdout: '0

    '
- name: test_04_d_n_x
  call: printf("%d\n", x)
  setup:
  - int x = 42
  - ft_sub(0, &x)
  stdout: '42

    '
- name: test_05_positive_to_negative
  setup:
  - int x = 5
  - ft_sub(15, &x)
  call: printf("%d\n", x)
  tier: baseline
  stdout: '-10

    '
- name: test_06_subtract_negative_adds
  setup:
  - int x = 30
  - ft_sub(-12, &x)
  call: printf("%d\n", x)
  tier: edge
  stdout: '42

    '
- name: test_07_equal_values_to_zero
  setup:
  - int x = 1337
  - ft_sub(1337, &x)
  call: printf("%d\n", x)
  tier: edge
  stdout: '0

    '
- name: test_08_chained_subs
  setup:
  - int x = 100
  - ft_sub(30, &x)
  - ft_sub(28, &x)
  call: printf("%d\n", x)
  tier: baseline
  stdout: '42

    '
- name: test_09_neg_minus_pos
  setup:
  - int x = -50
  - ft_sub(50, &x)
  call: printf("%d\n", x)
  tier: baseline
  stdout: '-100

    '
- name: test_10_large_numbers
  setup:
  - int x = 1000000
  - ft_sub(999958, &x)
  call: printf("%d\n", x)
  tier: stress
  stdout: '42

    '
