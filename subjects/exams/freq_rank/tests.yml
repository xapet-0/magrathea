subject_id: freq_rank
mode: shell
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: printf "b\na\nb\n" | sh freq_rank.sh | cat -e
  args:
  - b\na\nb\n
  expected: '2 b

    1 a

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: printf "x\nx\nx\ny\n" | sh freq_rank.sh | cat -e
  args:
  - x\nx\nx\ny\n
  expected: '3 x

    1 y

    '
  cat_e: true
- id: subj_ex_03
  origin: subject.en.txt
  command: printf "42\n" | sh freq_rank.sh | cat -e
  args:
  - 42\n
  expected: '1 42

    '
  cat_e: true
folder_examples:
- id: e1337_freq_rank_T04
  origin: subject_folder/examples.txt
  input: printf "b\na\nb\n" \| sh freq_rank.sh \| cat -e
  expected: 2 b$\n1 a$
- id: e1337_freq_rank_T05
