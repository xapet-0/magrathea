- id: near_folder_01_boundary_neighbor
  derived_from: e1337_freq_rank_T04
  strategy: Neighbouring perturbation of folder example (subject_folder/examples.txt)
  original_input: printf "b\na\nb\n" \| sh freq_rank.sh \| cat -e
  perturbed_input: qrintf "b\na\nb\n" \| sh freq_rank.sh \|
