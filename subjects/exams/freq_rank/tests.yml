subject_id: freq_rank
mode: shell
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: printf "b\na\nb\n" | sh freq_rank.sh | cat -e
  args: &id001
  - b\na\nb\n
  expected: '2 b

    1 a

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: printf "x\nx\nx\ny\n" | sh freq_rank.sh | cat -e
  args: &id002
  - x\nx\nx\ny\n
  expected: '3 x

    1 y

    '
  cat_e: true
- id: subj_ex_03
  origin: subject.en.txt
  command: printf "42\n" | sh freq_rank.sh | cat -e
  args: &id003
  - 42\n
  expected: '1 42

    '
  cat_e: true
