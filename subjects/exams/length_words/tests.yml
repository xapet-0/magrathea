mode: c_program
fixed_tests:
- name: cur_length_words_T01
  description: 'Functional verification of input: `[''Hello world!'']`'
  args:
  - Hello world!
  expected: '5, 6

    '
  category: Functional
  tier: baseline
- name: cur_length_words_T02
  description: 'Functional verification of input: `[''Hi there how are you?'']`'
  args:
  - Hi there how are you?
  expected: '2, 5, 3, 3, 4

    '
  category: Functional
  tier: baseline
- name: cur_length_words_T03
  description: 'Functional verification of input: `['''']`'
  args:
  - ''
  expected: '

    '
  category: Functional
  tier: baseline
- name: cur_length_words_T04
  description: Standard baseline execution and behavior check for `length_words`
  args: []
  expected: '

    '
  category: Functional
  tier: baseline
- name: near_ex_too_many_args
  tier: near_example
  args:
  - arg1
  - arg2
  expected: '

    '
- name: edge_lw_tabs_spaces
  args:
  - "  hello\t\tworld   42  "
  stdout: '5, 5, 2

    '
  tier: edge_case
- name: edge_lw_only_ws
  args:
  - "   \t  "
  stdout: '

    '
  tier: edge_case
- name: edge_lw_single_char
  args:
  - x
  stdout: '1

    '
  tier: edge_case
- name: edge_lw_extra_arg
  args:
  - a
  - b
  stdout: '

    '
  tier: edge_case
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./length_words "Hello world!" | cat -e
  args:
  - Hello world!
  expected: '5, 6

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: ./length_words "Hi there how are you?" | cat -e
  args:
  - Hi there how are you?
  expected: '2, 5, 3, 3, 4

    '
  cat_e: true
- id: subj_ex_03
  origin: subject.en.txt
  command: ./length_words "" | cat -e
  args:
  - ''
  expected: '

    '
  cat_e: true
folder_examples:
- id: cur_length_words_T05
