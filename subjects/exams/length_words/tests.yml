edge_cases:
- name: edge_01_B
  code: '[B]'
  title: Empty string and whitespace-only string in `length_words`
  input: "length_words(\"   \t\t   \")"
  expected: Print newline only with no extra spaces
- name: edge_02_B
  code: '[B]'
  title: Single word surrounded by spaces vs string without spaces in `length_words`
  input: length_words("   word   ") and length_words("word")
  expected: Identical output 'word$' for both inputs
- name: edge_03_B
  code: '[B]'
  title: Extended ASCII characters and repetitive tokens in `length_words`
  input: length_words("aaa bbb ccc")
  expected: Format words with exact single space separation and terminating newline
- name: edge_04_B
  code: '[B]'
  title: Argument count check (argc < 2 or argc > 2) in `length_words`
  input: Execute length_words with no arguments and with 3 arguments
  expected: Print newline only
