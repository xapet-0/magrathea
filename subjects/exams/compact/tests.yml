subject_id: compact
fixed_tests:
- name: test_01_a_4
  setup:
  - char *a[] = {"a", 0, "b", 0};
  expr: compact(a, 4)
  stdout: '2

    '
  tier: baseline
- name: test_02_a_3
  setup:
  - char *a[] = {0, 0, 0};
  expr: compact(a, 3)
  stdout: '0

    '
  tier: baseline
- name: test_03_a_3
  setup:
  - char *a[] = {"1337", "42", "ok"};
  expr: compact(a, 3)
  stdout: '3

    '
  tier: baseline
- name: test_04_d_s_s_n_n_a_0_a_1
  setup:
  - char *a[] = {0, "first", 0, "second"}; int n = compact(a, 4);
  call: printf("%d:%s,%s\n", n, a[0], a[1])
  stdout: '2:first,second

    '
  tier: baseline
- name: test_05_zero_size
  setup:
  - char *a[] = {"x"};
  expr: compact(a, 0)
  tier: edge
  stdout: '0

    '
- name: test_06_null_tab
  expr: compact(NULL, 0)
  tier: edge
  stdout: '0

    '
- name: test_07_single_non_null
  setup:
  - char *a[] = {"only"};
  expr: compact(a, 1)
  tier: baseline
  stdout: '1

    '
- name: test_08_single_null
  setup:
  - char *a[] = {0};
  expr: compact(a, 1)
  tier: edge
  stdout: '0

    '
- name: test_09_leading_and_trailing_nulls
  setup:
  - char *a[] = {0, 0, "mid", 0, 0}; int n = compact(a, 5);
  call: printf("%d:%s\n", n, a[0])
  tier: edge
  stdout: '1:mid

    '
- name: test_10_six_elements_alternating
  setup:
  - char *a[] = {"1", 0, "2", 0, "3", 0}; int n = compact(a, 6);
  call: printf("%d:%s,%s,%s\n", n, a[0], a[1], a[2])
  tier: stress
  stdout: '3:1,2,3

    '
mode: c_function
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt (contract specification)
  command: eval compact
  args: []
  expected: Conform to subject.en.txt prototype and output specification
  cat_e: false
folder_examples:
- id: e1337_compact_T05
  origin: subject_folder/examples.txt
  input: 'If tab = {"a", NULL, "b", NULL} and length = 4:'
  expected: compact(tab, 4) returns 2, and tab[0] == "a", tab[1] == "b".
- id: folder_fixture_02
  origin: subject_folder/tests.yml
  input: tests.yml
  expected: "subject_id: compact\nfixed_tests:\n- setup:\n  - char *a[] = {\"a\",\
    \ 0, \"b\", 0};\n  expr: compact(a, 4)\n  stdout: '2\n\n    '\n- setup:\n  - char\
    \ *a[] = {0, 0, 0};\n  expr"
near_examples:
- id: near_subj_01_arity_perturbation
  derived_from: subj_ex_01
  strategy: Perturb argument count / adjacent input around subject.en.txt example
  original_input: eval compact
  perturbed_input:
  - compact_near_arg_1
  - compact_near_arg_2
- id: near_folder_01_boundary_neighbor
  derived_from: e1337_compact_T05
  strategy: Neighbouring perturbation of folder example (subject_folder/examples.txt)
  original_input: 'If tab = {"a", NULL, "b", NULL} and length = 4:'
  perturbed_input: Jf tab = {"a", NULL, "b", NULL} and leng
- id: near_folder_02_boundary_neighbor
  derived_from: folder_fixture_02
  strategy: Neighbouring perturbation of folder example (subject_folder/tests.yml)
  original_input: tests.yml
  perturbed_input: uests.yml
