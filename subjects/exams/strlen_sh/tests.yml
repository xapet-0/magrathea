mode: shell
fixed_tests:
- name: subj_ex_len_16
  tier: subject_example
  env:
    FT_LINE: 0123456789abcdef
  args: []
  stdout: '16

    '
- name: folder_ex_len_0
  tier: folder_example
  env:
    FT_LINE: ''
  args: []
  stdout: '0

    '
- name: near_ex_len_17_perturbed
  tier: near_example
  env:
    FT_LINE: 0123456789abcdefX
  args: []
  stdout: '17

    '
- name: edge_ex_len_4
  tier: edge_case
  env:
    FT_LINE: '1337'
  args: []
  stdout: '4

    '
- name: edge_ex_sentence_len_35
  env:
    FT_LINE: '42 Piscine Exam Shell: hello world!'
  args: []
  stdout: '35

    '
  tier: edge_case
- name: edge_ex_spaces_and_tabs
  env:
    FT_LINE: "  a\tb  "
  args: []
  stdout: '7

    '
  tier: edge_case
- name: edge_ex_single_char
  env:
    FT_LINE: Z
  args: []
  stdout: '1

    '
  tier: edge_case
- name: edge_ex_punctuation
  env:
    FT_LINE: '!@#$%^&*()_+'
  args: []
  stdout: '12

    '
  tier: edge_case
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: export FT_LINE="Les putes, c'est comme les chevilles, ca enfle."
  args:
  - FT_LINE=Les putes, c'est comme les chevilles, ca enfle.
  expected: ''
  cat_e: false
- id: subj_ex_02
  origin: subject.en.txt
  command: ./strlen.sh | cat -e
  args: []
  expected: '48

    '
  cat_e: true
folder_examples:
- id: sh_strlen_sh_T01
  origin: subject_folder/tests.yml (fixed_tests)
  input: '`sh strlen_sh.sh` (standard shell environment)'
  expected: 16\n
- id: sh_strlen_sh_T02
  origin: subject_folder/tests.yml (fixed_tests)
  input: '`sh strlen_sh.sh` (standard shell environment)'
  expected: 0\n
- id: sh_strlen_sh_T03
  origin: subject_folder/tests.yml (fixed_tests)
  input: '`sh strlen_sh.sh` (standard shell environment)'
  expected: 24\n
near_examples:
- id: near_subj_01_lexical_shift
  derived_from: subj_ex_01
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input:
  - FT_LINE=Les putes, c'est comme les chevilles, ca enfle.
  perturbed_input:
  - GT_LINE=Les putes, c'est comme les chevilles, ca enfle.
- id: near_subj_01_whitespace_envelope
  derived_from: subj_ex_01
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input:
  - FT_LINE=Les putes, c'est comme les chevilles, ca enfle.
  perturbed_input:
  - '  FT_LINE=Les putes, c''est comme les chevilles, ca enfle.  '
