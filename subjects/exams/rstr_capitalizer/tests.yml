mode: c_program
fixed_tests:
- name: can_rstr_capitalizer_T01
  description: hello_WORLD
  args:
  - hello WORLD
  expected: 'hellO worlD

    '
  category: Functional
  tier: baseline
- name: can_rstr_capitalizer_T02
  description: single_char
  args:
  - a b c
  expected: 'A B C

    '
  category: Edge Case
  tier: baseline
- name: can_rstr_capitalizer_T03
  description: empty
  args:
  - ''
  expected: '

    '
  category: Edge Case
  tier: baseline
- name: can_rstr_capitalizer_T04
  description: no_args
  args: []
  expected: '

    '
  category: Functional
  tier: baseline
- name: subj_ex_02
  tier: subject_example
  args:
  - a FiRSt LiTTlE TESt
  expected: 'A firsT littlE tesT

    '
- name: subj_ex_03
  tier: subject_example
  args:
  - SecONd teST A LITtle BiT   Moar comPLEX
  - '   But... This iS not THAT COMPLEX'
  - '     Okay, this is the last 1239809147801 but not    the least    t'
  expected: "seconD tesT A littlE biT   moaR compleX\n   but... thiS iS noT thaT compleX\n\
    \     okay, thiS iS thE lasT 1239809147801 buT noT    thE leasT    T\n"
- name: folder_ex_02
  tier: folder_example
  args:
  - Premier PETIT TesT
  expected: 'premieR petiT tesT

    '
- name: folder_ex_03
  tier: folder_example
  args:
  - DeuxiEmE tEST uN PEU moinS  facile
  - '   attention C''EST pas dur QUAND mEmE'
  - 'ALLer UN DeRNier 0123456789pour LA rouTE    E '
  expected: "deuxiemE tesT uN peU moinS  facilE\n   attentioN c'esT paS duR quanD\
    \ memE\nalleR uN dernieR 0123456789pouR lA routE    E \n"
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./rstr_capitalizer | cat -e
  args: []
  expected: '

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: ./rstr_capitalizer "a FiRSt LiTTlE TESt" | cat -e
  args: &id001
  - a FiRSt LiTTlE TESt
  expected: 'A firsT littlE tesT

    '
  cat_e: true
- id: subj_ex_03
  origin: subject.en.txt
  command: ./rstr_capitalizer "SecONd teST A LITtle BiT   Moar comPLEX" "   But...
    This iS not THAT COMPLEX" "     Okay, this is the last 1239809147801 but not    the
    least    t" | cat -e
  args: &id002
  - SecONd teST A LITtle BiT   Moar comPLEX
  - '   But... This iS not THAT COMPLEX'
  - '     Okay, this is the last 1239809147801 but not    the least    t'
  expected: "seconD tesT A littlE biT   moaR compleX\n   but... thiS iS noT thaT compleX\n\
    \     okay, thiS iS thE lasT 1239809147801 buT noT    thE leasT    T\n"
  cat_e: true
folder_examples:
- id: can_rstr_capitalizer_T05
  origin: subject_folder/42ExamPractice/rstr_capitalizer/tester.sh
  input: ./rstr_capitalizer "10"
  expected: Matches 42 reference standard output and exit code
- id: can_rstr_capitalizer_T06
  origin: subject_folder/42ExamPractice/rstr_capitalizer/tester.sh
  input: ./rstr_capitalizer "a FiRSt LiTTlE TESt"
  expected: Matches 42 reference standard output and exit code
- id: can_rstr_capitalizer_T07
  origin: subject_folder/42ExamPractice/rstr_capitalizer/tester.sh
  input: ./rstr_capitalizer "SecONd teST A LITtle BiT   Moar comPLEX" "   But... This
    iS not THAT COMPLEX" "     Okay, this is the last 1239809147801 but not    the
    least    t"
  expected: Matches 42 reference standard output and exit code
- id: can_rstr_capitalizer_T08
  origin: subject_folder/42ExamPractice/rstr_capitalizer/tester.sh
  input: ./rstr_capitalizer "Okay i thing you got it!!! "
  expected: Matches 42 reference standard output and exit code
- id: can_rstr_capitalizer_T09
  origin: subject_folder/examples.txt
  input: ./rstr_capitalizer \| cat -e
  expected: $
- id: can_rstr_capitalizer_T10
  origin: subject_folder/examples.txt
  input: ./rstr_capitalizer "Premier PETIT TesT" \| cat -e
  expected: premieR petiT tesT$
- id: can_rstr_capitalizer_T11
  origin: subject_folder/examples.txt
  input: ./rstr_capitalizer "DeuxiEmE tEST uN PEU moinS  facile" "   attention C'EST
    pas dur QUAND mEmE" "ALLer UN DeRNier 0123456789pour LA rouTE    E " \| cat -e
  expected: deuxiemE tesT uN peU moinS  facilE$\n   attentioN c'esT paS duR quanD
    memE$\nalleR uN dernieR 0123456789pouR lA routE    E $
near_examples:
- id: near_subj_01_arity_perturbation
  derived_from: subj_ex_01
  strategy: Perturb argument count / adjacent input around subject.en.txt example
  original_input: ./rstr_capitalizer | cat -e
  perturbed_input:
  - rstr_capitalizer_near_arg_1
  - rstr_capitalizer_near_arg_2
- id: near_subj_02_lexical_shift
  derived_from: subj_ex_02
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input: *id001
  perturbed_input:
  - b FiRSt LiTTlE TESt
- id: near_subj_02_whitespace_envelope
  derived_from: subj_ex_02
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input: *id001
  perturbed_input:
  - '  a FiRSt LiTTlE TESt  '
- id: near_subj_03_lexical_shift
  derived_from: subj_ex_03
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input: *id002
  perturbed_input:
  - TecONd teST A LITtle BiT   Moar comPLEX
  - '   Cut... This iS not THAT COMPLEX'
  - '     Pkay, this is the last 1239809147801 but not    the least    t'
- id: near_subj_03_whitespace_envelope
  derived_from: subj_ex_03
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input: *id002
  perturbed_input:
  - '  SecONd teST A LITtle BiT   Moar comPLEX  '
  - '   But... This iS not THAT COMPLEX'
  - '     Okay, this is the last 1239809147801 but not    the least    t'
- id: near_folder_01_boundary_neighbor
  derived_from: can_rstr_capitalizer_T05
  strategy: Neighbouring perturbation of folder example (subject_folder/42ExamPractice/rstr_capitalizer/tester.sh)
  original_input: ./rstr_capitalizer "10"
  perturbed_input: ./sstr_capitalizer "10"
- id: near_folder_02_boundary_neighbor
  derived_from: can_rstr_capitalizer_T06
  strategy: Neighbouring perturbation of folder example (subject_folder/42ExamPractice/rstr_capitalizer/tester.sh)
  original_input: ./rstr_capitalizer "a FiRSt LiTTlE TESt"
  perturbed_input: ./sstr_capitalizer "a FiRSt LiTTlE TESt"
