- id: near_folder_01_boundary_neighbor
  derived_from: cur_permutations_T05
  strategy: Neighbouring perturbation of folder example (subject_folder/42ExamPractice/permutations/tester.sh)
  original_input: ./permutations "$arg" 2
  perturbed_input: ./qermutations "$arg" 2
- id: near_folder_02_boundary_neighbor
  derived_from: cur_permutations_T06
  strategy: Neighbouring perturbation of folder example (subject_folder/42ExamPractice/permutations/tester.sh)
  original_input: ./permutations abcd; then
