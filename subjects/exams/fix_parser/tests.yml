- name: test_06_single_number
  expr: is_valid_expression("42")
  tier: edge
  stdout: '1

    '
- name: test_07_trailing_operator
  expr: is_valid_expression("5 + 3 -")
  tier: edge
  stdout: '0

    '
- name: test_08_leading_operator
  expr: is_valid_expression("* 5 + 3")
  tier: edge
  stdout: '0

    '
- name: test_09_all_four_ops
  expr: is_valid_expression("1 + 2 - 3 * 4 / 5")
  tier: baseline
  stdout: '1

    '
- name: test_10_spaces_only
  expr: is_valid_expression("   ")
  tier: edge
  stdout: '0

    '
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./validator "5+3*2" --> true (1)
  args: &id001
  - 5+3*2
  - -->
  - 'true'
  - (1)
  expected: ''
  cat_e: false
- id: subj_ex_02
  origin: subject.en.txt
