fixed_tests:
- name: hello_world_yes
  args:
  - hello_world_yes
  stdout: 'HelloWorldYes

    '
  tier: baseline
- name: single
  args:
  - piscine
  stdout: 'Piscine

    '
  tier: baseline
- name: empty
  args:
  - ''
  stdout: '

    '
  tier: baseline
- name: no_args
  args: []
  stdout: '

    '
  tier: baseline
- name: edge_snake_multi_underscores
  args:
  - __foo__bar_
  stdout: 'FooBar

    '
  tier: edge_case
- name: edge_snake_upper_and_digits
  args:
  - hello_WORLD_42
  stdout: 'HelloWorld42

    '
  tier: edge_case
- name: edge_snake_only_underscores
  args:
  - ___
  stdout: '

    '
  tier: edge_case
- name: edge_snake_extra_arg
  args:
  - a
  - b
  stdout: '

    '
  tier: edge_case
subject_id: snake
mode: c_program
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./snake "hello_world_yes" | cat -e
  args:
  - hello_world_yes
  expected: 'HelloWorldYes

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: ./snake "piscine" | cat -e
  args:
  - piscine
  expected: 'Piscine

    '
  cat_e: true
- id: subj_ex_03
  origin: subject.en.txt
  command: ./snake "" | cat -e
  args:
  - ''
  expected: '

    '
  cat_e: true
- id: subj_ex_04
  origin: subject.en.txt
  command: ./snake | cat -e
  args: []
  expected: '

    '
  cat_e: true
