edge_cases:
- name: edge_01_B
  code: '[B]'
  title: Empty string and non-printable characters in `next_character`
  input: "next_character(\"\") and next_character(\"\t\n\x01\x1F\")"
  expected: Preserve non-alphabetic characters unmodified
- name: edge_02_B
  code: '[B]'
  title: Argument count verification (argc != 2) in `next_character`
  input: Execute next_character with 0 arguments and with > 1 argument
  expected: Print newline only
- name: edge_03_D
  code: '[D]'
  title: Idempotence and involution property check for `next_character`
  input: 'Apply transformation twice: next_character(next_character(s))'
  expected: Valid transformation output matching mathematical cipher cycle
- name: edge_04_B
  code: '[B]'
  title: Boundary alphabetic letters ('a', 'z', 'A', 'Z') in `next_character`
  input: next_character("a z A Z")
  expected: Accurate wraparound without overflowing outside alphabet bounds
