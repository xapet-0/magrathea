fixed_tests:
- name: test_01_stdin
  stdin: 'root:x:0:0::/root:/bin/sh

    '
  stdout: 'root

    '
  tier: baseline
- name: folder_ex_01
  tier: folder_example
  args: []
  stdout: 'root

    '
  stdin: 'root:x:0:0::/root:/bin/sh

    '
- name: folder_ex_02
  tier: folder_example
  args: []
  stdout: 'marvin

    bocal

    '
  stdin: 'marvin:x:42:42::/home/marvin:/bin/sh

    bocal:x:1337:1337::/home/bocal:/bin/sh

    '
- name: test_04_three_entries
  tier: edge_case
  args: []
  stdin: 'u1:x:1:1::/:/bin/sh

    u2:x:2:2::/:/bin/sh

    u3:x:3:3::/:/bin/sh

    '
  stdout: 'u1

    u2

    u3

    '
- name: zig_passwd_skip_comments
  args: []
  stdin: '# header comment

    root:x:0:0::/root:/bin/sh

    # middle

    _apt:x:100:65534::/nonexistent:/bin/false

    '
  stdout: 'root

    _apt

    '
  tier: edge_case
- name: zig_passwd_extra_colons
  args: []
  stdin: 'alice:x:1000:1000:Alice:Room 42:/home/alice:/bin/zsh

    '
  stdout: 'alice

    '
  tier: edge_case
- name: zig_passwd_only_comments
  args: []
  stdin: '# line1

    # line2

    '
  stdout: ''
  tier: edge_case
- name: zig_passwd_empty_input
  args: []
  stdin: ''
  stdout: ''
  tier: edge_case
subject_id: zig_passwd
mode: shell
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: printf "root:x:0:0::/root:/bin/sh\n" | sh zig_passwd.sh | cat -e
  args:
  - root:x:0:0::/root:/bin/sh\n
  expected: 'root

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: printf "marvin:x:42:42::/home/marvin:/bin/sh\nbocal:x:1337:1337::/home/bocal:/bin/sh\n"
    | sh zig_passwd.sh | cat -e
  args:
  - marvin:x:42:42::/home/marvin:/bin/sh\nbocal:x:1337:1337::/home/bocal:/bin/sh\n
  expected: 'marvin

    bocal

    '
  cat_e: true
folder_examples:
- id: e1337_zig_passwd_T03
  origin: subject_folder/examples.txt
  input: printf "root:x:0:0::/root:/bin/sh\n" \| sh zig_passwd.sh \| cat -e
  expected: root$
- id: e1337_zig_passwd_T04
  origin: subject_folder/examples.txt
  input: printf "marvin:x:42:42::/home/marvin:/bin/sh\nbocal:x:1337:1337::/home/bocal:/bin/sh\n"
    \| sh zig_passwd.sh \| cat -e
  expected: marvin$\nbocal$
- id: folder_fixture_03
  origin: subject_folder/tests.yml
  input: tests.yml
  expected: "fixed_tests:\n- stdin: 'root:x:0:0::/root:/bin/sh\n\n    '\n  stdout:\
    \ 'root\n\n    '\n- stdin: 'marvin:x:42:42::/home/marvin:/bin/sh\n\n    bocal:x:1337:1337::/home/boca"
near_examples:
- id: near_subj_01_lexical_shift
  derived_from: subj_ex_01
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input:
  - root:x:0:0::/root:/bin/sh\n
  perturbed_input:
  - soot:x:0:0::/root:/bin/sh\n
- id: near_subj_01_whitespace_envelope
  derived_from: subj_ex_01
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input:
  - root:x:0:0::/root:/bin/sh\n
  perturbed_input:
  - '  root:x:0:0::/root:/bin/sh\n  '
- id: near_subj_02_lexical_shift
  derived_from: subj_ex_02
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input:
  - marvin:x:42:42::/home/marvin:/bin/sh\nbocal:x:1337:1337::/home/bocal:/bin/sh\n
  perturbed_input:
  - narvin:x:42:42::/home/marvin:/bin/sh\nbocal:x:1337:1337::/home/bocal:/bin/sh\n
- id: near_subj_02_whitespace_envelope
  derived_from: subj_ex_02
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input:
  - marvin:x:42:42::/home/marvin:/bin/sh\nbocal:x:1337:1337::/home/bocal:/bin/sh\n
  perturbed_input:
  - '  marvin:x:42:42::/home/marvin:/bin/sh\nbocal:x:1337:1337::/home/bocal:/bin/sh\n  '
