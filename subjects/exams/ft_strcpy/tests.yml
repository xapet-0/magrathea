mode: c_function
fixed_tests:
- name: can_ft_strcpy_T01
  description: 'Functional verification of input: `char d[16]; printf("%s\n", ft_strcpy(d,
    "abc"`'
  call: char d[16]; printf("%s\n", ft_strcpy(d, "abc"))
  stdout: 'abc

    '
  category: Functional
  tier: baseline
- name: can_ft_strcpy_T02
  description: empty_src
  call: char d[16] = "xxxxxxx"; printf("%s\n", ft_strcpy(d, ""))
  stdout: '

    '
  category: Edge Case
  tier: baseline
- name: can_ft_strcpy_T03
  description: longer_src
  call: char d[32]; printf("%s\n", ft_strcpy(d, "1337_Piscine"))
  stdout: '1337_Piscine

    '
  category: Functional
  tier: baseline
- name: can_ft_strcpy_T04_null_term_check
  description: verify_null_termination
  call: char d[16] = "zzzz"; char *r = ft_strcpy(d, "X"); printf("%s|%d\n", r, d[1]
    == 0)
  stdout: 'X|1

    '
  category: Edge Case
  tier: edge_case
- name: test_05_returns_dest_pointer
  call: char d[16]; char *r = ft_strcpy(d, "test"); printf("%d:%s\n", r == d, d)
  tier: edge
  stdout: '1:test

    '
- name: test_06_overwrite_longer_with_shorter
  call: char d[16] = "0123456789"; ft_strcpy(d, "42"); printf("%s|%d\n", d, d[2] ==
    0)
  tier: edge
  stdout: '42|1

    '
- name: test_07_spaces_and_tabs
  call: char d[32]; printf("[%s]\n", ft_strcpy(d, "  a \t b  "))
  tier: baseline
  stdout: "[  a \t b  ]\n"
- name: test_08_digits_and_symbols
  call: char d[32]; printf("%s\n", ft_strcpy(d, "!@#$%^&*()_1337"))
  tier: baseline
  stdout: '!@#$%^&*()_1337

    '
- name: test_09_single_char
  call: char d[8] = "abc"; printf("%s\n", ft_strcpy(d, "Z"))
  tier: baseline
  stdout: 'Z

    '
- name: test_10_alphabet_copy
  call: char d[64]; printf("%s\n", ft_strcpy(d, "abcdefghijklmnopqrstuvwxyz"))
  tier: stress
  stdout: 'abcdefghijklmnopqrstuvwxyz

    '
