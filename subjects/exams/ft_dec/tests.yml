edge_cases:
- name: edge_01_B
  code: '[B]'
  title: Extreme boundary values (INT_MIN, INT_MAX, 0, 1, -1) in `ft_dec`
  input: ft_dec(INT_MIN), ft_dec(0), ft_dec(1)
  expected: Correct mathematical result without signed overflow UB
- name: edge_02_S
  code: '[S]'
  title: Arithmetic overflow and infinite recursion protection in `ft_dec`
  input: Run ft_dec with large inputs
  expected: Safe return or termination without stack overflow
- name: edge_03_B
  code: '[B]'
  title: Zero factorial and power edge cases in `ft_dec`
  input: ft_dec(0)
  expected: Canonical mathematical result for 0
- name: edge_04_T
  code: '[T]'
  title: Time complexity guard against exponential runtime in `ft_dec`
  input: Call ft_dec on large prime or composite integer
  expected: Execute within 0.5s limit without timing out
fixed_tests:
- name: test_01_d_n_x
  call: printf("%d\n", x)
  setup:
  - int x = 43
  - ft_dec(&x)
  stdout: '42

    '
- name: test_02_d_n_x
  call: printf("%d\n", x)
  setup:
  - int x = 0
  - ft_dec(&x)
  stdout: '-1

    '
- name: test_03_d_n_x
  call: printf("%d\n", x)
  setup:
  - int x = 1
  - ft_dec(&x)
  stdout: '0

    '
- name: test_04_d_n_x
  call: printf("%d\n", x)
  setup:
  - int x = -41
  - ft_dec(&x)
  stdout: '-42

    '
- name: test_05_hundred
  setup:
  - int x = 100
  - ft_dec(&x)
  call: printf("%d\n", x)
  tier: baseline
  stdout: '99

    '
- name: test_06_neg_one
  setup:
  - int x = -1
  - ft_dec(&x)
  call: printf("%d\n", x)
  tier: edge
  stdout: '-2

    '
- name: test_07_int_max
  setup:
  - int x = 2147483647
  - ft_dec(&x)
  call: printf("%d\n", x)
  tier: edge
  stdout: '2147483646

    '
- name: test_08_double_dec
  setup:
  - int x = 44
  - ft_dec(&x)
  - ft_dec(&x)
  call: printf("%d\n", x)
  tier: baseline
  stdout: '42

    '
- name: test_09_neg_1336
  setup:
  - int x = -1336
  - ft_dec(&x)
  call: printf("%d\n", x)
  tier: baseline
  stdout: '-1337

    '
- name: test_10_five_decs
  setup:
  - int x = 5
  - for(int i=0;i<5;i++) ft_dec(&x);
  call: printf("%d\n", x)
  tier: stress
  stdout: '0

    '
