edge_cases:
- name: edge_01_B
  code: '[B]'
  title: Extreme boundary values (INT_MIN, INT_MAX, 0, 1, -1) in `triangle_area`
  input: triangle_area(INT_MIN), triangle_area(0), triangle_area(1)
  expected: Correct mathematical result without signed overflow UB
- name: edge_02_S
  code: '[S]'
  title: Arithmetic overflow and infinite recursion protection in `triangle_area`
  input: Run triangle_area with large inputs
  expected: Safe return or termination without stack overflow
- name: edge_03_B
  code: '[B]'
  title: Zero factorial and power edge cases in `triangle_area`
  input: triangle_area(0)
  expected: Canonical mathematical result for 0
- name: edge_04_T
  code: '[T]'
  title: Time complexity guard against exponential runtime in `triangle_area`
  input: Call triangle_area on large prime or composite integer
  expected: Execute within 0.5s limit without timing out
