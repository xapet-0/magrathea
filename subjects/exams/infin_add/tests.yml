subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./infin_add "879879087" "67548976597" | cat -e
  args:
  - '879879087'
  - '67548976597'
  expected: '68428855684

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
