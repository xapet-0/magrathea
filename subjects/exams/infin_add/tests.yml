edge_cases:
- name: edge_01_B
  code: '[B]'
  title: Extreme boundary values (INT_MIN, INT_MAX, 0, 1, -1) in `infin_add`
  input: infin_add(INT_MIN), infin_add(0), infin_add(1)
  expected: Correct mathematical result without signed overflow UB
- name: edge_02_S
  code: '[S]'
  title: Arithmetic overflow and infinite recursion protection in `infin_add`
  input: Run infin_add with large inputs
  expected: Safe return or termination without stack overflow
- name: edge_03_B
  code: '[B]'
  title: Zero factorial and power edge cases in `infin_add`
  input: infin_add(0)
  expected: Canonical mathematical result for 0
- name: edge_04_T
  code: '[T]'
  title: Time complexity guard against exponential runtime in `infin_add`
  input: Call infin_add on large prime or composite integer
  expected: Execute within 0.5s limit without timing out
