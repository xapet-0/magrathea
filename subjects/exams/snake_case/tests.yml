subject_id: snake_case
fixed_tests:
- name: friend_example
  args:
  - hello_world_yes
  stdout: 'HelloWorldYes

    '
  tier: baseline
- name: single_word
  args:
  - hello
  stdout: 'Hello

    '
  tier: baseline
- name: case_normalization
  args:
  - hELLo_wORLd
  stdout: 'HelloWorld

    '
  tier: baseline
- name: multiple_underscores
  args:
  - __alpha__beta_
  stdout: 'AlphaBeta

    '
  tier: baseline
- name: empty_string
  args:
  - ''
  stdout: '

    '
  tier: baseline
- name: wrong_arg_count
  args: []
  stdout: '

    '
  tier: baseline
- name: test_07_arg_auto
  args:
  - ''
  tier: baseline
  stdout: '

    '
- name: test_08_arg_auto
  args:
  - '   '
  tier: baseline
  stdout: "   \n"
- name: test_09_arg_auto
  args:
  - '1337'
  tier: baseline
  stdout: '1337

    '
- name: test_10_arg_auto
  args:
  - 42_Network
  tier: baseline
  stdout: '42Network

    '
mode: c_program
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./snake_case hello_world_yes | cat -e
  args: &id001
  - hello_world_yes
  expected: 'HelloWorldYes


    Allowed functions: write.

    '
  cat_e: true
folder_examples:
- id: e1337_snake_case_T07
  origin: subject_folder/examples.txt
  input: ./snake_case hello_world_yes \| cat -e
  expected: 'HelloWorldYes$\n\nAllowed functions: write.'
- id: folder_fixture_02
  origin: subject_folder/tests.yml
  input: tests.yml
  expected: "subject_id: snake_case\nfixed_tests:\n- name: friend_example\n  args:\n\
    \  - hello_world_yes\n  stdout: 'HelloWorldYes\n\n    '\n- name: single_word\n\
    \  args:\n  - hello\n  s"
near_examples:
- id: near_subj_01_lexical_shift
  derived_from: subj_ex_01
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input: *id001
  perturbed_input:
  - iello_world_yes
- id: near_subj_01_whitespace_envelope
  derived_from: subj_ex_01
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input: *id001
  perturbed_input:
  - '  hello_world_yes  '
- id: near_folder_01_boundary_neighbor
  derived_from: e1337_snake_case_T07
  strategy: Neighbouring perturbation of folder example (subject_folder/examples.txt)
  original_input: ./snake_case hello_world_yes \| cat -e
  perturbed_input: ./tnake_case hello_world_yes \| cat -e
- id: near_folder_02_boundary_neighbor
  derived_from: folder_fixture_02
  strategy: Neighbouring perturbation of folder example (subject_folder/tests.yml)
  original_input: tests.yml
  perturbed_input: uests.yml
