edge_cases:
- name: edge_01_B
  code: '[B]'
  title: Extreme boundary values (INT_MIN, INT_MAX, 0, 1, -1) in `ft_add`
  input: ft_add(INT_MIN), ft_add(0), ft_add(1)
  expected: Correct mathematical result without signed overflow UB
- name: edge_02_S
  code: '[S]'
  title: Arithmetic overflow and infinite recursion protection in `ft_add`
  input: Run ft_add with large inputs
  expected: Safe return or termination without stack overflow
- name: edge_03_B
  code: '[B]'
  title: Zero factorial and power edge cases in `ft_add`
  input: ft_add(0)
  expected: Canonical mathematical result for 0
- name: edge_04_T
  code: '[T]'
  title: Time complexity guard against exponential runtime in `ft_add`
  input: Call ft_add on large prime or composite integer
  expected: Execute within 0.5s limit without timing out
fixed_tests:
- name: test_01_d_n_x
  call: printf("%d\n", x)
  setup:
  - int x = 30
  - ft_add(12, &x)
  stdout: '42

    '
- name: test_02_d_n_x
  call: printf("%d\n", x)
  setup:
  - int x = -5
  - ft_add(5, &x)
  stdout: '0

    '
- name: test_03_d_n_x
  call: printf("%d\n", x)
  setup:
  - int x = 0
  - ft_add(0, &x)
  stdout: '0

    '
- name: test_04_d_n_x
  call: printf("%d\n", x)
  setup:
  - int x = 100
  - ft_add(-58, &x)
  stdout: '42

    '
- name: test_05_both_negative
  setup:
  - int x = -20
  - ft_add(-22, &x)
  call: printf("%d\n", x)
  tier: baseline
  stdout: '-42

    '
- name: test_06_add_zero_to_neg
  setup:
  - int x = -1337
  - ft_add(0, &x)
  call: printf("%d\n", x)
  tier: edge
  stdout: '-1337

    '
- name: test_07_add_to_zero
  setup:
  - int x = 0
  - ft_add(1337, &x)
  call: printf("%d\n", x)
  tier: edge
  stdout: '1337

    '
- name: test_08_chained_adds
  setup:
  - int x = 10
  - ft_add(20, &x)
  - ft_add(12, &x)
  call: printf("%d\n", x)
  tier: baseline
  stdout: '42

    '
- name: test_09_large_positive
  setup:
  - int x = 1000000
  - ft_add(234567, &x)
  call: printf("%d\n", x)
  tier: baseline
  stdout: '1234567

    '
- name: test_10_cancel_out
  setup:
  - int x = 99999
  - ft_add(-99999, &x)
  call: printf("%d\n", x)
  tier: stress
  stdout: '0

    '
