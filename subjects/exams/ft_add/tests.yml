fixed_tests:
- name: test_01_d_n_x
  call: printf("%d\n", x)
  setup:
  - int x = 30
  - ft_add(12, &x)
  stdout: '42

    '
- name: test_02_d_n_x
  call: printf("%d\n", x)
  setup:
  - int x = -5
  - ft_add(5, &x)
  stdout: '0

    '
- name: test_03_d_n_x
  call: printf("%d\n", x)
  setup:
  - int x = 0
  - ft_add(0, &x)
  stdout: '0

    '
- name: test_04_d_n_x
  call: printf("%d\n", x)
  setup:
  - int x = 100
  - ft_add(-58, &x)
  stdout: '42

    '
- name: test_05_both_negative
  setup:
  - int x = -20
  - ft_add(-22, &x)
  call: printf("%d\n", x)
  tier: baseline
  stdout: '-42

    '
- name: test_06_add_zero_to_neg
  setup:
  - int x = -1337
  - ft_add(0, &x)
  call: printf("%d\n", x)
  tier: edge
  stdout: '-1337

    '
- name: test_07_add_to_zero
  setup:
  - int x = 0
  - ft_add(1337, &x)
  call: printf("%d\n", x)
  tier: edge
  stdout: '1337

    '
- name: test_08_chained_adds
  setup:
  - int x = 10
  - ft_add(20, &x)
  - ft_add(12, &x)
  call: printf("%d\n", x)
  tier: baseline
  stdout: '42

    '
- name: test_09_large_positive
  setup:
  - int x = 1000000
  - ft_add(234567, &x)
  call: printf("%d\n", x)
  tier: baseline
  stdout: '1234567

    '
- name: test_10_cancel_out
  setup:
  - int x = 99999
  - ft_add(-99999, &x)
  call: printf("%d\n", x)
  tier: stress
  stdout: '0

    '
- name: edge_int_max
  call: printf("%d\n", x)
  stdout: '2147483647

    '
  tier: edge
  setup:
  - int x = 0
  - ft_add(2147483647, &x)
- name: edge_int_min
  call: printf("%d\n", x)
  stdout: '-2147483648

    '
  tier: edge
  setup:
  - int x = 0
  - ft_add((-2147483647 - 1), &x)
- name: edge_null_ptr
  call: ft_add(42, NULL); printf("ok\n")
  stdout: 'ok

    '
  tier: edge
