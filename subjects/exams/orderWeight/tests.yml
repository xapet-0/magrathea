subject_id: orderWeight
fixed_tests:
- name: classic_weight_order
  setup:
  - char *res = orderWeight("56 65 74 100 99 68 86 180 90")
  call: 'printf("%s\n", res ? res : ""); free(res)'
  stdout: '100 180 90 56 65 74 68 86 99

    '
  tier: baseline
- name: lexicographic_tie
  setup:
  - char *res = orderWeight("103 123 4444 99 2000")
  call: 'printf("%s\n", res ? res : ""); free(res)'
  stdout: '2000 103 123 4444 99

    '
  tier: baseline
- name: empty_string
  setup:
  - char *res = orderWeight("")
  call: 'printf("%s\n", res ? res : ""); free(res)'
  stdout: '

    '
  tier: baseline
- name: extra_whitespace
  setup:
  - char *res = orderWeight("  103   123  ")
  call: 'printf("%s\n", res ? res : ""); free(res)'
  stdout: '103 123

    '
  tier: baseline
- name: test_05_single_number
  setup:
  - char *res = orderWeight("1337")
  call: 'printf("%s\n", res ? res : ""); free(res)'
  tier: edge
  stdout: '1337

    '
- name: test_06_only_spaces
  setup:
  - char *res = orderWeight("     ")
  call: 'printf("[%s]\n", res ? res : ""); free(res)'
  tier: edge
  stdout: '[]

    '
- name: test_07_powers_of_ten_tie
  setup:
  - char *res = orderWeight("1000 10 1 100")
  call: 'printf("%s\n", res ? res : ""); free(res)'
  tier: edge
  stdout: '1 10 100 1000

    '
- name: test_08_already_sorted
  setup:
  - char *res = orderWeight("1 2 3 4 5")
  call: 'printf("%s\n", res ? res : ""); free(res)'
  tier: baseline
  stdout: '1 2 3 4 5

    '
- name: test_09_reverse_weights
  setup:
  - char *res = orderWeight("99 88 77 66 55")
  call: 'printf("%s\n", res ? res : ""); free(res)'
  tier: baseline
  stdout: '55 66 77 88 99

    '
- name: test_10_duplicate_numbers
  setup:
  - char *res = orderWeight("42 24 42 15 51")
  call: 'printf("%s\n", res ? res : ""); free(res)'
  tier: stress
  stdout: '15 24 42 42 51

    '
