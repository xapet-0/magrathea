mode: cpp
main_cpp: "#include \"Warlock.hpp\"\n#include \"BrickWall.hpp\"\n#include \"Polymorph.hpp\"\
  \n#include \"Fireball.hpp\"\n#include \"TargetGenerator.hpp\"\nint main()\n{\n \
  \ Warlock richard(\"Richard\", \"foo\");\n  richard.setTitle(\"Hello, I'm Richard\
  \ the Warlock!\");\n  BrickWall model1;\n\n  Polymorph* polymorph = new Polymorph();\n\
  \  TargetGenerator tarGen;\n\n  tarGen.learnTargetType(&model1);\n  richard.learnSpell(polymorph);\n\
  \n  Fireball* fireball = new Fireball();\n\n  richard.learnSpell(fireball);\n\n\
  \  ATarget* wall = tarGen.createTarget(\"Inconspicuous Red-brick Wall\");\n\n  richard.introduce();\n\
  \  richard.launchSpell(\"Polymorph\", *wall);\n  richard.launchSpell(\"Fireball\"\
  , *wall);\n  delete polymorph;\n  delete fireball;\n  delete wall;\n  return 0;\n\
  }\n"
expected_stdout: 'Richard: This looks like another boring day.

  Richard: I am Richard, Hello, I''m Richard the Warlock!!

  Inconspicuous Red-brick Wall has been turned into a critter!

  Inconspicuous Red-brick Wall has been burnt to a crisp!

  Richard: My job here is done!

  '
must_not_compile:
- '#include "Warlock.hpp"

  int main() { Warlock bob; return 0; }

  '
- '#include "Warlock.hpp"

  int main() { Warlock a("A", "B"); Warlock b(a); return 0; }

  '
- '#include "Warlock.hpp"

  int main() { Warlock a("A", "B"); Warlock b("C", "D"); b = a; return 0; }

  '
- '#include "SpellBook.hpp"

  int main() { SpellBook a; SpellBook b(a); return 0; }

  '
- '#include "SpellBook.hpp"

  int main() { SpellBook a; SpellBook b; b = a; return 0; }

  '
- '#include "TargetGenerator.hpp"

  int main() { TargetGenerator a; TargetGenerator b(a); return 0; }

  '
- '#include "TargetGenerator.hpp"

  int main() { TargetGenerator a; TargetGenerator b; b = a; return 0; }

  '
- '#include "ASpell.hpp"

  int main() { ASpell s("a", "b"); return 0; }

  '
- '#include "ATarget.hpp"

  int main() { ATarget t("x"); return 0; }

  '
extra_cpp_tests:
- name: cpp02_spellbook_targetgen_and_all_classes
  main_cpp: "#include \"Warlock.hpp\"\n#include \"ASpell.hpp\"\n#include \"ATarget.hpp\"\
    \n#include \"Fwoosh.hpp\"\n#include \"Fireball.hpp\"\n#include \"Polymorph.hpp\"\
    \n#include \"Dummy.hpp\"\n#include \"BrickWall.hpp\"\n#include \"SpellBook.hpp\"\
    \n#include \"TargetGenerator.hpp\"\n\nint main()\n{\n  SpellBook book;\n  TargetGenerator\
    \ gen;\n  Fwoosh fwoosh;\n  Fireball fireball;\n  Polymorph polymorph;\n  Dummy\
    \ dummy;\n  BrickWall wall;\n\n  if (book.createSpell(\"Missing\") != 0 || gen.createTarget(\"\
    Missing\") != 0)\n    return 1;\n  book.learnSpell(&fwoosh);\n  book.learnSpell(&fireball);\n\
    \  gen.learnTargetType(&dummy);\n  gen.learnTargetType(&wall);\n  ASpell *sp =\
    \ book.createSpell(\"Fireball\");\n  ATarget *tg = gen.createTarget(\"Target Practice\
    \ Dummy\");\n  if (!sp || !tg)\n    return 1;\n  sp->launch(*tg);\n  delete sp;\n\
    \  delete tg;\n  book.forgetSpell(\"Fireball\");\n  gen.forgetTargetType(\"Target\
    \ Practice Dummy\");\n  if (book.createSpell(\"Fireball\") != 0 || gen.createTarget(\"\
    Target Practice Dummy\") != 0)\n    return 1;\n\n  Warlock w(\"Merlin\", \"Grand\
    \ Magus\");\n  w.learnSpell(&fwoosh);\n  w.learnSpell(&polymorph);\n  w.launchSpell(\"\
    Fwoosh\", wall);\n  w.launchSpell(\"Polymorph\", wall);\n  w.forgetSpell(\"Fwoosh\"\
    );\n  w.launchSpell(\"Fwoosh\", wall);\n  return 0;\n}\n"
  expected_stdout: 'Target Practice Dummy has been burnt to a crisp!

    Merlin: This looks like another boring day.

    Inconspicuous Red-brick Wall has been fwooshed!

    Inconspicuous Red-brick Wall has been turned into a critter!

    Merlin: My job here is done!

    '
