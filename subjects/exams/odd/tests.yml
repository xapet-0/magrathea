edge_cases:
- name: edge_01_B
  code: '[B]'
  title: Empty string and whitespace-only string in `odd`
  input: "odd(\"   \t\t   \")"
  expected: Print newline only with no extra spaces
- name: edge_02_B
  code: '[B]'
  title: Single word surrounded by spaces vs string without spaces in `odd`
  input: odd("   word   ") and odd("word")
  expected: Identical output 'word$' for both inputs
- name: edge_03_B
  code: '[B]'
  title: Extended ASCII characters and repetitive tokens in `odd`
  input: odd("aaa bbb ccc")
  expected: Format words with exact single space separation and terminating newline
- name: edge_04_B
  code: '[B]'
  title: Argument count check (argc < 2 or argc > 2) in `odd`
  input: Execute odd with no arguments and with 3 arguments
  expected: Print newline only
