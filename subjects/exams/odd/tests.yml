subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./odd
  args: []
  expected: '13579

    '
  cat_e: false
- id: subj_ex_02
  origin: subject.en.txt
  command: ./odd | cat -e
  args: []
  expected: '13579

    '
  cat_e: true
folder_examples:
- id: cur_odd_T01
  origin: subject_folder/tests.yml (fixed_tests)
  input: '`./odd` (no CLI arguments passed, `argc == 1`)'
  expected: 13579\n
- id: cur_odd_T02
  origin: subject_folder/tests.yml (fixed_tests)
  input: '[''ignored'']'
  expected: 13579\n
- id: cur_odd_T03
  origin: subject_folder/tests.yml (fixed_tests)
  input: '['''']'
  expected: 13579\n
near_examples:
- id: near_subj_01_arity_perturbation
  derived_from: subj_ex_01
  strategy: Invoke binary with unexpected arguments to verify argc guard
  original_input: ./odd
  perturbed_input:
  - arg1
  - arg2
- id: near_subj_02_arity_perturbation
  derived_from: subj_ex_02
  strategy: Invoke binary with unexpected arguments to verify argc guard
  original_input: ./odd | cat -e
  perturbed_input:
  - arg1
  - arg2
- id: near_folder_02_boundary_neighbor
  derived_from: cur_odd_T02
  strategy: Neighbouring perturbation of folder example (subject_folder/tests.yml
    (fixed_tests))
  original_input: '[''ignored'']'
  perturbed_input: '[''jgnored'']'
