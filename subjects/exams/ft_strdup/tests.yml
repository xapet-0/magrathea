mode: c_function
fixed_tests:
- name: can_ft_strdup_T01
  description: 'Functional verification of input: `char *s = ft_strdup("Piscine");
    if (s) { prin`'
  call: char *s = ft_strdup("Piscine"); if (s) { printf("%s\n", s); free(s); }
  stdout: 'Piscine

    '
  category: Functional
  tier: baseline
- name: can_ft_strdup_T02
  description: empty_string
  call: char *s = ft_strdup(""); printf("[%s]\n", s); free(s)
  stdout: '[]

    '
  category: Edge Case
  tier: baseline
- name: can_ft_strdup_T03
  description: sentence
  call: char *s = ft_strdup("1337 School"); printf("%s\n", s); free(s)
  stdout: '1337 School

    '
  category: Functional
  tier: baseline
- name: can_ft_strdup_T04_distinct_ptr
  description: distinct_heap_pointer
  call: const char *src = "42_Network"; char *s = ft_strdup((char *)src); printf("%s|%d\n",
    s, s != src); free(s)
  stdout: '42_Network|1

    '
  category: Edge Case
  tier: edge_case
- name: test_05_single_char
  call: char *s = ft_strdup("X"); printf("%s|%d\n", s, s[1] == 0); free(s)
  tier: edge
  stdout: 'X|1

    '
- name: test_06_mutating_copy_leaves_src
  call: char src[] = "hello"; char *s = ft_strdup(src); s[0] = 'H'; printf("%s|%s\n",
    src, s); free(s)
  tier: edge
  stdout: 'hello|Hello

    '
- name: test_07_whitespace_and_tabs
  call: char *s = ft_strdup(" \t\n 42 "); printf("[%s]\n", s); free(s)
  tier: baseline
  stdout: "[ \t\n 42 ]\n"
- name: test_08_symbols_and_digits
  call: char *s = ft_strdup("!@#$%^&*()_0123456789"); printf("%s\n", s); free(s)
  tier: baseline
  stdout: '!@#$%^&*()_0123456789

    '
- name: test_09_two_dups_distinct
  call: char *a = ft_strdup("dup"); char *b = ft_strdup("dup"); printf("%d:%s:%s\n",
    a != b, a, b); free(a); free(b)
  tier: edge
  stdout: '1:dup:dup

    '
- name: test_10_long_string
  call: char *s = ft_strdup("abcdefghijklmnopqrstuvwxyz0123456789"); printf("%s\n",
    s); free(s)
  tier: stress
  stdout: 'abcdefghijklmnopqrstuvwxyz0123456789

    '
