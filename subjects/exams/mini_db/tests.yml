  name: tcp_persistence_sigint_restart
  python_harness: |
    import os, signal, socket, subprocess, sys, time

    exe = sys.argv[1]
    db_path = 'persist_db.txt'
    if os.path.exists(db_path):
        os.unlink(db_path)

    def free_port():
        s = socket.socket()
        s.bind(('127.0.0.1', 0))
        port = s.getsockname()[1]
        s.close()
        return port

    def connect_retry(pno):
        deadline = time.time() + 1.5
        while True:
            try:
                return socket.create_connection(('127.0.0.1', pno), timeout=1.0)
            except OSError:
                if time.time() > deadline:
                    raise
                time.sleep(0.02)

    def recv_line(sock):
        buf = b''
        while not buf.endswith(b'\n'):
            chunk = sock.recv(1024)
            if not chunk:
                break
            buf += chunk
        return buf

    port1 = free_port()
    p1 = subprocess.Popen([exe, str(port1), db_path], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
    try:
        c = connect_retry(port1)
        for req, exp in (
            (b'POST alpha 42\n', b'0\n'),
            (b'POST beta v1\n', b'0\n'),
            (b'POST beta v2\n', b'0\n'),
            (b'POST gamma temp\n', b'0\n'),
            (b'DELETE gamma\n', b'0\n'),
        ):
            c.sendall(req)
            got = recv_line(c)
            assert got == exp, f'{req!r} -> {got!r} != {exp!r}'
        c.close()
        p1.send_signal(signal.SIGINT)
        rc = p1.wait(timeout=2.0)
        assert rc == 0, f'SIGINT exit code {rc}'
    finally:
        if p1.poll() is None:
            p1.kill()
            p1.wait()

    assert os.path.exists(db_path), 'DB file was not saved on SIGINT'

    port2 = free_port()
    p2 = subprocess.Popen([exe, str(port2), db_path], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
    try:
        c2 = connect_retry(port2)
        for req, exp in (
            (b'GET alpha\n', b'0 42\n'),
            (b'GET beta\n', b'0 v2\n'),
            (b'GET gamma\n', b'1\n'),
            (b'POST delta reloaded\n', b'0\n'),
            (b'GET delta\n', b'0 reloaded\n'),
        ):
            c2.sendall(req)
            got = recv_line(c2)
            assert got == exp, f'restart {req!r} -> {got!r} != {exp!r}'
        c2.close()
        print('OK')
    finally:
        p2.kill()
        p2.wait()
