  name: tcp_post_get_delete_unknown
  python_harness: |
    import socket, subprocess, sys, time

    exe = sys.argv[1]
    s = socket.socket()
    s.bind(('127.0.0.1', 0))
    port = s.getsockname()[1]
    s.close()

    def connect_retry(pno):
        deadline = time.time() + 1.5
        while True:
            try:
                return socket.create_connection(('127.0.0.1', pno), timeout=1.0)
            except OSError:
                if time.time() > deadline:
                    raise
                time.sleep(0.02)

    def recv_line(sock):
        buf = b''
        while not buf.endswith(b'\n'):
            chunk = sock.recv(1024)
            if not chunk:
                break
            buf += chunk
        return buf

    p = subprocess.Popen([exe, str(port), 'test_db.txt'], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
    try:
        c1 = connect_retry(port)
        c2 = connect_retry(port)
        c1.sendall(b'POST school 1337\n')
        assert recv_line(c1) == b'0\n'
        c1.sendall(b'POST school 42\n')
        assert recv_line(c1) == b'0\n'
        c2.sendall(b'GET school\n')
        assert recv_line(c2) == b'0 42\n'
        c2.sendall(b'DELETE school\n')
        assert recv_line(c2) == b'0\n'
        c2.sendall(b'DELETE missing\n')
        assert recv_line(c2) == b'1\n'
        c1.sendall(b'GET school\n')
        assert recv_line(c1) == b'1\n'
        c1.sendall(b'UNKNOWN_COMMAND\n')
        assert recv_line(c1) == b'2\n'
        c1.sendall(b'BADCMD a b\n')
        assert recv_line(c1) == b'2\n'
        c1.close()
        c2.close()
        print('OK')
    finally:
        p.kill()
        p.wait()
