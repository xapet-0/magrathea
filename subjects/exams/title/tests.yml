fixed_tests:
- args:
  - no NO no!
  category: Functional
  description: no_NO_no
  expected: 'No NO No!

    '
  name: cur_title_T01
  stdout: 'No NO No!

    '
  tier: baseline
- args:
  - hello world
  category: Functional
  description: hello_world
  expected: 'Hello World

    '
  name: cur_title_T02
  stdout: 'Hello World

    '
  tier: baseline
- args:
  - ''
  category: Edge Case
  description: empty
  expected: '

    '
  name: cur_title_T03
  stdout: '

    '
  tier: baseline
- args: []
  category: Functional
  description: no_args
  expected: '

    '
  name: cur_title_T04
  stdout: '

    '
  tier: baseline
- args:
  - pjldfjslogjlsj
  expected: 'Pjldfjslogjlsj

    '
  name: subj_ex_03
  stdout: 'Pjldfjslogjlsj

    '
  tier: subject_example
- name: edge_title_tabs_preserve_upper
  args:
  - "\thello\tWORLD\ttest"
  stdout: "\tHello\tWORLD\tTest\n"
  tier: edge_case
- name: edge_title_digits_punct
  args:
  - 42abc _def
  stdout: '42abc _def

    '
  tier: edge_case
- name: edge_title_extra_arg
  args:
  - a
  - b
  stdout: '

    '
  tier: edge_case
folder_examples:
- expected: No NO No!\n
  id: cur_title_T01
  input: '[''no NO no!'']'
  origin: subject_folder/tests.yml (fixed_tests)
- expected: Hello World\n
  id: cur_title_T02
  input: '[''hello world'']'
  origin: subject_folder/tests.yml (fixed_tests)
- expected: '`\n` (Empty argument outputs single newline)'
  id: cur_title_T03
  input: '['''']'
  origin: subject_folder/tests.yml (fixed_tests)
mode: c_program
near_examples:
- id: near_subj_01_arity_perturbation
  derived_from: subj_ex_01
  strategy: Invoke binary with unexpected arguments to verify argc guard
  original_input: ./title | cat -e
  perturbed_input:
  - arg1
  - arg2
- id: near_subj_02_lexical_shift
  derived_from: subj_ex_02
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input:
  - no NO no no no!
  perturbed_input:
  - oo NO no no no!
- id: near_subj_02_whitespace_envelope
  derived_from: subj_ex_02
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input:
  - no NO no no no!
  perturbed_input:
  - '  no NO no no no!  '
- id: near_subj_03_lexical_shift
  derived_from: subj_ex_03
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input:
  - pjldfjslogjlsj
  perturbed_input:
  - qjldfjslogjlsj
- id: near_subj_03_whitespace_envelope
  derived_from: subj_ex_03
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input:
  - pjldfjslogjlsj
  perturbed_input:
  - '  pjldfjslogjlsj  '
- id: near_folder_01_boundary_neighbor
  derived_from: cur_title_T01
  strategy: Neighbouring perturbation of folder example (subject_folder/tests.yml
    (fixed_tests))
  original_input: '[''no NO no!'']'
  perturbed_input: '[''oo NO no!'']'
- id: near_folder_02_boundary_neighbor
  derived_from: cur_title_T02
  strategy: Neighbouring perturbation of folder example (subject_folder/tests.yml
    (fixed_tests))
  original_input: '[''hello world'']'
  perturbed_input: '[''iello world'']'
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./title | cat -e
  args: []
  expected: '

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: ./title "no NO no no no!" | cat -e
  args:
  - no NO no no no!
  expected: 'No NO No No No!

    '
  cat_e: true
- id: subj_ex_03
  origin: subject.en.txt
  command: ./title pjldfjslogjlsj | cat -e
  args:
  - pjldfjslogjlsj
  expected: 'Pjldfjslogjlsj

    '
  cat_e: true
