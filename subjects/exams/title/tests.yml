folder_examples:
- expected: No NO No!\n
  id: cur_title_T01
  input: '[''no NO no!'']'
  origin: subject_folder/tests.yml (fixed_tests)
- expected: Hello World\n
  id: cur_title_T02
  input: '[''hello world'']'
  origin: subject_folder/tests.yml (fixed_tests)
- expected: '`\n` (Empty argument outputs single newline)'
  id: cur_title_T03
  input: '['''']'
  origin: subject_folder/tests.yml (fixed_tests)
mode: c_program
near_examples:
- derived_from: subj_ex_01
  id: near_subj_01_arity_perturbation
  original_input: ./title | cat -e
  perturbed_input:
  - title_near_arg_1
  - title_near_arg_2
  strategy: Perturb argument count / adjacent input around subject.en.txt example
- derived_from: subj_ex_02
  id: near_subj_02_lexical_shift
  original_input: &id001
  - no NO no no no!
  perturbed_input:
  - oo NO no no no!
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
- derived_from: subj_ex_02
  id: near_subj_02_whitespace_envelope
  original_input: *id001
  perturbed_input:
  - '  no NO no no no!  '
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
- derived_from: subj_ex_03
  id: near_subj_03_lexical_shift
  original_input: &id002
  - pjldfjslogjlsj
  perturbed_input:
  - qjldfjslogjlsj
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
- derived_from: subj_ex_03
  id: near_subj_03_whitespace_envelope
  original_input: *id002
  perturbed_input:
  - '  pjldfjslogjlsj  '
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
- derived_from: subj_ex_04
  id: near_subj_04_arity_perturbation
  original_input: Pjldfjslogjlsj
  perturbed_input:
  - title_near_arg_1
  - title_near_arg_2
  strategy: Perturb argument count / adjacent input around subject.en.txt example
- derived_from: cur_title_T01
  id: near_folder_01_boundary_neighbor
  original_input: '[''no NO no!'']'
  perturbed_input: '[''oo NO no!'']'
  strategy: Neighbouring perturbation of folder example (subject_folder/tests.yml
    (fixed_tests))
- derived_from: cur_title_T02
  id: near_folder_02_boundary_neighbor
  original_input: '[''hello world'']'
  perturbed_input: '[''iello world'']'
  strategy: Neighbouring perturbation of folder example (subject_folder/tests.yml
    (fixed_tests))
