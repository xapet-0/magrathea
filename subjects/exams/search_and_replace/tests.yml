subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./search_and_replace "Papache est un sabre" "a" "o"
  args: &id001
  - Papache est un sabre
  - a
  - o
  expected: 'Popoche est un sobre

    '
  cat_e: false
- id: subj_ex_02
  origin: subject.en.txt
  command: ./search_and_replace "zaz" "art" "zul" | cat -e
  args: &id002
  - zaz
  - art
  - zul
  expected: '

    '
  cat_e: true
- id: subj_ex_03
  origin: subject.en.txt
  command: ./search_and_replace "zaz" "r" "u" | cat -e
  args: &id003
  - zaz
  - r
  - u
  expected: 'zaz

    '
  cat_e: true
- id: subj_ex_04
  origin: subject.en.txt
  command: ./search_and_replace "jacob" "a" "b" "c" "e" | cat -e
  args: &id004
  - jacob
  - a
  - b
  - c
  - e
  expected: '

    '
  cat_e: true
- id: subj_ex_05
  origin: subject.en.txt
  command: ./search_and_replace "ZoZ eT Dovid oiME le METol." "o" "a" | cat -e
  args:
  - ZoZ eT Dovid oiME le METol.
  - o
  - a
  expected: 'ZaZ eT David aiME le METal.

    '
  cat_e: true
- id: subj_ex_06
  origin: subject.en.txt
  command: ./search_and_replace "wNcOre Un ExEmPle Pas Facilw a Ecrirw " "w" "e" |
    cat -e
  args:
  - 'wNcOre Un ExEmPle Pas Facilw a Ecrirw '
  - w
  - e
  expected: "eNcOre Un ExEmPle Pas Facile a Ecrire \n==========================================================================================\n"
  cat_e: true
