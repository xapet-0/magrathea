mode: c_program
fixed_tests:
- name: can_search_and_replace_T01
  description: 'Functional verification of input: `[''hello'', ''l'', ''x'']`'
  args:
  - hello
  - l
  - x
  expected: 'hexxo

    '
  category: Functional
  tier: baseline
- name: can_search_and_replace_T02
