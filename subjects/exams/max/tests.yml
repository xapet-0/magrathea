mode: c_function
fixed_tests:
- name: can_max_T01
  description: 'Functional verification of input: `int a[]={1,7,3}; printf("%d\n",max(a,3))`'
  call: int a[]={1,7,3}; printf("%d\n",max(a,3))
  stdout: '7

    '
  category: Edge Case
  tier: baseline
- name: can_max_T02
  description: empty_array
  call: printf("%d\n", max(NULL, 0))
  stdout: '0

    '
  category: Edge Case
  tier: baseline
- name: can_max_T03
  description: all_negative
  call: int a[]={-10,-3,-42}; printf("%d\n", max(a, 3))
  stdout: '-3

    '
  category: Edge Case
  tier: baseline
- name: can_max_T04
  description: single_element
  call: int a[]={1337}; printf("%d\n", max(a, 1))
  stdout: '1337

    '
  category: Edge Case
  tier: baseline
- name: test_05_max_at_first
  call: int a[]={99, 10, 20, 30}; printf("%d\n", max(a, 4))
  tier: edge
  stdout: '99

    '
- name: test_06_max_at_last
  call: int a[]={10, 20, 30, 99}; printf("%d\n", max(a, 4))
  tier: edge
  stdout: '99

    '
- name: test_07_all_equal
  call: int a[]={42, 42, 42}; printf("%d\n", max(a, 3))
  tier: edge
  stdout: '42

    '
- name: test_08_with_zero_and_negatives
  call: int a[]={-100, 0, -1}; printf("%d\n", max(a, 3))
  tier: baseline
  stdout: '0

    '
- name: test_09_int_limits
  call: int a[]={-2147483648, 2147483647, 0}; printf("%d\n", max(a, 3))
  tier: edge
  stdout: '2147483647

    '
- name: test_10_seven_elements
  call: int a[]={4, 8, 15, 16, 42, 23, 1}; printf("%d\n", max(a, 7))
  tier: stress
  stdout: '42

    '
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt (contract specification)
  command: eval max
  args: []
  expected: Conform to subject.en.txt prototype and output specification
  cat_e: false
