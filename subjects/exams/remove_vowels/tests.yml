  - ' '
- id: near_subj_04_whitespace_envelope
  derived_from: subj_ex_04
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input: *id003
  perturbed_input:
  - '    '
- id: near_folder_01_boundary_neighbor
  derived_from: cur_remove_vowels_T05
  strategy: Neighbouring perturbation of folder example (subject_folder/deepthought/corrections/exams/remove_vowels/generator.py)
  original_input: Dynamic generation rule via basic_test()
  perturbed_input: Eynamic generation rule via basic_test()
- id: near_folder_02_boundary_neighbor
  derived_from: cur_remove_vowels_T06
  strategy: Neighbouring perturbation of folder example (subject_folder/deepthought/corrections/exams/remove_vowels/generator.py)
  original_input: Dynamic generation rule via basic_test1()
  perturbed_input: Eynamic generation rule via basic_test1(
edge_cases:
- name: edge_01_B
  code: '[B]'
  title: Empty string and whitespace-only string in `remove_vowels`
  input: "remove_vowels(\"   \t\t   \")"
  expected: Print newline only with no extra spaces
- name: edge_02_B
  code: '[B]'
  title: Single word surrounded by spaces vs string without spaces in `remove_vowels`
  input: remove_vowels("   word   ") and remove_vowels("word")
  expected: Identical output 'word$' for both inputs
- name: edge_03_B
  code: '[B]'
  title: Extended ASCII characters and repetitive tokens in `remove_vowels`
  input: remove_vowels("aaa bbb ccc")
  expected: Format words with exact single space separation and terminating newline
- name: edge_04_B
  code: '[B]'
  title: Argument count check (argc < 2 or argc > 2) in `remove_vowels`
  input: Execute remove_vowels with no arguments and with 3 arguments
  expected: Print newline only
