subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./remove_vowels "Hi there, how are you?" | cat -e
  args:
  - Hi there, how are you?
  expected: 'H thr, hw r y?

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: ./remove_vowels "Hello world!" | cat -e
  args:
  - Hello world!
  expected: 'Hll wrld!

    '
