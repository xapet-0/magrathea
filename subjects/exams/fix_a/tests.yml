subject_examples:
- id: subj_ex_01
  origin: subject.en.txt (contract specification)
  command: eval fix_a
  args: []
  expected: Conform to subject.en.txt prototype and output specification
  cat_e: false
folder_examples:
- id: cur_fix_a_T06
  origin: subject_folder/deepthought/corrections/exams/fix_a/generator.py
  input: Dynamic generation rule via basic_test()
  expected: Deterministic output validated by Deepthought oracle
near_examples:
- id: near_subj_01_arity_perturbation
  derived_from: subj_ex_01
  strategy: Perturb argument count / adjacent input around subject.en.txt example
  original_input: eval fix_a
  perturbed_input:
  - fix_a_near_arg_1
  - fix_a_near_arg_2
- id: near_folder_01_boundary_neighbor
  derived_from: cur_fix_a_T06
  strategy: Neighbouring perturbation of folder example (subject_folder/deepthought/corrections/exams/fix_a/generator.py)
  original_input: Dynamic generation rule via basic_test()
  perturbed_input: Eynamic generation rule via basic_test()
edge_cases:
- name: edge_01_B
  code: '[B]'
  title: Empty string and whitespace-only string in `fix_a`
  input: "fix_a(\"   \t\t   \")"
  expected: Print newline only with no extra spaces
- name: edge_02_B
  code: '[B]'
  title: Single word surrounded by spaces vs string without spaces in `fix_a`
  input: fix_a("   word   ") and fix_a("word")
  expected: Identical output 'word$' for both inputs
- name: edge_03_B
  code: '[B]'
  title: Extended ASCII characters and repetitive tokens in `fix_a`
  input: fix_a("aaa bbb ccc")
  expected: Format words with exact single space separation and terminating newline
- name: edge_04_B
  code: '[B]'
  title: Argument count check (argc < 2 or argc > 2) in `fix_a`
  input: Execute fix_a with no arguments and with 3 arguments
  expected: Print newline only
