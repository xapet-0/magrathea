  - ''
  expected: '

    '
- name: near_ex_too_many_args
  tier: near_example
  args:
  - arg1
  - arg2
  expected: '

    '
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./sort_words "Is Are Am" | cat -e
  args:
  - Is Are Am
  expected: 'Am Are Is

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
