- id: near_folder_01_boundary_neighbor
  derived_from: cur_sort_words_T05
  strategy: Neighbouring perturbation of folder example (subject_folder/deepthought/corrections/exams/sort_words/generator.py)
  original_input: Dynamic generation rule via random_string()
