mode: c_program
fixed_tests:
- name: cur_sort_words_T01
  description: 'Functional verification of input: `[''banana apple cherry'']`'
  args:
  - banana apple cherry
  expected: 'apple banana cherry

    '
  category: Functional
  tier: baseline
- name: cur_sort_words_T02
  description: 'Functional verification of input: `[''  two\tone   three '']`'
  args:
  - "  two\tone   three "
  expected: 'one three two

    '
  category: Functional
  tier: baseline
- name: cur_sort_words_T03
  description: edge_sort_words_duplicates
  args:
  - beta alpha beta
  expected: 'alpha beta beta

    '
  category: Edge Case
  tier: baseline
- name: cur_sort_words_T04
  description: edge_sort_words_bad_argc
  args: []
  expected: '

    '
  category: Edge Case
  tier: baseline
- name: subj_ex_01
