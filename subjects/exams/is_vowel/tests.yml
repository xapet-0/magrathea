subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: is_vowel('a') = 1
  args: &id001
  - '='
  - '1'
  expected: ''
  cat_e: false
- id: subj_ex_02
  origin: subject.en.txt
  command: is_vowel('U') = 1
  args: &id002
  - '='
  - '1'
  expected: ''
  cat_e: false
- id: subj_ex_03
  origin: subject.en.txt
  command: is_vowel('P') = 0
  args: &id003
  - '='
  - '0'
  expected: ''
  cat_e: false
- id: subj_ex_04
  origin: subject.en.txt
  command: is_vowel ('z') = 0
  args: &id004
  - (z)
  - '='
  - '0'
  expected: ''
  cat_e: false
