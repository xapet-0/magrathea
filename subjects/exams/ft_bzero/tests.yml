fixed_tests:
- name: test_01_d_d_d_d_n_buf_0_buf
  setup:
  - char buf[6] = "abcde"
  - ft_bzero(buf, 3)
  call: printf("%d,%d,%d,%d\n", buf[0], buf[1], buf[2], buf[3])
  stdout: '0,0,0,100

    '
  tier: baseline
- name: test_02_s_n_buf
  setup:
  - char buf[4] = "xyz"
  - ft_bzero(buf, 0)
  call: printf("%s\n", buf)
  stdout: 'xyz

    '
  tier: baseline
- name: test_03_d_d_d_n_buf_0_buf_1
  setup:
  - char buf[4] = "xyz"
  - ft_bzero(buf + 1, 2)
  call: printf("%d,%d,%d\n", buf[0], buf[1], buf[2])
  stdout: '120,0,0

    '
  tier: baseline
- name: test_04_d_d_n_arr_0_arr_1
  setup:
  - int arr[2] = {42, 99}
  - ft_bzero(arr, sizeof(int))
  call: printf("%d,%d\n", arr[0], arr[1])
  stdout: '0,99

    '
  tier: baseline
- name: test_05_single_first_byte
  setup:
  - char buf[4] = "abc"
  - ft_bzero(buf, 1)
  call: printf("%d,%c,%c\n", buf[0], buf[1], buf[2])
  tier: edge
  stdout: '0,b,c

    '
- name: test_06_single_last_byte
  setup:
  - char buf[4] = "abc"
  - ft_bzero(buf + 2, 1)
  call: printf("%c,%c,%d\n", buf[0], buf[1], buf[2])
  tier: edge
  stdout: 'a,b,0

    '
- name: test_07_full_four_bytes
  setup:
  - char buf[4] = "xyz"
  - ft_bzero(buf, 4)
  call: printf("%d,%d,%d,%d\n", buf[0], buf[1], buf[2], buf[3])
  tier: baseline
  stdout: '0,0,0,0

    '
- name: test_08_unsigned_char_255
  setup:
  - unsigned char buf[3] = {255, 128, 64}
  - ft_bzero(buf, 2)
  call: printf("%d,%d,%d\n", buf[0], buf[1], buf[2])
  tier: edge
  stdout: '0,0,64

    '
- name: test_09_int_array_two_of_three
  setup:
  - int arr[3] = {10, 20, 30}
  - ft_bzero(arr, sizeof(int) * 2)
  call: printf("%d,%d,%d\n", arr[0], arr[1], arr[2])
  tier: baseline
  stdout: '0,0,30

    '
- name: test_10_sixteen_byte_block
  setup:
  - char buf[16]; memset(buf, 'Z', 16); ft_bzero(buf, 16); int s=0; for(int i=0;i<16;i++)
    s+=buf[i];
  call: printf("%d\n", s)
  tier: stress
  stdout: '0

    '
