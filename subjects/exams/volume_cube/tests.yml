edge_cases:
- name: edge_01_B
  code: '[B]'
  title: Extreme boundary values (INT_MIN, INT_MAX, 0, 1, -1) in `volume_cube`
  input: volume_cube(INT_MIN), volume_cube(0), volume_cube(1)
  expected: Correct mathematical result without signed overflow UB
- name: edge_02_S
  code: '[S]'
  title: Arithmetic overflow and infinite recursion protection in `volume_cube`
  input: Run volume_cube with large inputs
  expected: Safe return or termination without stack overflow
- name: edge_03_B
  code: '[B]'
  title: Zero factorial and power edge cases in `volume_cube`
  input: volume_cube(0)
  expected: Canonical mathematical result for 0
- name: edge_04_T
  code: '[T]'
  title: Time complexity guard against exponential runtime in `volume_cube`
  input: Call volume_cube on large prime or composite integer
  expected: Execute within 0.5s limit without timing out
