edge_cases:
- name: edge_01_B
  code: '[B]'
  title: Extreme boundary values (INT_MIN, INT_MAX, 0, 1, -1) in `volume_cuboid`
  input: volume_cuboid(INT_MIN), volume_cuboid(0), volume_cuboid(1)
  expected: Correct mathematical result without signed overflow UB
- name: edge_02_S
  code: '[S]'
  title: Arithmetic overflow and infinite recursion protection in `volume_cuboid`
  input: Run volume_cuboid with large inputs
  expected: Safe return or termination without stack overflow
- name: edge_03_B
  code: '[B]'
  title: Zero factorial and power edge cases in `volume_cuboid`
  input: volume_cuboid(0)
  expected: Canonical mathematical result for 0
- name: edge_04_T
  code: '[T]'
  title: Time complexity guard against exponential runtime in `volume_cuboid`
  input: Call volume_cuboid on large prime or composite integer
  expected: Execute within 0.5s limit without timing out
