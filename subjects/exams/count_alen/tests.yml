near_examples:
- id: near_subj_01_arity_perturbation
  derived_from: subj_ex_01
  strategy: Perturb argument count / adjacent input around subject.en.txt example
  original_input: eval count_alen
  perturbed_input:
  - count_alen_near_arg_1
  - count_alen_near_arg_2
- id: near_folder_01_boundary_neighbor
  derived_from: cur_count_alen_T01
  strategy: Neighbouring perturbation of folder example (subject_folder/tests.yml
    (fixed_tests))
  original_input: count_alen("1337_school")
  perturbed_input: dount_alen("1337_school")
- id: near_folder_02_boundary_neighbor
  derived_from: cur_count_alen_T02
  strategy: Neighbouring perturbation of folder example (subject_folder/tests.yml
    (fixed_tests))
  original_input: count_alen("hello_a_world")
  perturbed_input: dount_alen("hello_a_world")
edge_cases:
- name: edge_01_B
  code: '[B]'
  title: "Test `count_alen` with high ASCII characters (unsigned char > 127 like '\x80\
    ' and 'ÿ')"
  input: "count_alen(\"\x80\", \"\x7F\", ...)"
  expected: Compare and inspect characters as unsigned char conforming to POSIX libc
- name: edge_02_B
  code: '[B]'
  title: Test `count_alen` at zero length (n = 0 / size = 0) and empty string ""
  input: count_alen("", "", 0)
  expected: Do not read or write any byte out of bounds and return canonical value
- name: edge_03_D
  code: '[D]'
  title: Differential property check for `count_alen` against libc oracle
  input: Compare count_alen against standard library function across random permutations
  expected: 100% exact match in return value and destination buffer state
- name: edge_04_M
  code: '[M]'
  title: Canary Redzone check on string buffer boundaries in `count_alen`
  input: Pass heap buffer allocated to exact strlen(s) + 1 size to count_alen
  expected: No read or write beyond terminating null byte
