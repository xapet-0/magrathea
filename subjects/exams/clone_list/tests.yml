check_leaks: true
support_code: "static void dt_free_cloned_nodes(struct s_node *h) {\n    while (h)\
  \ {\n        struct s_node *n = h->next;\n        free(h);\n        h = n;\n   \
  \ }\n}\n"
fixed_tests:
