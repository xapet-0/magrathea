  expr: clone_list(NULL) == NULL
  stdout: '1

    '
- name: test_02_expr
  code: printf("%d\n", c != &a && c->data == 42 && c->other == c); dt_free_cloned_nodes(c);
  setup:
  - struct s_node a={42,0,0}; a.other=&a
  - struct s_node *c = clone_list(&a)
  stdout: '1

    '
- name: test_03_expr
  code: printf("%d\n", c != &a && c->next != &b && c->data == 1 && c->next->data ==
    2 && c->other == c->next && c->next->other == c); dt_free_cloned_nodes(c);
  setup:
  - struct s_node b={2,0,0}, a={1,&b,0}; a.other=&b; b.other=&a;
  - struct s_node *c = clone_list(&a)
  stdout: '1

    '
- name: test_04_expr
  code: printf("%d\n", c != &a && c->data == 1337 && c->next == NULL && c->other ==
    NULL); dt_free_cloned_nodes(c);
  setup:
  - struct s_node a={1337,0,0};
  - struct s_node *c = clone_list(&a)
  stdout: '1

    '
- name: test_05_three_nodes_null_other
  setup:
  - struct s_node c={3,0,0}, b={2,&c,0}, a={1,&b,0};
  - struct s_node *r = clone_list(&a);
  code: printf("%d\n", r != &a && r->data == 1 && r->next->data == 2 && r->next->next->data
    == 3 && r->other == NULL); dt_free_cloned_nodes(r);
  tier: baseline
  stdout: '1

    '
- name: test_06_three_nodes_cycle_other
  setup:
  - struct s_node c={30,0,0}, b={20,&c,0}, a={10,&b,0}; a.other=&c; b.other=&a; c.other=&b;
  - struct s_node *r = clone_list(&a);
  code: printf("%d\n", r->other == r->next->next && r->next->other == r && r->next->next->other
    == r->next); dt_free_cloned_nodes(r);
  tier: edge
  stdout: '1

    '
- name: test_07_all_other_point_to_head
  setup:
  - struct s_node c={3,0,0}, b={2,&c,0}, a={1,&b,0}; a.other=&a; b.other=&a; c.other=&a;
  - struct s_node *r = clone_list(&a);
  code: printf("%d\n", r->other == r && r->next->other == r && r->next->next->other
    == r); dt_free_cloned_nodes(r);
  tier: edge
  stdout: '1

    '
- name: test_08_all_other_point_to_tail
  setup:
  - struct s_node c={3,0,0}, b={2,&c,0}, a={1,&b,0}; a.other=&c; b.other=&c; c.other=&c;
  - struct s_node *r = clone_list(&a);
  code: printf("%d\n", r->other == r->next->next && r->next->other == r->next->next
    && r->next->next->other == r->next->next); dt_free_cloned_nodes(r);
  tier: edge
  stdout: '1

    '
- name: test_09_negative_values
  setup:
  - struct s_node b={-42,0,0}, a={-1337,&b,0}; a.other=0; b.other=&a;
  - struct s_node *r = clone_list(&a);
  code: printf("%d\n", r->data == -1337 && r->next->data == -42 && r->other == 0 &&
    r->next->other == r); dt_free_cloned_nodes(r);
  tier: baseline
  stdout: '1

    '
- name: test_10_four_nodes_mixed
  setup:
  - struct s_node d={4,0,0}, c={3,&d,0}, b={2,&c,0}, a={1,&b,0}; a.other=&d; b.other=0;
    c.other=&c; d.other=&b;
  - struct s_node *r = clone_list(&a);
  code: printf("%d\n", r->other == r->next->next->next && r->next->other == 0 && r->next->next->other
    == r->next->next && r->next->next->next->other == r->next); dt_free_cloned_nodes(r);
  tier: stress
  stdout: '1

    '
