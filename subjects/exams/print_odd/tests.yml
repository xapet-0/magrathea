- name: cur_print_odd_T02
  description: abcd
  args:
  - abcd
  expected: 'bd

    '
  category: Functional
  tier: baseline
- name: cur_print_odd_T03
  description: empty
  args:
  - ''
  expected: '

    '
  category: Edge Case
  tier: baseline
- name: cur_print_odd_T04
  description: no_args
  args: []
  expected: '

    '
  category: Functional
  tier: baseline
- name: test_05_arg_auto
  args:
  - ''
  tier: baseline
  stdout: '

    '
