near_examples:
- id: near_subj_01_lexical_shift
  derived_from: subj_ex_01
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input: *id001
  perturbed_input:
  - 1-2 2-3 3-4!
- id: near_subj_01_whitespace_envelope
  derived_from: subj_ex_01
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input: *id001
  perturbed_input:
  - '  1-2 2-3 3-4  '
- id: near_subj_02_lexical_shift
  derived_from: subj_ex_02
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input: *id002
  perturbed_input:
  - 1-2 2-3 3-1!
- id: near_subj_02_whitespace_envelope
  derived_from: subj_ex_02
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input: *id002
  perturbed_input:
  - '  1-2 2-3 3-1  '
- id: near_subj_03_lexical_shift
  derived_from: subj_ex_03
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input: *id003
  perturbed_input:
  - 10-20!
- id: near_subj_03_whitespace_envelope
  derived_from: subj_ex_03
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input: *id003
  perturbed_input:
  - '  10-20  '
- id: near_subj_04_arity_perturbation
  derived_from: subj_ex_04
  strategy: Perturb argument count / adjacent input around subject.en.txt example
  original_input: ./g_diam | cat -e
  perturbed_input:
  - g_diam_near_arg_1
  - g_diam_near_arg_2
- id: near_folder_01_boundary_neighbor
  derived_from: can_g_diam_T05
  strategy: Neighbouring perturbation of folder example (subject_folder/examples.txt)
  original_input: ./g_diam "1-2 2-3 3-4" \| cat -e
  perturbed_input: ./h_diam "1-2 2-3 3-4" \| cat -e
- id: near_folder_02_boundary_neighbor
  derived_from: can_g_diam_T06
  strategy: Neighbouring perturbation of folder example (subject_folder/examples.txt)
  original_input: ./g_diam "1-2 2-3 3-1" \| cat -e
  perturbed_input: ./h_diam "1-2 2-3 3-1" \| cat -e
edge_cases:
- name: edge_01_B
  code: '[B]'
  title: Empty tree (NULL), single node, and linear skewed tree in `g_diam`
  input: g_diam(NULL) and linear tree of depth 30
  expected: Return 0/NULL for empty tree, correct calculation for unbalanced tree
- name: edge_02_B
  code: '[B]'
  title: No valid solution or duplicate/zero values in `g_diam`
  input: Input with no valid solution or containing duplicate values in g_diam
  expected: Do not emit corrupted output or duplicate equivalent solutions
- name: edge_03_M
  code: '[M]'
  title: Deallocation of auxiliary structures under leak checks in `g_diam`
  input: Run g_diam with DT_CHECK_LEAKS=1
  expected: 0 bytes leaked and structural integrity of left/right child pointers
- name: edge_04_D
  code: '[D]'
  title: Output order verification (Lexicographical / Infix Order) in `g_diam`
  input: Inspect sequence of traversed or printed nodes in g_diam
  expected: Exact match with standard traversal order required in subject
