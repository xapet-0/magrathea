project: g_diam
scale_version: 1337HUB-v4.2
stop_on_first_failure: true
zero_tolerance_gates:
- segfault
- memory_leak
- forbidden_function
sections:
- id: preliminaries
  title: 'Step 1: Preliminaries & Rendu Build Check'
  points: 20
  checks:
  - Verify expected files (g_diam.c) exist in `rendu/` with no unauthorized artifacts.
  - Compile cleanly with `cc -Wall -Wextra -Werror` (Norminette disabled in exam mode).
  - 'Verify CLI `argc`/`argv` behavior and allowed functions: write, malloc, free.'
- id: explain_before_checking
  title: 'Step 2: Conceptual Defense (Explain Before Checking)'
  points: 30
  checks:
  - Student explains `argc`/`argv` parsing, memory cleanup, and output formatting
    before executing tests.
- id: live_mutation
  title: 'Step 3: Live Mutation & Edge-Case Verification'
  points: 50
  checks:
  - Invoke the compiled binary with edge CLI arguments (no args, extra args, empty
    strings) checking exact `| cat -e` output.
