edge_cases:
- name: edge_01_B
  code: '[B]'
  title: Empty array (size = 0), single element, and NULL pointer in `volume_histogram`
  input: volume_histogram(tab, 0) and volume_histogram(NULL, 0)
  expected: Safe return without memory violation
- name: edge_02_B
  code: '[B]'
  title: Array with duplicate elements and all elements identical in `volume_histogram`
  input: volume_histogram([5, 5, 5, 5], 4)
  expected: Preserve stable sort or return correct count
- name: edge_03_B
  code: '[B]'
  title: Array already sorted in reverse order in `volume_histogram`
  input: volume_histogram([9, 8, 7, 6, 5], 5)
  expected: Properly sort array with no missing elements
- name: edge_04_T
  code: '[T]'
  title: Performance verification on large array in `volume_histogram`
  input: Run volume_histogram on array of 10,000 elements
  expected: Complete within timeout limit
fixed_tests:
- name: test_01_h_5
  expr: volume_histogram(h, 5)
  setup:
  - int h[] = {1, 0, 2, 0, 2}
  stdout: '3

    '
- name: test_02_h_16
  expr: volume_histogram(h, 16)
  setup:
  - int h[] = {0, 0, 4, 0, 0, 6, 0, 0, 3, 0, 5, 0, 1, 0, 0, 0}
  stdout: '26

    '
- name: test_03_h_3
  expr: volume_histogram(h, 3)
  setup:
  - int h[] = {1, 2, 3}
  stdout: '0

    '
- name: test_04_h_3
  expr: volume_histogram(h, 3)
  setup:
  - int h[] = {3, 0, 3}
  stdout: '3

    '
- name: test_05_zero_or_one_bar
  setup:
  - int h[] = {5};
  expr: volume_histogram(h, 0) + volume_histogram(h, 1)
  tier: edge
  stdout: '0

    '
- name: test_06_two_bars_no_trap
  setup:
  - int h[] = {5, 5};
  expr: volume_histogram(h, 2)
  tier: edge
  stdout: '0

    '
- name: test_07_descending_stairs
  setup:
  - int h[] = {4, 3, 2, 1};
  expr: volume_histogram(h, 4)
  tier: edge
  stdout: '0

    '
- name: test_08_flat_terrain
  setup:
  - int h[] = {2, 2, 2, 2};
  expr: volume_histogram(h, 4)
  tier: edge
  stdout: '0

    '
- name: test_09_asymmetric_basin
  setup:
  - int h[] = {2, 0, 5};
  expr: volume_histogram(h, 3)
  tier: baseline
  stdout: '2

    '
- name: test_10_classic_elevation_12
  setup:
  - int h[] = {0, 1, 0, 2, 1, 0, 1, 3, 2, 1, 2, 1};
  expr: volume_histogram(h, 12)
  tier: stress
  stdout: '6

    '
