  tier: baseline
- name: cur_is_palindrome_T02
  description: 'Functional verification of input: `[''radar'']`'
  args:
  - radar
  expected: 'radar

    '
  category: Functional
  tier: baseline
- name: cur_is_palindrome_T03
  description: 'Functional verification of input: `[''aaabb'']`'
  args:
  - aaabb
  expected: '

    '
