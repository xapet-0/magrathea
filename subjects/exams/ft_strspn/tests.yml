mode: c_function
fixed_tests:
- name: can_ft_strspn_T01
  description: 'Functional verification of input: `ft_strspn("abc123","abc")`'
  expr: ft_strspn("abc123","abc")
  stdout: '3

    '
  category: Functional
  tier: baseline
- name: can_ft_strspn_T02
  description: no_accept_match
  expr: ft_strspn("hello", "xyz")
  stdout: '0

    '
  category: Functional
  tier: baseline
- name: can_ft_strspn_T03
  description: all_match
  expr: ft_strspn("1337", "0123456789")
  stdout: '4

    '
  category: Edge Case
  tier: baseline
- name: can_ft_strspn_T04
  description: empty_accept
  expr: ft_strspn("hello", "")
  stdout: '0

    '
  category: Edge Case
  tier: baseline
- name: test_05_empty_s
  expr: ft_strspn("", "abc")
  tier: edge
  stdout: '0

    '
- name: test_06_both_empty
  expr: ft_strspn("", "")
  tier: edge
  stdout: '0

    '
- name: test_07_first_char_not_in_accept
  expr: ft_strspn("xabc", "abc")
  tier: edge
  stdout: '0

    '
- name: test_08_repeated_accept_chars
  expr: ft_strspn("aaabbbccc_end", "cba")
  tier: baseline
  stdout: '9

    '
- name: test_09_single_char_match
  expr: ft_strspn("abcdef", "a")
  tier: baseline
  stdout: '1

    '
- name: test_10_compare_with_libc
  expr: ft_strspn("133742_school", "0123456789") == strspn("133742_school", "0123456789")
  tier: stress
  stdout: '1

    '
