edge_cases:
- name: edge_01_P
  code: '[P]'
  title: File descriptor leak audit in `ft_printf`
  input: Run ft_printf and check open file descriptors in /proc/self/fd
  expected: Only stdin, stdout, stderr remain open
- name: edge_02_P
  code: '[P]'
  title: Child process reaping and zombie prevention in `ft_printf`
  input: Spawn multiple processes in ft_printf and verify with waitpid
  expected: No zombie processes remain in process table
- name: edge_03_B
  code: '[B]'
  title: Command-line arguments contract enforcement in `ft_printf`
  input: Invoke ft_printf with invalid argument counts
  expected: Emit exact error string to stderr and exit with non-zero status
- name: edge_04_M
  code: '[M]'
  title: Stream buffer cleanup on EOF in `ft_printf`
  input: Stream large input to ft_printf until EOF
  expected: 0 bytes leaked
