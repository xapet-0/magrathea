  origin: subject_folder/tests.yml (fixed_tests)
  input: int r = ft_printf("Hex %s is %d and %x\n", "number", 42, 42); printf("%d\n",
    r);
  expected: Hex number is 42 and 2a\n24\n
- id: cur_ft_printf_T02
  origin: subject_folder/tests.yml (fixed_tests)
  input: int r = ft_printf("%s\n", (char *)0); printf("%d\n", r);
  expected: (null)\n7\n
- id: cur_ft_printf_T03
  origin: subject_folder/tests.yml (fixed_tests)
  input: int r = ft_printf("%d %d %x\n", 0, -2147483648, 0); printf("%d\n", r);
  expected: 0 -2147483648 0\n16\n
