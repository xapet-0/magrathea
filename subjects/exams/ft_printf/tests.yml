mode: c_function
fixed_tests:
- name: cur_ft_printf_T01
  description: 'Functional verification of input: `int r = ft_printf("Hex %s is %d
    and %x\n", "n`'
  call: int r = ft_printf("Hex %s is %d and %x\n", "number", 42, 42); printf("%d\n",
    r);
  stdout: 'Hex number is 42 and 2a

    24

    '
  category: Functional
  tier: baseline
- name: cur_ft_printf_T02
  description: 'Functional verification of input: `int r = ft_printf("%s\n", (char
    *)0); printf(`'
  call: int r = ft_printf("%s\n", (char *)0); printf("%d\n", r);
  stdout: '(null)

    7

    '
  category: Edge Case
  tier: baseline
- name: cur_ft_printf_T03
  description: 'Functional verification of input: `int r = ft_printf("%d %d %x\n",
    0, -214748364`'
  call: int r = ft_printf("%d %d %x\n", 0, -2147483648, 0); printf("%d\n", r);
  stdout: '0 -2147483648 0

    16

    '
  category: Edge Case
  tier: baseline
- name: cur_ft_printf_T04
  description: 'Functional verification of input: `int r = ft_printf("1337"); printf(":%d\n",
    r)`'
  call: int r = ft_printf("1337"); printf(":%d\n", r);
  stdout: '1337:4

    '
  category: Functional
  tier: baseline
- name: test_05_empty_format
  call: int r = ft_printf(""); printf("R=%d\n", r);
  tier: edge
  stdout: 'R=0

    '
- name: test_06_empty_string_arg
  call: int r = ft_printf("[%s]\n", ""); printf("%d\n", r);
  tier: edge
  stdout: '[]

    3

    '
- name: test_07_int_max_and_neg_one
  call: int r = ft_printf("%d %d\n", 2147483647, -1); printf("%d\n", r);
  tier: edge
  stdout: '2147483647 -1

    14

    '
- name: test_08_hex_boundaries
  call: int r = ft_printf("%x %x %x\n", 15, 16, 255); printf("%d\n", r);
  tier: baseline
  stdout: 'f 10 ff

    8

    '
- name: test_09_hex_uint_max
  call: int r = ft_printf("%x\n", -1); printf("%d\n", r);
  tier: edge
  stdout: 'ffffffff

    9

    '
- name: test_10_multiple_mixed_specifiers
  call: int r = ft_printf("%s:%d:%x:%s:%d\n", "a", -42, 42, (char*)0, 0); printf("%d\n",
    r);
  tier: stress
  stdout: 'a:-42:2a:(null):0

    18

    '
