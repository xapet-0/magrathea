subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./rev_wstr "You hate people! But I love gatherings. Isn't it ironic?" |
    cat -e
  args: &id001
  - You hate people! But I love gatherings. Isn't it ironic?
  expected: 'ironic? it Isn''t gatherings. love I But people! hate You

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: ./rev_wstr "abcdefghijklm"
  args: &id002
  - abcdefghijklm
  expected: 'abcdefghijklm

    '
  cat_e: false
- id: subj_ex_03
  origin: subject.en.txt
  command: ./rev_wstr "Wingardium Leviosa" | cat -e
  args: &id003
  - Wingardium Leviosa
  expected: 'Leviosa Wingardium

    '
  cat_e: true
