  original_input: *id003
  perturbed_input:
  - '  Wingardium Leviosa  '
- id: near_subj_04_arity_perturbation
  derived_from: subj_ex_04
  strategy: Perturb argument count / adjacent input around subject.en.txt example
  original_input: ./rev_wstr | cat -e
  perturbed_input:
  - rev_wstr_near_arg_1
  - rev_wstr_near_arg_2
- id: near_folder_01_boundary_neighbor
  derived_from: can_rev_wstr_T05
  strategy: Neighbouring perturbation of folder example (subject_folder/42ExamPractice/rev_wstr/tester.sh)
  original_input: ./rev_wstr "abcdefghijklm"
  perturbed_input: ./sev_wstr "abcdefghijklm"
