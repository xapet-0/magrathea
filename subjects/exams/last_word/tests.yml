mode: c_program
fixed_tests:
- name: can_last_word_T01
  description: 'Functional verification of input: `[''hello world  '']`'
  args:
  - 'hello world  '
  expected: 'world

    '
  category: Functional
  tier: baseline
- name: can_last_word_T02
  description: leading_and_tabs
  args:
  - "\t one two\tthree   "
  expected: 'three

    '
  category: Functional
  tier: baseline
- name: can_last_word_T03
  description: wrong_arg_count
  args: []
  expected: '

    '
  category: Functional
  tier: baseline
- name: can_last_word_T04
  description: only_spaces
  args:
  - '     '
  expected: '

    '
  category: Edge Case
  tier: baseline
- name: can_last_word_T05
  description: case_level2_last_word_tabs_and_spaces
  args:
  - "\t\talpha beta\tgamma\t  "
  expected: 'gamma

    '
  category: Edge Case
  tier: baseline
- name: can_last_word_T06
  description: case_level2_last_word_single_word
  args:
  - hello
  expected: 'hello

    '
  category: Edge Case
  tier: baseline
- name: can_last_word_T07
  description: case_level2_last_word_no_word
  args:
  - "    \t  "
  expected: '

    '
  category: Functional
  tier: baseline
- name: subj_ex_01
  tier: subject_example
  args:
  - FOR PONY
  expected: 'PONY

    '
- name: subj_ex_02
  tier: subject_example
  args:
  - this        ...       is sparta, then again, maybe    not
  expected: 'not

    '
- name: subj_ex_03
  tier: subject_example
  args:
  - '   '
  expected: '

    '
- name: subj_ex_04
  tier: subject_example
  args:
  - a
  - b
  expected: '

    '
- name: subj_ex_05
  tier: subject_example
  args:
  - '  lorem,ipsum  '
  expected: 'lorem,ipsum

    '
- name: near_ex_too_many_args
  tier: near_example
  args:
  - near_arg_1
  - near_arg_2
  expected: '

    '
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./last_word "FOR PONY" | cat -e
  args: &id001
  - FOR PONY
  expected: 'PONY

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: ./last_word "this        ...       is sparta, then again, maybe    not"
    | cat -e
  args: &id002
  - this        ...       is sparta, then again, maybe    not
  expected: 'not

    '
  cat_e: true
- id: subj_ex_03
  origin: subject.en.txt
  command: ./last_word "   " | cat -e
  args: &id003
  - '   '
  expected: '

    '
  cat_e: true
- id: subj_ex_04
  origin: subject.en.txt
  command: ./last_word "a" "b" | cat -e
  args: &id004
  - a
  - b
  expected: '

    '
  cat_e: true
- id: subj_ex_05
  origin: subject.en.txt
  command: ./last_word "  lorem,ipsum  " | cat -e
  args:
  - '  lorem,ipsum  '
  expected: 'lorem,ipsum

    '
  cat_e: true
