mode: c_program
fixed_tests:
- name: cur_list_trait_T01
  expected_stderr: ''
  description: 'Functional verification of input: `[''0'', ''-5'', ''8'', ''7'']`'
  args:
  - '0'
  - '-5'
  - '8'
  - '7'
  expected: "List: 0 -5 8 7 \nSum: 10\nMax: 8\nCount: 4\n"
  category: Edge Case
  tier: baseline
- name: cur_list_trait_T02
  description: 'Functional verification of input: `[''42'']`'
  args:
  - '42'
  expected: "List: 42 \nSum: 42\nMax: 42\nCount: 1\n"
  category: Functional
  tier: baseline
- name: cur_list_trait_T03
  description: edge_empty_str
  args:
  - ''
  expected: "List: 0 \nSum: 0\nMax: 0\nCount: 1\n"
  category: Edge Case
  tier: baseline
- name: cur_list_trait_T04
  description: edge_whitespace
  args:
  - "   \t  "
  expected: "List: 0 \nSum: 0\nMax: 0\nCount: 1\n"
  category: Edge Case
  tier: baseline
- name: cur_list_trait_T05
  description: edge_single_char
  args:
  - a
  expected: "List: 0 \nSum: 0\nMax: 0\nCount: 1\n"
  category: Edge Case
  tier: baseline
- name: edge_lt_all_negative
  args:
  - '-10'
  - '-2'
  - '-5'
  expected: "List: -10 -2 -5 \nSum: -17\nMax: -2\nCount: 3\n"
  tier: edge_case
- name: edge_lt_mixed_pos_neg
  args:
  - '5'
  - '-3'
  - '5'
  expected: "List: 5 -3 5 \nSum: 7\nMax: 5\nCount: 3\n"
  tier: edge_case
- name: edge_lt_single_zero
  args:
  - '0'
  expected: "List: 0 \nSum: 0\nMax: 0\nCount: 1\n"
  tier: edge_case
- name: edge_lt_no_args
  args: []
  expected: ''
  expected_stderr: ''
  expected_returncode: 1
  tier: edge_case
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./list_trait 0 -5 8 7 | cat -e
  args:
  - '0'
  - '-5'
  - '8'
  - '7'
  expected: "List: 0 -5 8 7 \nSum: 10\nMax: 8\nCount: 4\n"
  cat_e: true
