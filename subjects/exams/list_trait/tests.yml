edge_cases:
- name: edge_01_B
  code: '[B]'
  title: Empty list (NULL) and single-node list in `list_trait`
  input: list_trait(NULL, ...)
  expected: Safely return NULL or 0 without dereferencing NULL pointer
- name: edge_02_M
  code: '[M]'
  title: Zero node leaks and use-after-free prevention in `list_trait`
  input: Execute list_trait under leak detection (DT_CHECK_LEAKS=1)
  expected: 0 bytes leaked and valid node pointers
- name: edge_03_B
  code: '[B]'
  title: All elements matching condition or identical in `list_trait`
  input: Pass list where every element matches filter or deletion predicate
  expected: Properly update list head pointer without dangling references
- name: edge_04_B
  code: '[B]'
  title: Cycle detection and self-referencing nodes in `list_trait`
  input: Pass cyclical linked list to list_trait
  expected: Terminate correctly or detect loop without infinite iteration
