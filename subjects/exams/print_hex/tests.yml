subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./print_hex "10" | cat -e
  args: &id001
  - '10'
  expected: 'a

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: ./print_hex "255" | cat -e
