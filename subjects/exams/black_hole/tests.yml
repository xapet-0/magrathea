  description: No arguments
  args: []
  stdout: 'OK

    '
  expected: 'OK

    '
  exit_code: 0
  category: Functional
  tier: baseline
- name: cur_black_hole_T02
  description: Single argument
  args:
  - ignored_err
  stdout: 'OK

    '
  expected: 'OK

    '
  exit_code: 0
  category: Functional
  tier: subject_example
- name: cur_black_hole_T03
  description: Multiple arguments
  args:
  - a
  - b
  stdout: 'OK

    '
  expected: 'OK

    '
  exit_code: 0
  category: Functional
  tier: subject_example
- name: cur_black_hole_T04_many_args
