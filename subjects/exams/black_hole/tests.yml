subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: sh black_hole.sh | cat -e
  args:
  - black_hole.sh
  expected: 'OK

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: sh black_hole.sh "ignored_err" | cat -e
  args:
  - black_hole.sh
  - ignored_err
  expected: 'OK

    '
  cat_e: true
- id: subj_ex_03
  origin: subject.en.txt
  command: sh black_hole.sh "a" "b" | cat -e
  args:
  - black_hole.sh
  - a
  - b
  expected: 'OK

    '
  cat_e: true
folder_examples:
- id: cur_black_hole_T01
  origin: subject_folder/tests.yml (fixed_tests)
  input: '`sh black_hole.sh` (standard shell environment)'
  expected: OK\n
- id: cur_black_hole_T02
  origin: subject_folder/tests.yml (fixed_tests)
  input: '[''ignored_err'']'
  expected: OK\n
- id: cur_black_hole_T03
  origin: subject_folder/tests.yml (fixed_tests)
  input: '[''a'', ''b'']'
  expected: OK\n
near_examples:
- id: near_subj_01_lexical_shift
  derived_from: subj_ex_01
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input:
  - black_hole.sh
  perturbed_input:
  - clack_hole.sh
- id: near_subj_01_whitespace_envelope
  derived_from: subj_ex_01
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input:
  - black_hole.sh
  perturbed_input:
  - '  black_hole.sh  '
- id: near_subj_02_lexical_shift
  derived_from: subj_ex_02
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input:
  - black_hole.sh
  - ignored_err
  perturbed_input:
  - clack_hole.sh
  - jgnored_err
- id: near_subj_02_whitespace_envelope
  derived_from: subj_ex_02
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input:
  - black_hole.sh
  - ignored_err
  perturbed_input:
  - '  black_hole.sh  '
  - ignored_err
- id: near_subj_03_lexical_shift
  derived_from: subj_ex_03
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input:
  - black_hole.sh
  - a
  - b
  perturbed_input:
  - clack_hole.sh
  - b
  - c
- id: near_subj_03_whitespace_envelope
  derived_from: subj_ex_03
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input:
  - black_hole.sh
  - a
  - b
  perturbed_input:
  - '  black_hole.sh  '
  - a
  - b
- id: near_folder_02_boundary_neighbor
  derived_from: cur_black_hole_T02
  strategy: Neighbouring perturbation of folder example (subject_folder/tests.yml
    (fixed_tests))
  original_input: '[''ignored_err'']'
  perturbed_input: '[''jgnored_err'']'
