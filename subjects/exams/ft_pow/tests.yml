mode: c_function
fixed_tests:
- name: cur_ft_pow_T01
  description: 'Functional verification of input: `ft_pow(2,5)`'
  expr: ft_pow(2,5)
  stdout: '32

    '
  category: Functional
  tier: baseline
- name: cur_ft_pow_T02
  description: 'Functional verification of input: `ft_pow(3,0)`'
  expr: ft_pow(3,0)
  stdout: '1

    '
  category: Edge Case
  tier: baseline
- name: cur_ft_pow_T03
  description: 'Functional verification of input: `ft_pow(2,-1)`'
  expr: ft_pow(2,-1)
  stdout: '0

    '
  category: Edge Case
  tier: baseline
- name: cur_ft_pow_T04
  description: edge_ft_pow_zero_power
  expr: ft_pow(42, 0)
  stdout: '1

    '
  category: Edge Case
  tier: baseline
- name: cur_ft_pow_T05
  description: edge_ft_pow_negative_power
  expr: ft_pow(2, -3)
  stdout: '0

    '
  category: Edge Case
  tier: baseline
- name: test_06_one_to_any_power
  expr: ft_pow(1, 100)
  tier: edge
  stdout: '1

    '
- name: test_07_zero_to_positive
  expr: ft_pow(0, 5)
  tier: edge
  stdout: '0

    '
- name: test_08_zero_to_zero
  expr: ft_pow(0, 0)
  tier: edge
  stdout: '1

    '
- name: test_09_neg_base_odd_exp
  expr: ft_pow(-3, 3)
  tier: baseline
  stdout: '-27

    '
- name: test_10_neg_base_even_exp
  expr: ft_pow(-3, 4)
  tier: stress
  stdout: '81

    '
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./ft_pow(-2, 3) = -8
  args: &id001
  - 3)
  - '='
  - '-8'
  expected: ''
  cat_e: false
- id: subj_ex_02
