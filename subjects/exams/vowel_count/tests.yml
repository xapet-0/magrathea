subject_id: vowel_count
fixed_tests:
- name: test_01_no_args
  env:
    FT_LINE: Hello 1337 World!
  args: []
  stdout: '3

    '
  tier: baseline
- name: test_02_no_args
  env:
    FT_LINE: AEIOUaeiou
  args: []
  stdout: '10

    '
  tier: baseline
- name: test_03_no_args
  env:
    FT_LINE: bcdfg
  args: []
  stdout: '0

    '
  tier: baseline
- name: test_04_no_args
  env:
    FT_LINE: ''
  args: []
  stdout: '0

    '
  tier: baseline
- name: vowel_count_spaces_tabs_no_vowels
  env:
    FT_LINE: "bcdfg\tXYZ 12345!"
  args: []
  stdout: '0

    '
  tier: edge_case
- name: vowel_count_only_y
  env:
    FT_LINE: yYrRwW
  args: []
  stdout: '0

    '
  tier: edge_case
- name: vowel_count_mixed_sentence
  env:
    FT_LINE: 42 Piscine Exam Shell Scripting!
  args: []
  stdout: '8

    '
  tier: edge_case
- name: vowel_count_single_vowel
  env:
    FT_LINE: A
  args: []
  stdout: '1

    '
  tier: edge_case
mode: shell
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: FT_LINE="Hello 1337 World!" sh vowel_count.sh | cat -e
  args:
  - sh
  - vowel_count.sh
  expected: '3

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: FT_LINE="AEIOUaeiou" sh vowel_count.sh | cat -e
  args:
  - sh
  - vowel_count.sh
  expected: '10

    '
  cat_e: true
- id: subj_ex_03
  origin: subject.en.txt
  command: FT_LINE="bcdfg" sh vowel_count.sh | cat -e
  args:
  - sh
  - vowel_count.sh
  expected: '0

    '
  cat_e: true
- id: subj_ex_04
  origin: subject.en.txt
  command: FT_LINE="" sh vowel_count.sh | cat -e
  args:
  - sh
  - vowel_count.sh
  expected: '0

    '
  cat_e: true
