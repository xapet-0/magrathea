mode: c_program
near_examples:
- derived_from: subj_ex_01
  id: near_subj_01_lexical_shift
  original_input:
  - hello
  perturbed_input:
  - iello
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
- derived_from: subj_ex_01
  id: near_subj_01_whitespace_envelope
  original_input:
  - hello
  perturbed_input:
  - '  hello  '
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
- derived_from: subj_ex_02
  id: near_subj_02_lexical_shift
  original_input:
  - a b c
  perturbed_input:
  - b b c
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
- derived_from: subj_ex_02
  id: near_subj_02_whitespace_envelope
  original_input:
  - a b c
  perturbed_input:
  - '  a b c  '
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
- derived_from: cur_zigzag_T01
  id: near_folder_01_boundary_neighbor
  original_input: '[''hello'']'
  perturbed_input: '[''iello'']'
  strategy: Neighbouring perturbation of folder example (subject_folder/tests.yml
    (fixed_tests))
- derived_from: cur_zigzag_T02
  id: near_folder_02_boundary_neighbor
  original_input: '[''a b c'']'
  perturbed_input: '[''b b c'']'
  strategy: Neighbouring perturbation of folder example (subject_folder/tests.yml
    (fixed_tests))
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./zigzag hello | cat -e
  args:
  - hello
  expected: 'HeLlO

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: ./zigzag "a b c" | cat -e
  args:
  - a b c
  expected: 'A B C

    '
  cat_e: true
