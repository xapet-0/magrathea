subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./hidenp "fgex.;" "tyf34gdgf;'ektufjhgdgex.;.;rtjynur6" | cat -e
  args: &id001
  - fgex.;
  - tyf34gdgf;'ektufjhgdgex.;.;rtjynur6
  expected: '1

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: ./hidenp "abc" "2altrb53c.sse" | cat -e
  args: &id002
