subject_id: mirror_sort
mode: shell
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: printf "ba\nab\n" | sh mirror_sort.sh | cat -e
  args:
  - ba\nab\n
  expected: 'ab

    ba

    '
  cat_e: true
- id: subj_ex_02
