edge_cases:
- name: edge_01_B
  code: '[B]'
  title: Empty list (NULL) and single-node list in `intersection`
  input: intersection(NULL, ...)
  expected: Safely return NULL or 0 without dereferencing NULL pointer
- name: edge_02_M
  code: '[M]'
  title: Zero node leaks and use-after-free prevention in `intersection`
  input: Execute intersection under leak detection (DT_CHECK_LEAKS=1)
  expected: 0 bytes leaked and valid node pointers
- name: edge_03_B
  code: '[B]'
  title: All elements matching condition or identical in `intersection`
  input: Pass list where every element matches filter or deletion predicate
  expected: Properly update list head pointer without dangling references
- name: edge_04_B
  code: '[B]'
  title: Cycle detection and self-referencing nodes in `intersection`
  input: Pass cyclical linked list to intersection
  expected: Terminate correctly or detect loop without infinite iteration
fixed_tests:
- name: test_01_a_b
  expr: intersection(&a, &b) == &c
  setup:
  - struct s_node c={0,0}, a={0,&c}, b={0,&c}
  stdout: '1

    '
- name: test_02_a_b
  expr: intersection(&a, &b) == NULL
  setup:
  - struct s_node a={0,0}, b={0,0}
  stdout: '1

    '
- name: test_03_NULL_NULL
  expr: intersection(NULL, NULL) == NULL
  stdout: '1

    '
- name: test_04_a_a
  expr: intersection(&a, &a) == &a
  setup:
  - struct s_node a={0,0}
  stdout: '1

    '
- name: test_05_first_null
  setup:
  - struct s_node a={0,0};
  expr: intersection(NULL, &a) == NULL
  tier: edge
  stdout: '1

    '
- name: test_06_second_null
  setup:
  - struct s_node a={0,0};
  expr: intersection(&a, NULL) == NULL
  tier: edge
  stdout: '1

    '
- name: test_07_unequal_prefix_lengths
  setup:
  - struct s_node d={0,0}, c={0,&d}, b={0,&c}, a1={0,&b}, a2={0,&c};
  expr: intersection(&a1, &a2) == &c
  tier: edge
  stdout: '1

    '
- name: test_08_intersect_at_tail_of_3
  setup:
  - struct s_node t={0,0}, a2={0,&t}, a1={0,&a2}, b1={0,&t};
  expr: intersection(&a1, &b1) == &t
  tier: baseline
  stdout: '1

    '
- name: test_09_b_is_sublist_of_a
  setup:
  - struct s_node c={0,0}, b={0,&c}, a={0,&b};
  expr: intersection(&a, &b) == &b
  tier: edge
  stdout: '1

    '
- name: test_10_disjoint_multi_node_lists
  setup:
  - struct s_node a3={0,0},a2={0,&a3},a1={0,&a2},b3={0,0},b2={0,&b3},b1={0,&b2};
  expr: intersection(&a1, &b1) == NULL
  tier: stress
  stdout: '1

    '
