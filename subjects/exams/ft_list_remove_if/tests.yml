mode: c_function
fixed_tests:
- name: can_ft_list_remove_if_T01
  setup:
  - t_list *head = malloc(sizeof(t_list));
  - t_list *n2 = malloc(sizeof(t_list));
  - head->data = (void *)"rm"; head->next = n2;
  - n2->data = (void *)"keep"; n2->next = NULL;
  - ft_list_remove_if(&head, (void *)"rm", cmp);
  call: printf("%s|%d\n", (char *)head->data, head->next == NULL); free(head)
  stdout: 'keep|1

    '
- name: ft_list_remove_if_null_and_empty
  setup:
  - ft_list_remove_if(NULL, (void *)"x", cmp);
  - t_list *empty = NULL;
  - ft_list_remove_if(&empty, (void *)"x", cmp);
  call: 'printf("%s\n", empty == NULL ? "NULL_OK" : "FAIL")'
  stdout: 'NULL_OK

    '
- name: ft_list_remove_if_all_matching
  setup:
  - t_list *a = malloc(sizeof(t_list));
  - t_list *b = malloc(sizeof(t_list));
  - a->data = (void *)"x"; a->next = b;
  - b->data = (void *)"x"; b->next = NULL;
  - ft_list_remove_if(&a, (void *)"x", cmp);
  call: 'printf("%s\n", a == NULL ? "ALL_REMOVED" : "FAIL")'
  stdout: 'ALL_REMOVED

    '
- name: ft_list_remove_if_middle_and_tail
  setup:
  - t_list *a = malloc(sizeof(t_list));
  - t_list *b = malloc(sizeof(t_list));
  - t_list *c = malloc(sizeof(t_list));
  - t_list *d = malloc(sizeof(t_list));
  - a->data = (void *)"k1"; a->next = b;
  - b->data = (void *)"rm"; b->next = c;
  - c->data = (void *)"k2"; c->next = d;
  - d->data = (void *)"rm"; d->next = NULL;
  - ft_list_remove_if(&a, (void *)"rm", cmp);
  call: while(a){ printf("%s,", (char *)a->data); t_list *nx = a->next; free(a); a
    = nx; } printf("\n")
  stdout: 'k1,k2,

    '
- name: test_05_no_matches
  setup:
  - t_list *a = malloc(sizeof(t_list)); t_list *b = malloc(sizeof(t_list));
  - a->data = (void *)"1"; a->next = b; b->data = (void *)"2"; b->next = NULL;
  - ft_list_remove_if(&a, (void *)"9", cmp);
  call: while(a){ printf("%s,", (char *)a->data); t_list *nx = a->next; free(a); a
    = nx; } printf("\n")
  tier: baseline
  stdout: '1,2,

    '
- name: test_06_consecutive_head_matches
