  - t_list *a = malloc(sizeof(t_list)); t_list *b = malloc(sizeof(t_list)); t_list
    *c = malloc(sizeof(t_list));
  - a->data = (void *)"rm"; a->next = b; b->data = (void *)"rm"; b->next = c; c->data
    = (void *)"ok"; c->next = NULL;
  - ft_list_remove_if(&a, (void *)"rm", cmp);
  call: while(a){ printf("%s,", (char *)a->data); t_list *nx = a->next; free(a); a
    = nx; } printf("\n")
  tier: edge
  stdout: 'ok,

    '
- name: test_07_consecutive_middle_matches
  setup:
  - t_list *a = malloc(sizeof(t_list)); t_list *b = malloc(sizeof(t_list)); t_list
    *c = malloc(sizeof(t_list)); t_list *d = malloc(sizeof(t_list));
  - a->data = (void *)"1"; a->next = b; b->data = (void *)"rm"; b->next = c; c->data
    = (void *)"rm"; c->next = d; d->data = (void *)"2"; d->next = NULL;
  - ft_list_remove_if(&a, (void *)"rm", cmp);
  call: while(a){ printf("%s,", (char *)a->data); t_list *nx = a->next; free(a); a
    = nx; } printf("\n")
  tier: edge
  stdout: '1,2,

    '
- name: test_08_consecutive_tail_matches
  setup:
  - t_list *a = malloc(sizeof(t_list)); t_list *b = malloc(sizeof(t_list)); t_list
    *c = malloc(sizeof(t_list));
  - a->data = (void *)"keep"; a->next = b; b->data = (void *)"rm"; b->next = c; c->data
    = (void *)"rm"; c->next = NULL;
  - ft_list_remove_if(&a, (void *)"rm", cmp);
  call: while(a){ printf("%s,", (char *)a->data); t_list *nx = a->next; free(a); a
