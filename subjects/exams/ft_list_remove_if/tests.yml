    '
- name: test_09_single_node_removed
  setup:
  - t_list *a = malloc(sizeof(t_list)); a->data = (void *)"rm"; a->next = NULL;
  - ft_list_remove_if(&a, (void *)"rm", cmp);
  call: printf("%d\n", a == NULL)
  tier: edge
  stdout: '1

    '
- name: test_10_five_nodes_alternating
  setup:
  - t_list *n1 = malloc(sizeof(t_list)); t_list *n2 = malloc(sizeof(t_list)); t_list
    *n3 = malloc(sizeof(t_list)); t_list *n4 = malloc(sizeof(t_list)); t_list *n5
    = malloc(sizeof(t_list));
  - n1->data=(void*)"rm"; n1->next=n2; n2->data=(void*)"A"; n2->next=n3; n3->data=(void*)"rm";
    n3->next=n4; n4->data=(void*)"B"; n4->next=n5; n5->data=(void*)"rm"; n5->next=NULL;
  - ft_list_remove_if(&n1, (void *)"rm", cmp);
  call: while(n1){ printf("%s,", (char *)n1->data); t_list *nx = n1->next; free(n1);
    n1 = nx; } printf("\n")
  tier: stress
  stdout: 'A,B,

    '
