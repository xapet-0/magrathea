mode: c_program
fixed_tests:
- name: cur_polyset_T01
  description: dedup_2
  args:
  - '42'
  - '1337'
  - '42'
  expected: '42 1337

    '
  category: Functional
  tier: baseline
- name: cur_polyset_T02
  description: single
  args:
  - '42'
  expected: '42

    '
  category: Edge Case
  tier: baseline
- name: cur_polyset_T03
  description: all_dups
  args:
  - '7'
  - '7'
  - '7'
  expected: '7

    '
  category: Functional
  tier: baseline
- name: cur_polyset_T04
  description: ordered
  args:
  - '1'
  - '2'
  - '3'
  - '2'
  - '1'
  expected: '1 2 3

    '
  category: Functional
  tier: baseline
- name: edge_polyset_no_args
  args: []
  stdout: '

    '
  tier: edge_case
- name: edge_polyset_alpha_dups
  args:
  - a
  - b
  - a
  - c
  - b
  stdout: 'a b c

    '
  tier: edge_case
- name: edge_polyset_empty_str_dup
  args:
  - ''
  - a
  - ''
  stdout: ' a

    '
  tier: edge_case
- name: edge_polyset_case_sensitive
  args:
  - Foo
  - foo
  - Foo
  stdout: 'Foo foo

    '
  tier: edge_case
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./polyset 42 1337 42 | cat -e
  args:
  - '42'
  - '1337'
  - '42'
  expected: '42 1337

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: ./polyset 42 | cat -e
  args:
  - '42'
  expected: '42

    '
  cat_e: true
- id: subj_ex_03
  origin: subject.en.txt
  command: ./polyset 7 7 7 | cat -e
  args:
  - '7'
  - '7'
  - '7'
  expected: '7

    '
  cat_e: true
- id: subj_ex_04
  origin: subject.en.txt
  command: ./polyset 1 2 3 2 1 | cat -e
  args:
  - '1'
  - '2'
  - '3'
  - '2'
  - '1'
  expected: '1 2 3

    '
  cat_e: true
- id: subj_ex_05
  origin: subject.en.txt
  command: ./polyset | cat -e
  args: []
  expected: '

    '
  cat_e: true
folder_examples:
- id: cur_polyset_T01
  origin: subject_folder/tests.yml (fixed_tests)
  input: '[''42'', ''1337'', ''42'']'
  expected: 42 1337\n
- id: cur_polyset_T02
  origin: subject_folder/tests.yml (fixed_tests)
  input: '[''42'']'
  expected: 42\n
- id: cur_polyset_T03
  origin: subject_folder/tests.yml (fixed_tests)
  input: '[''7'', ''7'', ''7'']'
  expected: 7\n
near_examples:
- id: near_subj_01_lexical_shift
  derived_from: subj_ex_01
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input:
  - '42'
  - '1337'
  - '42'
  perturbed_input:
  - '43'
  - '1338'
  - '43'
- id: near_subj_01_whitespace_envelope
  derived_from: subj_ex_01
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input:
  - '42'
  - '1337'
  - '42'
  perturbed_input:
  - '  42  '
  - '1337'
  - '42'
