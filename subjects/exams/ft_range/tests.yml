mode: c_function
fixed_tests:
- name: can_ft_range_T01
  tier: baseline
  setup:
  - int *r = ft_range(1, 3);
  call: printf("%d,%d,%d\n", r[0], r[1], r[2]); free(r)
  stdout: '1,2,3

    '
- name: can_ft_range_T02
  tier: baseline
  setup:
  - int *r = ft_range(0, -3);
  call: printf("%d,%d,%d,%d\n", r[0], r[1], r[2], r[3]); free(r)
  stdout: '0,-1,-2,-3

    '
- name: can_ft_range_T03
  tier: baseline
  setup:
  - int *r = ft_range(0, 0);
  call: printf("%d\n", r[0]); free(r)
  stdout: '0

    '
- name: can_ft_range_T04_neg_to_pos
  tier: edge_case
  setup:
  - int *r = ft_range(-2, 2);
  call: printf("%d,%d,%d,%d,%d\n", r[0], r[1], r[2], r[3], r[4]); free(r)
  stdout: '-2,-1,0,1,2

    '
- name: test_05_descending_positive
  setup:
  - int *r = ft_range(3, 1);
  call: printf("%d,%d,%d\n", r[0], r[1], r[2]); free(r)
  tier: baseline
  stdout: '3,2,1

    '
- name: test_06_single_negative
  setup:
  - int *r = ft_range(-42, -42);
  call: printf("%d\n", r[0]); free(r)
  tier: edge
  stdout: '-42

    '
- name: test_07_negative_ascending
  setup:
  - int *r = ft_range(-5, -2);
  call: printf("%d,%d,%d,%d\n", r[0], r[1], r[2], r[3]); free(r)
  tier: baseline
  stdout: '-5,-4,-3,-2

    '
- name: test_08_negative_descending
  setup:
  - int *r = ft_range(-2, -5);
  call: printf("%d,%d,%d,%d\n", r[0], r[1], r[2], r[3]); free(r)
  tier: baseline
  stdout: '-2,-3,-4,-5

    '
- name: test_09_pos_to_neg
  setup:
  - int *r = ft_range(2, -1);
  call: printf("%d,%d,%d,%d\n", r[0], r[1], r[2], r[3]); free(r)
  tier: edge
  stdout: '2,1,0,-1

    '
- name: test_10_six_elements
  setup:
  - int *r = ft_range(10, 15);
  call: for(int i=0;i<6;i++) printf("%d,", r[i]); printf("\n"); free(r)
  tier: stress
  stdout: '10,11,12,13,14,15,

    '
