mode: c_program
fixed_tests:
- name: can_expand_str_T01
  description: 'Functional verification of input: `[''  hello   world  '']`'
  args:
  - '  hello   world  '
  expected: 'hello   world

    '
  category: Functional
  tier: baseline
- name: can_expand_str_T02
  description: tabs_and_spaces
  args:
  - "\t42\t\tSchool\t Forge  "
  expected: '42   School   Forge

    '
  category: Edge Case
  tier: baseline
- name: can_expand_str_T03
  description: already_clean
  args:
  - abc
  expected: 'abc

    '
  category: Functional
  tier: baseline
- name: can_expand_str_T04
  description: wrong_arg_count
  args: []
  expected: '

    '
  category: Functional
  tier: baseline
- name: subj_ex_01
  tier: subject_example
  args:
  - See? It's easy to print the same thing
  expected: 'See?   It''s   easy   to   print   the   same   thing

    '
- name: subj_ex_02
  tier: subject_example
  args:
  - ' this        time it      will     be    more complex  '
  expected: 'this   time   it   will   be   more   complex

    '
- name: subj_ex_03
  tier: subject_example
  args:
  - No S*** Sherlock...
  - nAw S*** ShErLaWQ...
  expected: '

    '
- name: subj_ex_04
  tier: subject_example
  args:
  - ''
  expected: '

    '
- name: near_ex_too_many_args
  tier: near_example
  args:
  - arg1
  - arg2
  expected: '

    '
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./expand_str "See? It's easy to print the same thing" | cat -e
  args:
  - See? It's easy to print the same thing
  expected: 'See?   It''s   easy   to   print   the   same   thing

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: ./expand_str " this        time it      will     be    more complex  "
    | cat -e
  args:
  - ' this        time it      will     be    more complex  '
  expected: 'this   time   it   will   be   more   complex

    '
  cat_e: true
- id: subj_ex_03
  origin: subject.en.txt
  command: ./expand_str "No S*** Sherlock..." "nAw S*** ShErLaWQ..." | cat -e
  args:
  - No S*** Sherlock...
  - nAw S*** ShErLaWQ...
  expected: '

    '
  cat_e: true
- id: subj_ex_04
  origin: subject.en.txt
  command: ./expand_str "" | cat -e
  args:
  - ''
  expected: '

    '
  cat_e: true
