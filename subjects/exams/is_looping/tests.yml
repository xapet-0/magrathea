mode: c_function
prototype: struct s_node { int value; struct s_node *next; }; int is_looping(struct
  s_node *node);
fixed_tests:
- name: null_list
  code: printf("%d\n", is_looping(0));
  expected: '0'
- name: single_no_loop
  code: struct s_node a={1,0}; printf("%d\n", is_looping(&a));
  expected: '0'
- name: single_self_loop
  code: struct s_node a={42,0}; a.next=&a; printf("%d\n", is_looping(&a));
  expected: '1'
- name: two_nodes_no_loop
  code: struct s_node b={2,0}, a={1,&b}; printf("%d\n", is_looping(&a));
  expected: '0'
- name: two_nodes_loop_to_head
  code: struct s_node b={2,0}, a={1,&b}; b.next=&a; printf("%d\n", is_looping(&a));
  expected: '1'
- name: two_nodes_loop_to_tail
  code: struct s_node b={2,0}, a={1,&b}; b.next=&b; printf("%d\n", is_looping(&a));
  expected: '1'
- name: three_nodes_no_loop
  code: struct s_node c={14,0}, b={19,&c}, a={12,&b}; printf("%d\n", is_looping(&a));
  expected: '0'
- name: example_1_loop_mid
  code: struct s_node n7={7,0},n6={6,&n7},n5={5,&n6},n4={4,&n5},n3={3,&n4},n2={2,&n3},n1={1,&n2};
    n7.next=&n3; printf("%d\n", is_looping(&n1));
  expected: '1'
- name: example_2_linear_7
  code: struct s_node n7={200,0},n6={120,&n7},n5={345,&n6},n4={50,&n5},n3={30,&n4},n2={150,&n3},n1={12,&n2};
    printf("%d\n", is_looping(&n1));
  expected: '0'
- name: example_3_loop_9
  code: struct s_node n9={200,0},n8={220,&n9},n7={100,&n8},n6={120,&n7},n5={345,&n6},n4={50,&n5},n3={30,&n4},n2={150,&n3},n1={12,&n2};
    n9.next=&n2; printf("%d\n", is_looping(&n1));
  expected: '1'
- name: duplicate_values_no_loop
  code: struct s_node d={42,0},c={42,&d},b={42,&c},a={42,&b}; printf("%d\n", is_looping(&a));
  expected: '0'
- name: duplicate_values_with_loop
  code: struct s_node d={42,0},c={42,&d},b={42,&c},a={42,&b}; d.next=&b; printf("%d\n",
    is_looping(&a));
  expected: '1'
- name: stress_500k_linear
  code: int N=500000; struct s_node *arr=calloc(N,sizeof(struct s_node)); for(int
    i=0;i<N-1;i++) arr[i].next=&arr[i+1]; printf("%d\n", is_looping(&arr[0])); free(arr);
  expected: '0'
- name: stress_500k_cycle
  code: int N=500000; struct s_node *arr=calloc(N,sizeof(struct s_node)); for(int
    i=0;i<N-1;i++) arr[i].next=&arr[i+1]; arr[N-1].next=&arr[250000]; printf("%d\n",
    is_looping(&arr[0])); free(arr);
  expected: '1'
