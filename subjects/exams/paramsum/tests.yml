mode: c_program
fixed_tests:
- name: can_paramsum_T01
  description: 'Functional verification of input: `[''a'', ''b'']`'
  args:
  - a
  - b
  expected: '2

    '
  category: Functional
  tier: baseline
- name: can_paramsum_T02
  description: case_none
  args: []
  expected: '0

    '
  category: Functional
  tier: baseline
- name: can_paramsum_T03
  description: case_one
  args:
  - a
  expected: '1

    '
  category: Functional
  tier: baseline
- name: can_paramsum_T04
  description: case_many
  args:
  - a
  - b
  - c
  - d
  - e
  expected: '5

    '
  category: Functional
  tier: baseline
- name: subj_ex_01
  tier: subject_example
  args:
  - '1'
  - '2'
  - '3'
  - '5'
  - '7'
  - '24'
  expected: '6

    '
- name: subj_ex_02
  tier: subject_example
  args:
  - '6'
  - '12'
  - '24'
  expected: '3

    '
- name: test_07_arg_auto
  args:
  - '1'
  - '2'
  - '3'
  - '4'
