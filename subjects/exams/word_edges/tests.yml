subject_id: word_edges
fixed_tests:
- name: test_01_hello_test_a
  args:
  - hello
  - test
  - a
  stdout: 'ho

    tt

    aa

    '
  tier: baseline
- name: case_word_edges_no_args
  args: []
  stdout: '

    '
  tier: baseline
- name: case_word_edges_mixed
  args:
  - x
  - ab
  - 42school
  stdout: 'xx

    ab

    4l

    '
  tier: baseline
- name: edge_word_edges_empty
  args:
  - ''
  stdout: '

    '
  tier: baseline
- name: edge_word_edges_whitespace
  args:
  - " \t "
  stdout: "  \n"
  tier: baseline
- name: edge_we_mixed_lengths
  args:
  - a
  - ab
  - ''
  - hello!
  stdout: 'aa

    ab


    h!

    '
  tier: edge_case
- name: edge_we_single_word
  args:
  - solo
  stdout: 'so

    '
  tier: edge_case
mode: c_program
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./word_edges hello test a | cat -e
  args:
  - hello
  - test
  - a
  expected: 'ho

    tt

    aa


    Allowed functions: write.

    '
  cat_e: true
folder_examples:
- id: e1337_word_edges_T06
  origin: subject_folder/examples.txt
  input: ./word_edges hello test a \| cat -e
  expected: 'ho$\ntt$\naa$\n\nAllowed functions: write.'
- id: folder_fixture_02
  origin: subject_folder/tests.yml
  input: tests.yml
  expected: "subject_id: word_edges\nfixed_tests:\n- args:\n  - hello\n  - test\n\
    \  - a\n  stdout: 'ho\n\n    tt\n\n    aa\n\n    '\n- name: case_word_edges_no_args\n\
    \  args: []\n  stdout: '"
near_examples:
- id: near_subj_01_lexical_shift
  derived_from: subj_ex_01
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input:
  - hello
  - test
  - a
  perturbed_input:
  - iello
  - uest
  - b
- id: near_subj_01_whitespace_envelope
  derived_from: subj_ex_01
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input:
  - hello
  - test
  - a
  perturbed_input:
  - '  hello  '
  - test
  - a
- id: near_folder_01_boundary_neighbor
  derived_from: e1337_word_edges_T06
  strategy: Neighbouring perturbation of folder example (subject_folder/examples.txt)
  original_input: ./word_edges hello test a \| cat -e
  perturbed_input: ./word_edges iello uest b | cat -e
