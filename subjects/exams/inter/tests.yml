  - cette phrase ne cache rien
- id: near_subj_04_arity_perturbation
  derived_from: subj_ex_04
  strategy: Invoke binary with unexpected arguments to verify argc guard
  original_input: ./inter | cat -e
  perturbed_input:
  - arg1
  - arg2
- id: near_folder_01_boundary_neighbor
  derived_from: can_inter_T10
  strategy: Neighbouring perturbation of folder example (subject_folder/42ExamPractice/inter/tester.sh)
