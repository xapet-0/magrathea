fixed_tests:
- args:
  - '4'
  category: Functional
  description: 'Functional verification of input: `[''4'']`'
  expected: '4 is even

    Sum from 1 to 4 is: 10

    '
  name: cur_fix_result_T01
  expected_stderr: ''
  stdout: '4 is even

    Sum from 1 to 4 is: 10

    '
  tier: baseline
- args:
  - '5'
  category: Functional
  description: 'Functional verification of input: `[''5'']`'
  expected: '5 is odd

    Sum from 1 to 5 is: 15

    '
  name: cur_fix_result_T02
  stdout: '5 is odd

    Sum from 1 to 5 is: 15

    '
  tier: baseline
- args:
  - '0'
  category: Edge Case
  description: 'Functional verification of input: `[''0'']`'
  expected: '0 is even

    Sum from 1 to 0 is: 0

    '
  name: cur_fix_result_T03
  stdout: '0 is even

    Sum from 1 to 0 is: 0

    '
  tier: baseline
- args:
  - ''
  category: Edge Case
  description: edge_empty_str
  expected: '0 is even

    Sum from 1 to 0 is: 0

    '
  name: cur_fix_result_T04
  stdout: '0 is even

    Sum from 1 to 0 is: 0

    '
  tier: baseline
- args:
  - "   \t  "
  category: Edge Case
  description: edge_whitespace
  expected: '0 is even

    Sum from 1 to 0 is: 0

    '
  name: cur_fix_result_T05
  stdout: '0 is even

    Sum from 1 to 0 is: 0

    '
  tier: baseline
- name: edge_fix_result_one
  args:
  - '1'
  stdout: '1 is odd

    Sum from 1 to 1 is: 1

    '
  tier: edge_case
- name: edge_fix_result_negative
  args:
  - '-5'
  stdout: '-5 is odd

    Sum from 1 to -5 is: 0

    '
  tier: edge_case
- name: edge_fix_result_ten
  args:
  - '10'
  stdout: '10 is even

    Sum from 1 to 10 is: 55

    '
  tier: edge_case
- name: edge_fix_result_extra_arg
  args:
  - '4'
  - '5'
  stdout: ''
  expected_stderr: 'Error !

    '
  expected_returncode: 1
  tier: edge_case
- name: edge_fix_result_no_args
  args: []
  stdout: ''
  expected_stderr: 'Error !

    '
  expected_returncode: 1
  tier: edge_case
