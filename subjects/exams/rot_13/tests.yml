subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./rot_13 "abc"
  args: &id001
  - abc
  expected: 'nop

    '
  cat_e: false
- id: subj_ex_02
  origin: subject.en.txt
  command: ./rot_13 "My horse is Amazing." | cat -e
  args: &id002
  - My horse is Amazing.
  expected: 'Zl ubefr vf Nznmvat.

    '
  cat_e: true
- id: subj_ex_03
  origin: subject.en.txt
  command: ./rot_13 "AkjhZ zLKIJz , 23y " | cat -e
  args: &id003
  - 'AkjhZ zLKIJz , 23y '
  expected: "NxwuM mYXVWm , 23l \n"
  cat_e: true
- id: subj_ex_04
  origin: subject.en.txt
  command: ./rot_13 | cat -e
  args: []
  expected: '

    '
  cat_e: true
- id: subj_ex_05
  origin: subject.en.txt
  command: ./rot_13 "" | cat -e
  args:
  - ''
  expected: '

    '
  cat_e: true
