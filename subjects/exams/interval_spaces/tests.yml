folder_examples:
- expected: a   b   c\n
  id: cur_interval_spaces_T01
  input: '[''abc'']'
  origin: subject_folder/tests.yml (fixed_tests)
- expected: x\n
  id: cur_interval_spaces_T02
  input: '[''x'']'
  origin: subject_folder/tests.yml (fixed_tests)
- expected: '`\n` (Empty argument outputs single newline)'
  id: cur_interval_spaces_T03
  input: '['''']'
  origin: subject_folder/tests.yml (fixed_tests)
mode: c_program
near_examples:
- derived_from: subj_ex_01
  id: near_subj_01_lexical_shift
  original_input:
  - abc
  perturbed_input:
  - bbc
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
- derived_from: subj_ex_01
  id: near_subj_01_whitespace_envelope
  original_input:
  - abc
  perturbed_input:
  - '  abc  '
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
- derived_from: subj_ex_02
  id: near_subj_02_lexical_shift
  original_input:
  - dubO a POIL
  - ok
  perturbed_input:
  - eubO a POIL
  - pk
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
- derived_from: subj_ex_02
  id: near_subj_02_whitespace_envelope
  original_input:
  - dubO a POIL
  - ok
  perturbed_input:
  - '  dubO a POIL  '
  - ok
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
- derived_from: cur_interval_spaces_T01
  id: near_folder_01_boundary_neighbor
  original_input: '[''abc'']'
  perturbed_input: '[''bbc'']'
  strategy: Neighbouring perturbation of folder example (subject_folder/tests.yml
    (fixed_tests))
- derived_from: cur_interval_spaces_T02
  id: near_folder_02_boundary_neighbor
  original_input: '[''x'']'
  perturbed_input: '[''y'']'
  strategy: Neighbouring perturbation of folder example (subject_folder/tests.yml
    (fixed_tests))
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./interval_spaces "abc" | cat -e
  args:
  - abc
  expected: 'a   b   c

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: ./interval_spaces "dubO a POIL" "ok" | cat -e
  args:
  - dubO a POIL
  - ok
  expected: '

    '
  cat_e: true
