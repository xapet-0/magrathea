subject_examples:
- args: *id001
  cat_e: true
  command: ./interval_spaces "abc" | cat -e
  expected: 'a   b   c

    '
  id: subj_ex_01
  origin: subject.en.txt
- args: *id002
  cat_e: true
  command: ./interval_spaces "dubO a POIL" "ok" | cat -e
