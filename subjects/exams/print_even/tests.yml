mode: c_program
fixed_tests:
- name: cur_print_even_T01
  description: FOR_42
  args:
  - FOR 42
  expected: 'FR4

    '
  category: Functional
  tier: baseline
- name: cur_print_even_T02
  description: abcd
  args:
  - abcd
  expected: 'ac

    '
  category: Functional
  tier: baseline
- name: cur_print_even_T03
  description: empty
  args:
  - ''
  expected: '

    '
  category: Edge Case
  tier: baseline
- name: cur_print_even_T04
  description: no_args
  args: []
  expected: '

    '
  category: Functional
  tier: baseline
- name: edge_pe_digits
  args:
  - '012345'
  stdout: '024

    '
  tier: edge_case
- name: edge_pe_single_char
  args:
  - a
  stdout: 'a

    '
  tier: edge_case
- name: edge_pe_extra_arg
  args:
  - a
  - b
  stdout: '

    '
  tier: edge_case
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./print_even "FOR 42" | cat -e
  args:
  - FOR 42
  expected: 'FR4

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: ./print_even | cat -e
  args: []
  expected: '

    '
  cat_e: true
folder_examples:
- id: cur_print_even_T01
  origin: subject_folder/tests.yml (fixed_tests)
  input: '[''FOR 42'']'
  expected: FR4\n
- id: cur_print_even_T02
  origin: subject_folder/tests.yml (fixed_tests)
  input: '[''abcd'']'
  expected: ac\n
- id: cur_print_even_T03
  origin: subject_folder/tests.yml (fixed_tests)
  input: '['''']'
  expected: '`\n` (Empty argument outputs single newline)'
near_examples:
- id: near_subj_01_lexical_shift
  derived_from: subj_ex_01
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input:
  - FOR 42
  perturbed_input:
  - GOR 42
- id: near_subj_01_whitespace_envelope
  derived_from: subj_ex_01
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input:
  - FOR 42
  perturbed_input:
  - '  FOR 42  '
- id: near_subj_02_arity_perturbation
  derived_from: subj_ex_02
  strategy: Invoke binary with unexpected arguments to verify argc guard
  original_input: ./print_even | cat -e
  perturbed_input:
  - arg1
  - arg2
- id: near_folder_01_boundary_neighbor
  derived_from: cur_print_even_T01
  strategy: Neighbouring perturbation of folder example (subject_folder/tests.yml
    (fixed_tests))
  original_input: '[''FOR 42'']'
  perturbed_input: '[''GOR 42'']'
- id: near_folder_02_boundary_neighbor
  derived_from: cur_print_even_T02
  strategy: Neighbouring perturbation of folder example (subject_folder/tests.yml
    (fixed_tests))
  original_input: '[''abcd'']'
  perturbed_input: '[''bbcd'']'
