mode: c_program
fixed_tests:
- name: can_rotone_T01
  description: 'Functional verification of input: `[''abc XYZ'']`'
  args:
  - abc XYZ
  expected: 'bcd YZA

    '
  category: Functional
  tier: baseline
- name: can_rotone_T02
  description: case_wrap
  args:
  - zZ aA
  expected: 'aA bB

    '
  category: Functional
  tier: baseline
- name: can_rotone_T03
  description: case_symbols
  args:
  - Hello-World!
  expected: 'Ifmmp-Xpsme!

    '
  category: Functional
  tier: baseline
- name: can_rotone_T04
  description: case_bad_argc
  args: []
  expected: '

    '
  category: Functional
  tier: baseline
- name: subj_ex_01
  tier: subject_example
  args:
  - abc
  expected: 'bcd

    '
- name: subj_ex_02
  tier: subject_example
  args:
  - Les stagiaires du staff ne sentent pas toujours tres bon.
  expected: 'Mft tubhjbjsft ev tubgg of tfoufou qbt upvkpvst usft cpo.

    '
- name: subj_ex_03
  tier: subject_example
  args:
  - 'AkjhZ zLKIJz , 23y '
  expected: "BlkiA aMLJKa , 23z \n"
- name: subj_ex_05
  tier: subject_example
  args:
  - ''
  expected: '

    '
- name: near_ex_too_many_args
  tier: near_example
  args:
  - near_arg_1
  - near_arg_2
  expected: '

    '
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./rotone "abc"
  args: &id001
  - abc
  expected: 'bcd

    '
  cat_e: false
- id: subj_ex_02
  origin: subject.en.txt
  command: ./rotone "Les stagiaires du staff ne sentent pas toujours tres bon." |
    cat -e
  args: &id002
  - Les stagiaires du staff ne sentent pas toujours tres bon.
  expected: 'Mft tubhjbjsft ev tubgg of tfoufou qbt upvkpvst usft cpo.

    '
  cat_e: true
- id: subj_ex_03
  origin: subject.en.txt
  command: ./rotone "AkjhZ zLKIJz , 23y " | cat -e
  args: &id003
  - 'AkjhZ zLKIJz , 23y '
  expected: "BlkiA aMLJKa , 23z \n"
  cat_e: true
- id: subj_ex_04
  origin: subject.en.txt
  command: ./rotone | cat -e
  args: []
  expected: '

    '
  cat_e: true
- id: subj_ex_05
  origin: subject.en.txt
  command: ./rotone "" | cat -e
  args:
  - ''
  expected: '

    '
  cat_e: true
