mode: c_function
fixed_tests:
- name: can_ft_strrev_T01
  description: 'Functional verification of input: `char s[]="abcd"; printf("%s\n",ft_strrev(s))`'
  call: char s[]="abcd"; printf("%s\n",ft_strrev(s))
  stdout: 'dcba

    '
  category: Functional
  tier: baseline
- name: can_ft_strrev_T02
  description: empty_str
  call: char s[] = ""; printf("[%s]\n", ft_strrev(s))
  stdout: '[]

    '
  category: Edge Case
  tier: baseline
- name: can_ft_strrev_T03
  description: single_char
  call: char s[] = "X"; printf("%s\n", ft_strrev(s))
  stdout: 'X

    '
  category: Edge Case
  tier: baseline
- name: can_ft_strrev_T04
  description: odd_len
  call: char s[] = "12345"; printf("%s\n", ft_strrev(s))
  stdout: '54321

    '
  category: Functional
  tier: baseline
- name: test_05_two_chars
  call: char s[] = "42"; printf("%s\n", ft_strrev(s))
  tier: edge
  stdout: '24

    '
- name: test_06_palindrome
  call: char s[] = "racecar"; printf("%s\n", ft_strrev(s))
  tier: edge
  stdout: 'racecar

    '
- name: test_07_returns_same_pointer
  call: char s[] = "hello"; char *r = ft_strrev(s); printf("%d:%s\n", r == s, s)
  tier: edge
  stdout: '1:olleh

    '
- name: test_08_double_reverse_restores
  call: char s[] = "Magrathea_1337"; ft_strrev(ft_strrev(s)); printf("%s\n", s)
  tier: baseline
  stdout: 'Magrathea_1337

    '
- name: test_09_with_spaces_and_symbols
  call: char s[] = "a b!c?"; printf("%s\n", ft_strrev(s))
  tier: baseline
  stdout: '?c!b a

    '
- name: test_10_ten_digits
  call: char s[] = "0123456789"; printf("%s\n", ft_strrev(s))
  tier: stress
  stdout: '9876543210

    '
