fixed_tests:
- name: test_01_d_n_x
  call: printf("%d\n", x)
  setup:
  - int x = 6
  - ft_mul(7, &x)
  stdout: '42

    '
- name: test_02_d_n_x
  call: printf("%d\n", x)
  setup:
  - int x = -3
  - ft_mul(4, &x)
  stdout: '-12

    '
- name: test_03_d_n_x
  call: printf("%d\n", x)
  setup:
  - int x = 99
  - ft_mul(0, &x)
  stdout: '0

    '
- name: test_04_d_n_x
  call: printf("%d\n", x)
  setup:
  - int x = -6
  - ft_mul(-7, &x)
  stdout: '42

    '
- name: test_05_multiply_by_one
  setup:
  - int x = 1337
  - ft_mul(1, &x)
  call: printf("%d\n", x)
  tier: edge
  stdout: '1337

    '
- name: test_06_multiply_by_neg_one
  setup:
  - int x = 42
  - ft_mul(-1, &x)
  call: printf("%d\n", x)
  tier: edge
  stdout: '-42

    '
- name: test_07_zero_dest
  setup:
  - int x = 0
  - ft_mul(99, &x)
  call: printf("%d\n", x)
  tier: edge
  stdout: '0

    '
- name: test_08_chained_mul
  setup:
  - int x = 2
  - ft_mul(3, &x)
  - ft_mul(7, &x)
  call: printf("%d\n", x)
  tier: baseline
  stdout: '42

    '
- name: test_09_powers_of_ten
  setup:
  - int x = 100
  - ft_mul(100, &x)
  call: printf("%d\n", x)
  tier: baseline
  stdout: '10000

    '
- name: test_10_large_negative
  setup:
  - int x = -125
  - ft_mul(8, &x)
  call: printf("%d\n", x)
  tier: stress
  stdout: '-1000

    '
- name: edge_int_max_times_one
  call: printf("%d\n", x)
  stdout: '2147483647

    '
  tier: edge
  setup:
  - int x = 2147483647
  - ft_mul(1, &x)
- name: edge_int_min_times_one
  call: printf("%d\n", x)
  stdout: '-2147483648

    '
  tier: edge
  setup:
  - int x = 1
  - ft_mul((-2147483647 - 1), &x)
- name: edge_int_min_times_zero
  call: printf("%d\n", x)
  stdout: '0

    '
  tier: edge
  setup:
  - int x = (-2147483647 - 1)
  - ft_mul(0, &x)
- name: edge_null_ptr
  call: ft_mul(42, NULL); printf("ok\n")
  stdout: 'ok

    '
  tier: edge
