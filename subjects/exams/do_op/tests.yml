near_examples:
- id: near_subj_01_lexical_shift
  derived_from: subj_ex_01
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input: *id001
  perturbed_input:
  - '124'
  - '*!'
  - '457'
- id: near_subj_01_whitespace_envelope
  derived_from: subj_ex_01
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input: *id001
  perturbed_input:
  - '  123  '
  - '*'
  - '456'
- id: near_subj_02_lexical_shift
  derived_from: subj_ex_02
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input: *id002
  perturbed_input:
  - '9829'
  - /!
  - '235'
- id: near_subj_02_whitespace_envelope
  derived_from: subj_ex_02
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input: *id002
  perturbed_input:
  - '  9828  '
  - /
  - '234'
- id: near_subj_03_lexical_shift
  derived_from: subj_ex_03
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input: *id003
  perturbed_input:
  - '2'
  - +!
  - '-44'
- id: near_subj_03_whitespace_envelope
  derived_from: subj_ex_03
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input: *id003
  perturbed_input:
  - '  1  '
  - +
  - '-43'
- id: near_subj_04_arity_perturbation
  derived_from: subj_ex_04
  strategy: Perturb argument count / adjacent input around subject.en.txt example
  original_input: ./do_op | cat -e
  perturbed_input:
  - do_op_near_arg_1
  - do_op_near_arg_2
- id: near_folder_01_boundary_neighbor
  derived_from: can_do_op_T07
  strategy: Neighbouring perturbation of folder example (subject_folder/42ExamPractice/do_op/tester.sh)
  original_input: ./do_op "1" "+" "-43"
  perturbed_input: ./eo_op "1" "+" "-43"
- id: near_folder_02_boundary_neighbor
  derived_from: can_do_op_T08
  strategy: Neighbouring perturbation of folder example (subject_folder/42ExamPractice/do_op/tester.sh)
  original_input: ./do_op "9828" "%" "234"
  perturbed_input: ./eo_op "9828" "%" "234"
