subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./do_op "123" "*" 456 | cat -e
  args: &id001
  - '123'
  - '*'
  - '456'
  expected: '56088

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: ./do_op "9828" "/" 234 | cat -e
  args: &id002
  - '9828'
  - /
  - '234'
  expected: '42

    '
  cat_e: true
- id: subj_ex_03
  origin: subject.en.txt
  command: ./do_op "1" "+" "-43" | cat -e
  args: &id003
  - '1'
  - +
  - '-43'
  expected: '-42

    '
  cat_e: true
- id: subj_ex_04
  origin: subject.en.txt
  command: ./do_op | cat -e
  args: []
  expected: '

    '
  cat_e: true
folder_examples:
- id: can_do_op_T07
  origin: subject_folder/42ExamPractice/do_op/tester.sh
  input: ./do_op "1" "+" "-43"
  expected: Matches 42 reference standard output and exit code
- id: can_do_op_T08
  origin: subject_folder/42ExamPractice/do_op/tester.sh
  input: ./do_op "9828" "%" "234"
  expected: Matches 42 reference standard output and exit code
- id: can_do_op_T09
  origin: subject_folder/42ExamPractice/do_op/tester.sh
  input: ./do_op "9828" "/" "234"
  expected: Matches 42 reference standard output and exit code
- id: can_do_op_T10
