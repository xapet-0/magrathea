mode: c_function
fixed_tests:
- name: can_ft_strlen_T01
  description: 'Functional verification of input: `ft_strlen("Hello")`'
  expr: ft_strlen("Hello")
  stdout: '5

    '
  category: Functional
  tier: baseline
- name: can_ft_strlen_T02
  description: 'Functional verification of input: `ft_strlen("")`'
  expr: ft_strlen("")
  stdout: '0

    '
  category: Functional
  tier: baseline
- name: can_ft_strlen_T03
  description: single_char
  expr: ft_strlen("a")
  stdout: '1

    '
  category: Edge Case
  tier: baseline
- name: can_ft_strlen_T04
  description: spaces_and_tabs
  expr: ft_strlen("  1337  42 ")
  stdout: '11

    '
  category: Edge Case
  tier: baseline
- name: test_05_two_chars
  expr: ft_strlen("42")
  tier: baseline
  stdout: '2

    '
- name: test_06_tabs_and_newlines
  expr: ft_strlen("\t\n\r")
  tier: edge
  stdout: '3

    '
- name: test_07_spaces_only
  expr: ft_strlen("       ")
  tier: edge
  stdout: '7

    '
- name: test_08_alphabet_26
  expr: ft_strlen("abcdefghijklmnopqrstuvwxyz")
  tier: baseline
  stdout: '26

    '
- name: test_09_embedded_symbols
  expr: ft_strlen("!@#$%^&*()")
  tier: baseline
  stdout: '10

    '
- name: test_10_fifty_chars
  expr: ft_strlen("01234567890123456789012345678901234567890123456789")
  tier: stress
  stdout: '50

    '
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt (contract specification)
  command: eval ft_strlen
  args: []
  expected: Conform to subject.en.txt prototype and output specification
  cat_e: false
