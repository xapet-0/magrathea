mode: c_function
fixed_tests:
- name: can_ft_list_foreach_T01
  call: t_list b={.data="b",.next=0}; t_list a={.data="a",.next=&b}; ft_list_foreach(&a,dt_print);
    printf("\n")
  stdout: 'a,b,

    '
- name: ft_list_foreach_null
  call: ft_list_foreach(NULL, dt_print); printf("NULL_OK\n")
  stdout: 'NULL_OK

    '
- name: ft_list_foreach_single
  call: t_list a={.data="single",.next=0}; ft_list_foreach(&a, dt_print); printf("\n")
  stdout: 'single,

    '
- name: ft_list_foreach_4nodes
  call: t_list d={"d",0}; t_list c={"c",&d}; t_list b={"b",&c}; t_list a={"a",&b};
    ft_list_foreach(&a, dt_print); printf("\n")
  stdout: 'a,b,c,d,

    '
- name: test_05_three_nodes
  call: t_list c={"3",0},b={"2",&c},a={"1",&b}; ft_list_foreach(&a, dt_print); printf("\n")
  tier: baseline
  stdout: '1,2,3,

    '
- name: test_06_empty_strings
  call: t_list b={"end",0},a={"",&b}; ft_list_foreach(&a, dt_print); printf("\n")
  tier: edge
  stdout: ',end,

    '
- name: test_07_sublist_from_second
  call: t_list c={"c",0},b={"b",&c},a={"a",&b}; ft_list_foreach(a.next, dt_print);
    printf("\n")
  tier: edge
  stdout: 'b,c,

    '
- name: test_08_duplicate_strings
  call: t_list c={"42",0},b={"42",&c},a={"42",&b}; ft_list_foreach(&a, dt_print);
    printf("\n")
  tier: baseline
  stdout: '42,42,42,

    '
- name: test_09_five_nodes
  call: t_list e={"e",0},d={"d",&e},c={"c",&d},b={"b",&c},a={"a",&b}; ft_list_foreach(&a,
    dt_print); printf("\n")
  tier: baseline
  stdout: 'a,b,c,d,e,

    '
- name: test_10_six_nodes
  call: t_list f={"6",0},e={"5",&f},d={"4",&e},c={"3",&d},b={"2",&c},a={"1",&b}; ft_list_foreach(&a,
    dt_print); printf("\n")
  tier: stress
  stdout: '1,2,3,4,5,6,

    '
