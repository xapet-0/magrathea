mode: c_program
fixed_tests:
- name: can_brackets_T01
  description: ok_simple
  args:
  - ([]){}
  expected: 'OK

    '
  category: Functional
  tier: baseline
- name: can_brackets_T02
  description: error_mismatch
  args:
  - ([)]
  expected: 'Error

    '
  category: Functional
  tier: baseline
- name: can_brackets_T03
  description: ok_empty
  args:
  - ''
  expected: 'OK

    '
  category: Edge Case
  tier: baseline
- name: can_brackets_T04
  description: multi_args
  args:
  - (())
  - ([)]
  expected: 'OK

    Error

    '
  category: Functional
  tier: baseline
- name: can_brackets_T05
  description: no_args
  args: []
  expected: '

    '
  category: Functional
  tier: baseline
- name: subj_ex_01
  tier: subject_example
  args:
  - (johndoe)
  expected: 'OK

    '
- name: subj_ex_03
  tier: subject_example
  args:
  - ''
  - '{[(0 + 0)(1 + 1)](3*(-1)){()}}'
  expected: 'OK

    OK

    '
- name: test_08_arg_auto
  args:
  - ''
  - ''
  tier: baseline
  stdout: 'OK

    OK

    '
- name: test_09_arg_auto
  args:
  - '42'
  - '1337'
  tier: baseline
  stdout: 'OK

    OK

    '
- name: test_10_arg_auto
  args:
  - pad
  - test
  tier: baseline
  stdout: 'OK

    OK

    '
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./brackets '(johndoe)' | cat -e
  args: &id001
  - (johndoe)
  expected: 'OK

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: ./brackets '([)]' | cat -e
  args: &id002
  - ([)]
  expected: 'Error

    '
  cat_e: true
- id: subj_ex_03
  origin: subject.en.txt
  command: ./brackets '' '{[(0 + 0)(1 + 1)](3*(-1)){()}}' | cat -e
  args: &id003
  - ''
  - '{[(0 + 0)(1 + 1)](3*(-1)){()}}'
  expected: 'OK

    OK

    '
  cat_e: true
- id: subj_ex_04
  origin: subject.en.txt
  command: ./brackets | cat -e
  args: []
  expected: '

    '
  cat_e: true
folder_examples:
- id: can_brackets_T06
  origin: subject_folder/examples.txt
  input: ./brackets '(johndoe)' \| cat -e
  expected: OK$
- id: can_brackets_T07
  origin: subject_folder/examples.txt
  input: ./brackets '([)]' \| cat -e
  expected: Error$
- id: can_brackets_T08
  origin: subject_folder/examples.txt
  input: ./brackets '' '{[(0 + 0)(1 + 1)](3*(-1)){()}}' \| cat -e
  expected: OK$\nOK$
- id: can_brackets_T09
  origin: subject_folder/examples.txt
  input: ./brackets \| cat -e
  expected: $
near_examples:
- id: near_subj_01_lexical_shift
  derived_from: subj_ex_01
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input: *id001
  perturbed_input:
  - (kohndoe)
- id: near_subj_01_whitespace_envelope
  derived_from: subj_ex_01
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input: *id001
  perturbed_input:
  - '  (johndoe)  '
- id: near_subj_02_lexical_shift
  derived_from: subj_ex_02
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input: *id002
  perturbed_input:
  - ([)]!
- id: near_subj_02_whitespace_envelope
  derived_from: subj_ex_02
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input: *id002
  perturbed_input:
  - '  ([)]  '
- id: near_subj_03_lexical_shift
  derived_from: subj_ex_03
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input: *id003
  perturbed_input:
  - ' '
  - '{[(0 + 0)(1 + 1)](3*(-1)){()}}!'
- id: near_subj_03_whitespace_envelope
  derived_from: subj_ex_03
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input: *id003
  perturbed_input:
  - '    '
  - '{[(0 + 0)(1 + 1)](3*(-1)){()}}'
- id: near_subj_04_arity_perturbation
  derived_from: subj_ex_04
  strategy: Perturb argument count / adjacent input around subject.en.txt example
  original_input: ./brackets | cat -e
  perturbed_input:
  - brackets_near_arg_1
  - brackets_near_arg_2
- id: near_folder_01_boundary_neighbor
  derived_from: can_brackets_T06
  strategy: Neighbouring perturbation of folder example (subject_folder/examples.txt)
  original_input: ./brackets '(johndoe)' \| cat -e
  perturbed_input: ./crackets '(johndoe)' \| cat -e
- id: near_folder_02_boundary_neighbor
  derived_from: can_brackets_T07
  strategy: Neighbouring perturbation of folder example (subject_folder/examples.txt)
  original_input: ./brackets '([)]' \| cat -e
  perturbed_input: ./crackets '([)]' \| cat -e
