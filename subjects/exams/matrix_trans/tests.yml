subject_id: matrix_trans
mode: shell
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: printf "1 2\n3 4\n" | sh matrix_trans.sh | cat -e
  args: &id001
  - 1 2\n3 4\n
  expected: '1 3

    2 4

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: printf "1 2 3\n4 5 6\n" | sh matrix_trans.sh | cat -e
  args: &id002
