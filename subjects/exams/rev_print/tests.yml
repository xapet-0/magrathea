mode: c_program
fixed_tests:
- name: can_rev_print_T01
  description: 'Functional verification of input: `[''abc'']`'
  args:
  - abc
  expected: 'cba

    '
  category: Functional
  tier: baseline
- name: can_rev_print_T02
  description: case_spaces
  args:
  - hello world
  expected: 'dlrow olleh

    '
  category: Edge Case
  tier: baseline
- name: can_rev_print_T03
  description: case_empty
  args:
  - ''
  expected: '

    '
  category: Edge Case
  tier: baseline
- name: can_rev_print_T04
  description: case_bad_argc
  args: []
  expected: '

    '
  category: Functional
  tier: baseline
- name: subj_ex_01
  tier: subject_example
  args:
  - zaz
  expected: 'zaz

    '
- name: subj_ex_02
  tier: subject_example
  args:
  - dub0 a POIL
  expected: 'LIOP a 0bud

    '
- name: near_ex_too_many_args
  tier: near_example
  args:
  - near_arg_1
  - near_arg_2
  expected: '

    '
- name: test_08_arg_auto
  args:
  - ''
  - ''
  tier: baseline
  stdout: '

    '
- name: test_09_arg_auto
  args:
  - '42'
  - '1337'
  tier: baseline
  stdout: '

    '
- name: test_10_arg_auto
  args:
  - pad
  - test
  tier: baseline
  stdout: '

    '
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./rev_print "zaz" | cat -e
  args: &id001
  - zaz
  expected: 'zaz

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: ./rev_print "dub0 a POIL" | cat -e
  args: &id002
  - dub0 a POIL
  expected: 'LIOP a 0bud

    '
  cat_e: true
- id: subj_ex_03
  origin: subject.en.txt
  command: ./rev_print | cat -e
  args: []
  expected: '

    '
  cat_e: true
