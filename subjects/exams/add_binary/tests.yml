  source: "\nint main(void)\n{\n    char *r1 = add_binary(\"11\", \"1\");\n    char\
    \ *r2 = add_binary(\"1010\", \"1011\");\n    char *r3 = add_binary(\"0\", \"0\"\
    );\n    char *r4 = add_binary(\"11111111\", \"1\");\n    if (!r1 || strcmp(r1,\
    \ \"100\") != 0) return (1);\n    if (!r2 || strcmp(r2, \"10101\") != 0) return\
    \ (1);\n    if (!r3 || strcmp(r3, \"0\") != 0) return (1);\n    if (!r4 || strcmp(r4,\
    \ \"100000000\") != 0) return (1);\n    free(r1); free(r2); free(r3); free(r4);\n\
    \    return (0);\n}\n"
