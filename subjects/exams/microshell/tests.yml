edge_cases:
- name: edge_01_P
  code: '[P]'
  title: Close all pipe file descriptors in parent and child
  input: Execute 50 consecutive pipes
  expected: No FD leak ('Too many open files')
- name: edge_02_P
  code: '[P]'
  title: Reap zombie child processes
  input: Check process table with ps during pipeline
  expected: No defunct processes
- name: edge_03_B
  code: '[B]'
  title: Built-in cd argument validation
  input: cd and cd a b
  expected: 'error: cd: bad arguments'
fixed_tests:
- args:
  - /bin/echo
  - hello
  - ;
  - /bin/echo
  - '42'
  category: Functional
  description: semi
  expected: 'hello

    42

    '
  name: cur_microshell_T01
  tier: baseline
- args:
  - /bin/echo
  - '1337'
  category: Edge Case
  description: single
  expected: '1337

    '
  name: cur_microshell_T02
  tier: baseline
- args:
  - /bin/echo
  - hello 42
  - '|'
  - /usr/bin/tr
  - a-z
  - A-Z
  category: Functional
  description: pipe
  expected: 'HELLO 42

    '
  name: cur_microshell_T03
  tier: baseline
- args: []
  category: Functional
  description: no_args
  expected: ''
  name: cur_microshell_T04
  stdout: ''
  tier: baseline
- args:
  - /bin/echo
  - microshell
  expected: 'microshell

    '
  name: subj_ex_01
  stdout: 'microshell

    '
  tier: subject_example
- name: test_06_execve_fail
  args:
  - /nonexistent_42_cmd
  - arg1
  tier: edge
  stdout: ''
  stderr: 'error: cannot execute /nonexistent_42_cmd

    '
  expected_returncode: 1
- name: test_07_cd_bad_args_none
  args:
  - cd
  tier: edge
  stdout: ''
  stderr: 'error: cd: bad arguments

    '
  expected_returncode: 1
- name: test_08_cd_bad_args_many
  args:
  - cd
  - /tmp
  - /var
  tier: edge
  stdout: ''
  stderr: 'error: cd: bad arguments

    '
  expected_returncode: 1
- name: test_09_cd_nonexistent
  args:
  - cd
  - /nonexistent_42_dir
  tier: edge
  stdout: ''
  stderr: 'error: cd: cannot change directory to /nonexistent_42_dir

    '
  expected_returncode: 1
- name: test_10_cd_and_pwd
  args:
  - cd
  - /
  - ;
  - /bin/pwd
  tier: baseline
  stdout: '/

    '
  stderr: ''
  expected_returncode: 0
- name: test_11_multi_stage_pipe_and_semicolon
  args:
  - /bin/echo
  - alpha_beta
  - '|'
  - /usr/bin/tr
  - a-z
  - A-Z
  - '|'
  - /usr/bin/tr
  - _
  - '-'
  - ;
  - /bin/echo
  - done
  tier: baseline
  stdout: 'ALPHA-BETA

    done

    '
  stderr: ''
  expected_returncode: 0
- name: test_12_fifty_pipes_low_nofile
  python_harness: "import resource, subprocess, sys\n\nexe = sys.argv[1]\ncmd = [exe,\
    \ '/bin/echo', 'pipe_ok']\nfor _ in range(50):\n    cmd.extend(['|', '/bin/cat'])\n\
    \ndef limit_fds():\n    resource.setrlimit(resource.RLIMIT_NOFILE, (25, 25))\n\
    \nproc = subprocess.run(cmd, capture_output=True, text=True, preexec_fn=limit_fds,\
    \ timeout=3.0)\nassert proc.returncode == 0, f'rc={proc.returncode} stderr={proc.stderr!r}'\n\
    assert proc.stderr == '', f'stderr={proc.stderr!r}'\nassert proc.stdout == 'pipe_ok\\\
    n', f'stdout={proc.stdout!r}'\nprint('OK')\n"
  expected: 'OK

    '
folder_examples:
- expected: hello\n42\n
  id: cur_microshell_T01
  input: '[''/bin/echo'', ''hello'', '';'', ''/bin/echo'', ''42'']'
