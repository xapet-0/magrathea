mode: c_function
fixed_tests:
- name: can_ft_strcmp_T01
  description: 'Functional verification of input: `ft_strcmp("abc", "abc") == 0 ?
    1 : 0`'
  expr: 'ft_strcmp("abc", "abc") == 0 ? 1 : 0'
  stdout: '1

    '
  category: Edge Case
  tier: baseline
- name: can_ft_strcmp_T02
  description: 'Functional verification of input: `ft_strcmp("abc", "abd") < 0 ? 1
    : 0`'
  expr: 'ft_strcmp("abc", "abd") < 0 ? 1 : 0'
  stdout: '1

    '
  category: Edge Case
  tier: baseline
- name: can_ft_strcmp_T03
  description: 'Functional verification of input: `ft_strcmp("\200", "a") > 0 ? 1
    : 0`'
  expr: 'ft_strcmp("\200", "a") > 0 ? 1 : 0'
  stdout: '1

    '
  category: Edge Case
  tier: baseline
- name: can_ft_strcmp_T04
  description: 'Functional verification of input: `ft_strcmp("a", "\200") < 0 ? 1
    : 0`'
  expr: 'ft_strcmp("a", "\200") < 0 ? 1 : 0'
  stdout: '1

    '
  category: Edge Case
  tier: baseline
- name: can_ft_strcmp_T05_empty_both
  description: 'Both strings empty: `ft_strcmp("", "") == 0`'
  expr: 'ft_strcmp("", "") == 0 ? 1 : 0'
  stdout: '1

    '
  category: Edge Case
  tier: edge
- name: can_ft_strcmp_T06_empty_first
  description: 'First string empty: `ft_strcmp("", "a") < 0`'
  expr: 'ft_strcmp("", "a") < 0 ? 1 : 0'
  stdout: '1

    '
  category: Edge Case
  tier: edge
- name: can_ft_strcmp_T07_empty_second
  description: 'Second string empty: `ft_strcmp("a", "") > 0`'
  expr: 'ft_strcmp("a", "") > 0 ? 1 : 0'
  stdout: '1

    '
  category: Edge Case
  tier: edge
- name: can_ft_strcmp_T08_prefix_shorter
  description: 'First string is prefix of second: `ft_strcmp("ab", "abc") < 0`'
  expr: 'ft_strcmp("ab", "abc") < 0 ? 1 : 0'
  stdout: '1

    '
  category: Edge Case
  tier: edge
- name: can_ft_strcmp_T09_prefix_longer
  description: 'Second string is prefix of first: `ft_strcmp("abc", "ab") > 0`'
  expr: 'ft_strcmp("abc", "ab") > 0 ? 1 : 0'
  stdout: '1

    '
  category: Edge Case
  tier: edge
- name: can_ft_strcmp_T10_exact_diff_middle
  description: 'Difference in middle character: `ft_strcmp("Hello", "He1lo") == (''l'' - ''1'')`'
  expr: 'ft_strcmp("Hello", "He1lo") == (''l'' - ''1'') ? 1 : 0'
  stdout: '1

    '
  category: Edge Case
  tier: edge
