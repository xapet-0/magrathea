mode: c_function
fixed_tests:
- name: can_ft_strcspn_T01
  description: 'Functional verification of input: `ft_strcspn("abcdef","dx")`'
  expr: ft_strcspn("abcdef","dx")
  stdout: '3

    '
  category: Functional
  tier: baseline
- name: can_ft_strcspn_T02
  description: no_reject_match
  expr: ft_strcspn("hello", "xyz")
  stdout: '5

    '
  category: Functional
  tier: baseline
- name: can_ft_strcspn_T03
  description: first_char_match
  expr: ft_strcspn("hello", "h")
  stdout: '0

    '
  category: Functional
  tier: baseline
- name: can_ft_strcspn_T04
  description: empty_reject
  expr: ft_strcspn("hello", "")
  stdout: '5

    '
  category: Edge Case
  tier: baseline
- name: test_05_empty_s
  expr: ft_strcspn("", "abc")
  tier: edge
  stdout: '0

    '
- name: test_06_both_empty
  expr: ft_strcspn("", "")
  tier: edge
  stdout: '0

    '
- name: test_07_match_at_last_char
  expr: ft_strcspn("12345!", "!")
  tier: edge
  stdout: '5

    '
- name: test_08_multiple_reject_chars
  expr: ft_strcspn("hello world", " ,!w")
  tier: baseline
  stdout: '5

    '
- name: test_09_all_chars_in_reject
  expr: ft_strcspn("abc", "cba")
  tier: edge
  stdout: '0

    '
- name: test_10_compare_with_libc
  expr: ft_strcspn("1337_magrathea_42", "42") == strcspn("1337_magrathea_42", "42")
  tier: stress
  stdout: '1

    '
