mode: c_function
fixed_tests:
- name: can_sort_int_tab_T01
  description: 'Functional verification of input: `int a[]={3,1,2}; sort_int_tab(a,3);
    printf("%`'
  call: int a[]={3,1,2}; sort_int_tab(a,3); printf("%d,%d,%d\n",a[0],a[1],a[2])
  stdout: '1,2,3

    '
  category: Edge Case
  tier: baseline
- name: can_sort_int_tab_T02
  description: with_duplicates_and_negatives
  call: int a[] = {5, -2, 5, 0, -10}; sort_int_tab(a, 5); printf("%d,%d,%d,%d,%d\n",
    a[0], a[1], a[2], a[3], a[4])
  stdout: '-10,-2,0,5,5

    '
  category: Edge Case
  tier: baseline
- name: can_sort_int_tab_T03
  description: single_element
  call: int a[] = {42}; sort_int_tab(a, 1); printf("%d\n", a[0])
  stdout: '42

    '
  category: Edge Case
  tier: baseline
- name: can_sort_int_tab_T04_reverse_even
  description: reverse_sorted_even_length
  call: int a[] = {40, 30, 20, 10}; sort_int_tab(a, 4); printf("%d,%d,%d,%d\n", a[0],
    a[1], a[2], a[3])
  stdout: '10,20,30,40

    '
  category: Edge Case
  tier: edge_case
- name: test_05_single_element
  call: int a[] = {42}; sort_int_tab(a, 1); printf("%d\n", a[0])
  tier: edge
  stdout: '42

    '
- name: test_06_already_sorted
  call: int a[] = {1, 2, 3, 4}; sort_int_tab(a, 4); printf("%d,%d,%d,%d\n", a[0],
    a[1], a[2], a[3])
  tier: baseline
  stdout: '1,2,3,4

    '
- name: test_07_all_equal
  call: int a[] = {7, 7, 7, 7}; sort_int_tab(a, 4); printf("%d,%d,%d,%d\n", a[0],
    a[1], a[2], a[3])
  tier: edge
  stdout: '7,7,7,7

    '
- name: test_08_int_limits
  call: int a[] = {2147483647, 0, -2147483648}; sort_int_tab(a, 3); printf("%d,%d,%d\n",
    a[0], a[1], a[2])
  tier: edge
  stdout: '-2147483648,0,2147483647

    '
- name: test_09_two_elements_swapped
  call: int a[] = {9, -9}; sort_int_tab(a, 2); printf("%d,%d\n", a[0], a[1])
  tier: baseline
  stdout: '-9,9

    '
- name: test_10_seven_elements_with_dups
  call: int a[] = {4, 2, 4, 1, 3, 2, 1}; sort_int_tab(a, 7); for(int i=0;i<7;i++)
    printf("%d,", a[i]); printf("\n")
  tier: stress
  stdout: '1,1,2,2,3,4,4,

    '
subject_examples:
