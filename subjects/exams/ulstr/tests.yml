  - near_arg_1
  - near_arg_2
  expected: '

    '
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./ulstr "L'eSPrit nE peUt plUs pRogResSer s'Il staGne et sI peRsIsTent
    VAnIte et auto-justification." | cat -e
  args: &id001
  - L'eSPrit nE peUt plUs pRogResSer s'Il staGne et sI peRsIsTent VAnIte et auto-justification.
  expected: 'l''EspRIT Ne PEuT PLuS PrOGrESsER S''iL STAgNE ET Si PErSiStENT vaNiTE
    ET AUTO-JUSTIFICATION.

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: ./ulstr "S'enTOuRer dE sECreT eSt uN sIGnE De mAnQuE De coNNaiSSanCe.  "
    | cat -e
  args: &id002
  - 'S''enTOuRer dE sECreT eSt uN sIGnE De mAnQuE De coNNaiSSanCe.  '
  expected: "s'ENtoUrER De SecREt EsT Un SigNe dE MaNqUe dE COnnAIssANcE.  \n"
  cat_e: true
- id: subj_ex_03
  origin: subject.en.txt
  command: ./ulstr "3:21 Ba  tOut  moUn ki Ka di KE m'en Ka fe fot" | cat -e
  args: &id003
  - 3:21 Ba  tOut  moUn ki Ka di KE m'en Ka fe fot
  expected: '3:21 bA  ToUT  MOuN KI kA DI ke M''EN kA FE FOT

    '
  cat_e: true
- id: subj_ex_04
  origin: subject.en.txt
  command: ./ulstr | cat -e
  args: []
  expected: '

    '
  cat_e: true
