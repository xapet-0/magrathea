mode: c_program
fixed_tests:
- name: can_ulstr_T01
  description: 'Functional verification of input: `[''aBcD 123'']`'
  args:
  - aBcD 123
  expected: 'AbCd 123

    '
  category: Functional
  tier: baseline
- name: can_ulstr_T02
  description: case_sentence
  args:
  - Hello World!
  expected: 'hELLO wORLD!

    '
  category: Functional
  tier: baseline
- name: can_ulstr_T03
  description: case_digits
  args:
  - 123_AbC_zZ
  expected: '123_aBc_Zz

    '
  category: Functional
  tier: baseline
- name: can_ulstr_T04
  description: case_bad_argc
  args: []
  expected: '

    '
  category: Functional
  tier: baseline
- name: subj_ex_01
  tier: subject_example
  args:
  - L'eSPrit nE peUt plUs pRogResSer s'Il staGne et sI peRsIsTent VAnIte et auto-justification.
  expected: 'l''EspRIT Ne PEuT PLuS PrOGrESsER S''iL STAgNE ET Si PErSiStENT vaNiTE
    ET AUTO-JUSTIFICATION.

    '
- name: subj_ex_02
  tier: subject_example
  args:
  - 'S''enTOuRer dE sECreT eSt uN sIGnE De mAnQuE De coNNaiSSanCe.  '
  expected: "s'ENtoUrER De SecREt EsT Un SigNe dE MaNqUe dE COnnAIssANcE.  \n"
- name: subj_ex_03
  tier: subject_example
  args:
  - 3:21 Ba  tOut  moUn ki Ka di KE m'en Ka fe fot
  expected: '3:21 bA  ToUT  MOuN KI kA DI ke M''EN kA FE FOT

