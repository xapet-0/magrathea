mode: c_function
fixed_tests:
- name: can_ft_putstr_T01
  description: 'Functional verification of input: `ft_putstr("Hello World")`'
  expr: ft_putstr("Hello World")
  stdout: 'Hello World

    '
  category: Functional
  tier: baseline
- name: can_ft_putstr_T02
  description: empty_string
  call: ft_putstr(""); write(1, "\n", 1)
  stdout: '

    '
  category: Edge Case
  tier: baseline
- name: can_ft_putstr_T03
  description: single_char
  call: ft_putstr("Z"); write(1, "\n", 1)
  stdout: 'Z

    '
  category: Edge Case
  tier: baseline
- name: can_ft_putstr_T04
  description: with_spaces
  call: ft_putstr("1337 Benguerir"); write(1, "\n", 1)
  stdout: '1337 Benguerir

    '
  category: Edge Case
  tier: baseline
- name: test_05_spaces_only
  call: ft_putstr("   "); write(1, "|\n", 2)
  tier: edge
  stdout: '   |

    '
- name: test_06_tabs_and_newlines
  call: ft_putstr("a\tb\nc\n")
  tier: edge
  stdout: "a\tb\nc\n"
- name: test_07_digits
  call: ft_putstr("0123456789"); write(1, "\n", 1)
  tier: baseline
  stdout: '0123456789

    '
- name: test_08_punctuation
  call: ft_putstr("!@#$%^&*()"); write(1, "\n", 1)
  tier: baseline
  stdout: '!@#$%^&*()

    '
- name: test_09_two_consecutive_calls
  call: ft_putstr("42_"); ft_putstr("Network"); write(1, "\n", 1)
  tier: baseline
  stdout: '42_Network

    '
- name: test_10_alphabet
  call: ft_putstr("abcdefghijklmnopqrstuvwxyz"); write(1, "\n", 1)
  tier: stress
  stdout: 'abcdefghijklmnopqrstuvwxyz

    '
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt (contract specification)
  command: eval ft_putstr
  args: []
  expected: Conform to subject.en.txt prototype and output specification
  cat_e: false
