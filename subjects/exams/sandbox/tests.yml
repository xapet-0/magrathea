fixed_tests:
- call: int r1 = sandbox(fn_nice, 2, true); int r2 = sandbox(fn_exit42, 2, true);
    int r3 = sandbox(fn_segv, 2, true); int r4 = sandbox(fn_hang, 1, true); printf("R=%d:%d:%d:%d\n",
    r1, r2, r3, r4);
  name: sandbox_multi_behavior_verification
  setup:
  - void fn_nice(void) {}
  - void fn_exit42(void) { exit(42); }
  - void fn_segv(void) { volatile int *p = 0; *p = 1; }
  - void fn_hang(void) { while (1) {} }
  stdout: 'Nice function!

    Bad function: exited with code 42

    Bad function: Segmentation fault

    Bad function: timed out after 1 seconds

    R=1:0:0:0

    '
- call: int a = sandbox(fn_ok, 2, false); int b = sandbox(fn_bad, 2, false); printf("QUIET=%d:%d\n",
    a, b);
  name: sandbox_quiet_mode_verification
  setup:
  - void fn_ok(void) {}
  - void fn_bad(void) { exit(7); }
  stdout: 'QUIET=1:0

    '
- call: int r = sandbox(fn_nice2, 2, true); printf("V_NICE=%d\n", r);
  name: sandbox_verbose_nice_returns_1
  setup:
  - void fn_nice2(void) {}
  stdout: 'Nice function!

    V_NICE=1

    '
- call: int r = sandbox(fn_bad2, 2, false); printf("Q_BAD=%d\n", r);
  name: sandbox_quiet_exit_nonzero
  setup:
  - void fn_bad2(void) { exit(13); }
  stdout: 'Q_BAD=0

    '
