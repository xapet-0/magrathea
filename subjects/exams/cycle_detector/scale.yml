project: cycle_detector
scale_version: 1337HUB-v4.2
stop_on_first_failure: true
zero_tolerance_gates:
- segfault
- memory_leak
- forbidden_function
sections:
- id: preliminaries
  title: 'Step 1: Preliminaries & Rendu Build Check'
  points: 20
  checks:
  - Verify expected files (cycle_detector.c) exist in `rendu/` with no unauthorized
    artifacts.
  - Compile cleanly with `cc -Wall -Wextra -Werror` (Norminette disabled in exam mode).
  - 'Verify exact function prototype `int cycle_detector(const t_list *list);` and
    allowed functions: malloc, free.'
- id: explain_before_checking
  title: 'Step 2: Conceptual Defense (Explain Before Checking)'
  points: 30
  checks:
  - Student explains pointer handling, memory safety, and control flow before running
    tests.
- id: live_mutation
  title: 'Step 3: Live Mutation & Edge-Case Verification'
  points: 50
  checks:
  - Call the function from a live test driver with NULL, empty, zero, and boundary
    values and verify deterministic return/output.
