  command: ./powerset 3 1 0 2 4 5 3 | cat -e
  args:
  - '3'
  - '1'
  - '0'
  - '2'
  - '4'
  - '5'
  - '3'
  expected: '3

    0 3

    1 2

    1 0 2

    '
  cat_e: true
