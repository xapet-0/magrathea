subject_id: alien_math
mode: shell
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: FT_NBR1="1" FT_NBR2="1" sh alien_math.sh | cat -e
  args: &id001
  - FT_NBR2=1
  - sh
  - alien_math.sh
  expected: '2

