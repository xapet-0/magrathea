edge_cases:
- name: edge_01_B
  code: '[B]'
  title: Bitwise boundary values (0x00, 0xFF, 0x80, 0x01) in `active_bits`
  input: active_bits(0x00), active_bits(0xFF), active_bits(0x80)
  expected: Accurate bit manipulation using unsigned byte representations
- name: edge_02_B
  code: '[B]'
  title: Zero length buffer and NULL pointer guard in `active_bits`
  input: active_bits(NULL, 0)
  expected: Safe return without SIGSEGV
- name: edge_03_D
  code: '[D]'
  title: Inverse bitwise operation property verification in `active_bits`
  input: 'Apply reverse or swap twice: active_bits(active_bits(x))'
  expected: Restores original value
- name: edge_04_B
  code: '[B]'
  title: Hexadecimal formatting and padding in `active_bits`
  input: active_bits(15) and active_bits(16)
  expected: Canonical hex output matching 42 specifications
