  expected: 'l l

    de

    Pour

    humanite Imperium

    '
- name: edge_oa_tabs_spaces
  args:
  - "\tfoo\tbar  baz\taaaa"
  expected: 'bar baz foo

    aaaa

    '
  tier: edge_case
- name: edge_oa_case_stability
  args:
  - Ba ab bA
  expected: 'ab Ba bA

    '
  tier: edge_case
- name: edge_oa_lengths
  args:
