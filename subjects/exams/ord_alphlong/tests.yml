mode: c_program
fixed_tests:
- name: can_ord_alphlong_T01
  description: basic
  args:
  - A a b B cc ca cd
  expected: 'A a b B

    ca cc cd

    '
  category: Functional
  tier: baseline
- name: can_ord_alphlong_T02
  description: single_word
  args:
  - hello
  expected: 'hello

    '
  category: Edge Case
  tier: baseline
- name: can_ord_alphlong_T03
  description: empty
  args:
  - ''
  expected: '

    '
  category: Edge Case
  tier: baseline
- name: can_ord_alphlong_T04
  description: no_args
  args: []
  expected: '

    '
  category: Functional
