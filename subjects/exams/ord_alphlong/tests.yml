  - b
  expected: '

    '
  tier: edge_case
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./ord_alphlong
  args: []
  expected: '$

    '
  cat_e: false
- id: subj_ex_02
  origin: subject.en.txt
  command: ./ord_alphlong "De son baton il frappa la pierre et l eau jaillit" | cat
    -e
  args:
  - De son baton il frappa la pierre et l eau jaillit
  expected: 'l

    De et il la

    eau son

    baton

    frappa pierre

    jaillit

    '
  cat_e: true
- id: subj_ex_03
  origin: subject.en.txt
  command: ./ord_alphlong "A a b B cc ca cd" | cat -e
  args:
  - A a b B cc ca cd
  expected: 'A a b B

    ca cc cd

    '
  cat_e: true
- id: subj_ex_04
  origin: subject.en.txt
  command: ./ord_alphlong "Pour l Imperium de l humanite" | cat -e
  args:
  - Pour l Imperium de l humanite
  expected: 'l l

    de

    Pour

    humanite Imperium

    '
  cat_e: true
folder_examples:
- id: can_ord_alphlong_T05
  origin: subject_folder/examples.txt
  input: ./ord_alphlong
  expected: $
- id: can_ord_alphlong_T06
  origin: subject_folder/examples.txt
  input: ./ord_alphlong "De son baton il frappa la pierre et l eau jaillit" \| cat
    -e
  expected: l$\nDe et il la$\neau son$\nbaton$\nfrappa pierre$\njaillit$
- id: can_ord_alphlong_T07
  origin: subject_folder/examples.txt
  input: ./ord_alphlong "A a b B cc ca cd" \| cat -e
  expected: A a b B$\nca cc cd$
- id: can_ord_alphlong_T08
  origin: subject_folder/examples.txt
  input: ./ord_alphlong "Pour l Imperium de l humanite" \| cat -e
  expected: l l$\nde$\nPour$\nhumanite Imperium$
near_examples:
- id: near_subj_01_arity_perturbation
  derived_from: subj_ex_01
  strategy: Invoke binary with unexpected arguments to verify argc guard
  original_input: ./ord_alphlong
  perturbed_input:
  - arg1
  - arg2
- id: near_subj_02_lexical_shift
  derived_from: subj_ex_02
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input:
  - De son baton il frappa la pierre et l eau jaillit
  perturbed_input:
  - Ee son baton il frappa la pierre et l eau jaillit
- id: near_subj_02_whitespace_envelope
  derived_from: subj_ex_02
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input:
  - De son baton il frappa la pierre et l eau jaillit
  perturbed_input:
  - '  De son baton il frappa la pierre et l eau jaillit  '
- id: near_subj_03_lexical_shift
  derived_from: subj_ex_03
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input:
  - A a b B cc ca cd
  perturbed_input:
  - B a b B cc ca cd
- id: near_subj_03_whitespace_envelope
  derived_from: subj_ex_03
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input:
  - A a b B cc ca cd
  perturbed_input:
  - '  A a b B cc ca cd  '
- id: near_subj_04_lexical_shift
  derived_from: subj_ex_04
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input:
  - Pour l Imperium de l humanite
  perturbed_input:
