edge_cases:
- name: edge_01_B
  code: '[B]'
  title: Empty string and non-printable characters in `frequency_character`
  input: "frequency_character(\"\") and frequency_character(\"\t\n\x01\x1F\")"
  expected: Preserve non-alphabetic characters unmodified
- name: edge_02_B
  code: '[B]'
  title: Argument count verification (argc != 2) in `frequency_character`
  input: Execute frequency_character with 0 arguments and with > 1 argument
  expected: Print newline only
- name: edge_03_D
  code: '[D]'
  title: Idempotence and involution property check for `frequency_character`
  input: 'Apply transformation twice: frequency_character(frequency_character(s))'
  expected: Valid transformation output matching mathematical cipher cycle
- name: edge_04_B
  code: '[B]'
  title: Boundary alphabetic letters ('a', 'z', 'A', 'Z') in `frequency_character`
  input: frequency_character("a z A Z")
  expected: Accurate wraparound without overflowing outside alphabet bounds
