mode: c_function
fixed_tests:
- name: cur_frequency_character_T01
  description: 'Functional verification of input: `frequency_character(''l'', "Hello
    world!")`'
  expr: frequency_character('l', "Hello world!")
  stdout: '3

    '
  category: Functional
  tier: baseline
- name: cur_frequency_character_T02
  description: 'Functional verification of input: `frequency_character(''x'', "Hello
    world!")`'
  expr: frequency_character('x', "Hello world!")
  stdout: '0

    '
  category: Functional
  tier: baseline
- name: cur_frequency_character_T03
  description: 'Functional verification of input: `frequency_character(''a'', "abracadabra")`'
  expr: frequency_character('a', "abracadabra")
  stdout: '5

    '
  category: Functional
  tier: baseline
- name: cur_frequency_character_T04
  description: 'Functional verification of input: `frequency_character(''a'', "")`'
  expr: frequency_character('a', "")
  stdout: '0

    '
  category: Functional
  tier: baseline
- name: cur_frequency_character_T05
  description: 'Functional verification of input: `frequency_character(''4'', "42
    1337 42 44")`'
  expr: frequency_character('4', "42 1337 42 44")
  stdout: '4

    '
  category: Functional
  tier: baseline
- name: test_06_case_sensitive
  expr: frequency_character('a', "AaAaAa")
  tier: edge
  stdout: '3

    '
- name: test_07_space_char
  expr: frequency_character(' ', "a b c d")
  tier: edge
  stdout: '3

    '
- name: test_08_all_matching
  expr: frequency_character('z', "zzzzzz")
  tier: baseline
  stdout: '6

    '
- name: test_09_first_and_last
  expr: frequency_character('!', "!hello!")
  tier: edge
  stdout: '2

    '
- name: test_10_single_char_match_and_miss
  expr: frequency_character('x', "x") * 10 + frequency_character('x', "y")
  tier: stress
  stdout: '10

    '
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: frequency_character('l', "Hello world!") = 3
  args: &id001
  - Hello world!)
  - '='
  - '3'
  expected: ''
  cat_e: false
- id: subj_ex_02
  origin: subject.en.txt
  command: frequency_character('x', "Hello world!") = 0
  args: &id002
  - Hello world!)
  - '='
  - '0'
  expected: ''
  cat_e: false
- id: subj_ex_03
  origin: subject.en.txt
  command: frequency_character('h', "Hello world!") = 0
  args: &id003
  - Hello world!)
  - '='
  - '0'
  expected: ''
  cat_e: false
