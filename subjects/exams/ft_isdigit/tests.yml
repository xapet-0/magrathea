edge_cases:
- name: edge_01_B
  code: '[B]'
  title: Empty string and non-printable characters in `ft_isdigit`
  input: "ft_isdigit(\"\") and ft_isdigit(\"\t\n\x01\x1F\")"
  expected: Preserve non-alphabetic characters unmodified
- name: edge_02_B
  code: '[B]'
  title: Argument count verification (argc != 2) in `ft_isdigit`
  input: Execute ft_isdigit with 0 arguments and with > 1 argument
  expected: Print newline only
- name: edge_03_D
  code: '[D]'
  title: Idempotence and involution property check for `ft_isdigit`
  input: 'Apply transformation twice: ft_isdigit(ft_isdigit(s))'
  expected: Valid transformation output matching mathematical cipher cycle
- name: edge_04_B
  code: '[B]'
  title: Boundary alphabetic letters ('a', 'z', 'A', 'Z') in `ft_isdigit`
  input: ft_isdigit("a z A Z")
  expected: Accurate wraparound without overflowing outside alphabet bounds
