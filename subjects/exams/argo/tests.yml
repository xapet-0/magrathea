mode: c_program
fixed_tests:
- name: test_01_no_args
  args: []
  stdin: '42'
  expected_stdout: '42

    '
- name: test_02_no_args
  args: []
  stdin: '-1337'
  expected_stdout: '-1337

    '
- name: test_03_no_args
  args: []
  stdin: '"hello \"world\""'
  expected_stdout: '"hello \"world\""

    '
- name: test_04_no_args
  args: []
  stdin: '{"a": 1, "b": {"c": "42"}}'
  expected_stdout: '{"a":1,"b":{"c":"42"}}

    '
- name: test_05_no_args
  args: []
  stdin: '{"empty":{}}'
  expected_stdout: '{"empty":{}}

    '
- name: test_06_no_args
  args: []
  stdin: '{"unclosed": 42'
  expected_stdout: 'Unexpected end of input

    '
  expected_returncode: 1
- name: test_07_no_args
  args: []
  stdin: '{"bad": @}'
  expected_stdout: 'Unexpected token ''@''

    '
  expected_returncode: 1
- name: edge_argo_escape_quote_backslash
  args: []
  stdin: '"\"hello\\\""'
  expected_stdout: '"\"hello\\\""

    '
  tier: edge_case
- name: edge_argo_trailing_garbage
  args: []
  stdin: 42 1
  expected_stdout: 'Unexpected token ''1''

    '
  expected_returncode: 1
  tier: edge_case
- name: edge_argo_invalid_escape
  args: []
  stdin: '"\n"'
  expected_stdout: 'Unexpected token ''n''

    '
  expected_returncode: 1
  tier: edge_case
- name: edge_argo_nested_ws
  args: []
  stdin: "  {\n  \"k1\"\t:\r  -42  , \"k2\" : { \"nested\" : \"ok\" } \n } "
  expected_stdout: '{"k1":-42,"k2":{"nested":"ok"}}

    '
  tier: edge_case
- name: edge_argo_empty_stdin
  args: []
  stdin: ''
  expected_stdout: 'Unexpected end of input

    '
  expected_returncode: 1
  tier: edge_case
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: echo -n '1' | ./argo | cat -e
  args: &id001
  - -n
  - '1'
  expected: '1

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: echo -n '"bonjour"' | ./argo | cat -e
  args: &id002
  - -n
  - '"bonjour"'
  expected: '"bonjour"

    '
  cat_e: true
- id: subj_ex_03
  origin: subject.en.txt
  command: echo -n '"escape! \" "' | ./argo | cat -e
  args: &id003
  - -n
  - '"escape! \" "'
  expected: '"escape! \" "

    '
  cat_e: true
- id: subj_ex_04
  origin: subject.en.txt
  command: echo -n '{"tomatoes":42,"potatoes":234}' | ./argo | cat -e
  args: &id004
  - -n
  - '{"tomatoes":42,"potatoes":234}'
  expected: '{"tomatoes":42,"potatoes":234}

    '
  cat_e: true
- id: subj_ex_05
  origin: subject.en.txt
  command: echo -n '{"recursion":{"recursion":{"recursion":{"recursion":"recursion"}}}}'
    | ./argo | cat -e
  args:
  - -n
  - '{"recursion":{"recursion":{"recursion":{"recursion":"recursion"}}}}'
  expected: '{"recursion":{"recursion":{"recursion":{"recursion":"recursion"}}}}

    '
  cat_e: true
- id: subj_ex_06
  origin: subject.en.txt
  command: echo -n '"unfinished string' | ./argo | cat -e
  args:
  - -n
  - '"unfinished string'
  expected: 'Unexpected end of input

    '
  cat_e: true
- id: subj_ex_07
  origin: subject.en.txt
  command: echo -n '"unfinished string 2\"' | ./argo | cat -e
  args:
  - -n
  - '"unfinished string 2\"'
  expected: 'Unexpected end of input

    '
  cat_e: true
- id: subj_ex_08
  origin: subject.en.txt
  command: echo -n '{"no value?":}' | ./argo | cat -e
  args:
  - -n
  - '{"no value?":}'
  expected: 'Unexpected token ''}''

    '
  cat_e: true
folder_examples: []
near_examples:
- id: near_subj_01_lexical_shift
  derived_from: subj_ex_01
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input: *id001
  perturbed_input:
  - -o
  - '2'
- id: near_subj_01_whitespace_envelope
  derived_from: subj_ex_01
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input: *id001
  perturbed_input:
  - '  -n  '
  - '1'
