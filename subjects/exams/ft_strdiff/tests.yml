edge_cases:
- name: edge_01_B
  code: '[B]'
  title: "Test `ft_strdiff` with high ASCII characters (unsigned char > 127 like '\x80\
    ' and 'ÿ')"
  input: "ft_strdiff(\"\x80\", \"\x7F\", ...)"
  expected: Compare and inspect characters as unsigned char conforming to POSIX libc
- name: edge_02_B
  code: '[B]'
  title: Test `ft_strdiff` at zero length (n = 0 / size = 0) and empty string ""
  input: ft_strdiff("", "", 0)
  expected: Do not read or write any byte out of bounds and return canonical value
- name: edge_03_D
  code: '[D]'
  title: Differential property check for `ft_strdiff` against libc oracle
  input: Compare ft_strdiff against standard library function across random permutations
  expected: 100% exact match in return value and destination buffer state
- name: edge_04_M
  code: '[M]'
  title: Canary Redzone check on string buffer boundaries in `ft_strdiff`
  input: Pass heap buffer allocated to exact strlen(s) + 1 size to ft_strdiff
  expected: No read or write beyond terminating null byte
