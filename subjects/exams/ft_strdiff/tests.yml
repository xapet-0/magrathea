mode: c_function
fixed_tests:
- name: cur_ft_strdiff_T01
  description: identical
  expr: ft_strdiff("abc", "abc")
  stdout: '-1

    '
  category: Functional
  tier: baseline
- name: cur_ft_strdiff_T02
  description: diff_at_2
  expr: ft_strdiff("abc", "abd")
  stdout: '2

    '
  category: Functional
  tier: baseline
- name: cur_ft_strdiff_T03
  description: both_empty
  expr: ft_strdiff("", "")
  stdout: '-1

    '
  category: Edge Case
  tier: baseline
- name: cur_ft_strdiff_T04
  description: first_empty
  expr: ft_strdiff("", "a")
  stdout: '0

    '
  category: Edge Case
  tier: baseline
- name: cur_ft_strdiff_T05
  description: second_empty
  expr: ft_strdiff("a", "")
  stdout: '0

    '
  category: Edge Case
  tier: baseline
- name: cur_ft_strdiff_T06
  description: different_length
  expr: ft_strdiff("abc", "abcd")
  stdout: '3

    '
  category: Functional
  tier: baseline
- name: test_07_differ_at_index_0
  expr: ft_strdiff("xbc", "abc")
  tier: edge
  stdout: '0

    '
- name: test_08_longer_first_string
  expr: ft_strdiff("abcd", "abc")
  tier: edge
  stdout: '3

    '
- name: test_09_single_char_equal_and_diff
  expr: ft_strdiff("a", "a") * 10 + ft_strdiff("a", "b")
  tier: baseline
  stdout: '-10

    '
- name: test_10_late_difference
  expr: ft_strdiff("0123456789a", "0123456789b")
  tier: stress
  stdout: '10

    '
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./ft_strdiff("hello", "hella")  →  4
  args: &id001
  - hella)
  - →
  - '4'
  expected: ''
  cat_e: false
- id: subj_ex_02
