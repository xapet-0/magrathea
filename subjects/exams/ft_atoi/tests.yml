mode: c_function
fixed_tests:
- name: subj_ex_zero
  tier: subject_example
  expr: ft_atoi("0")
  stdout: '0

    '
- name: subj_ex_positive_42
  tier: subject_example
  expr: ft_atoi("42")
  stdout: '42

    '
- name: folder_ex_spaces_negative
  tier: folder_example
  expr: ft_atoi("   \t\n\v\f\r  -42")
  stdout: '-42

    '
- name: near_ex_positive_43_padded
  tier: near_example
  expr: ft_atoi("  +43abc")
  stdout: '43

    '
- name: near_ex_plus_1337
  tier: near_example
  expr: ft_atoi("+1337abc")
  stdout: '1337

    '
- name: boundary_int_min_and_empty
  call: printf("%d:%d\n", ft_atoi("-2147483648"), ft_atoi("   "))
  stdout: '-2147483648:0

    '
  category: Edge Case
  tier: baseline
- name: edge_embedded_nul_terminator
  tier: edge_case
  setup:
  - char buf_nul[] = {' ', '\0', '1', '2', '3', '\0'};
  expr: ft_atoi(buf_nul)
  stdout: '0

    '
- name: edge_double_sign_stops
  tier: edge_case
  expr: ft_atoi("   --42") + ft_atoi("   +-42") + ft_atoi("abc42")
  stdout: '0

    '
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt (contract specification)
  command: eval ft_atoi
  args: []
  expected: Conform to subject.en.txt prototype and output specification
  cat_e: false
