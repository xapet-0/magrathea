edge_cases:
- name: edge_01_B
  code: '[B]'
  title: Extreme boundary values (INT_MIN, INT_MAX, 0, 1, -1) in `factorial_number`
  input: factorial_number(INT_MIN), factorial_number(0), factorial_number(1)
  expected: Correct mathematical result without signed overflow UB
- name: edge_02_S
  code: '[S]'
  title: Arithmetic overflow and infinite recursion protection in `factorial_number`
  input: Run factorial_number with large inputs
  expected: Safe return or termination without stack overflow
- name: edge_03_B
  code: '[B]'
  title: Zero factorial and power edge cases in `factorial_number`
  input: factorial_number(0)
  expected: Canonical mathematical result for 0
- name: edge_04_T
  code: '[T]'
  title: Time complexity guard against exponential runtime in `factorial_number`
  input: Call factorial_number on large prime or composite integer
  expected: Execute within 0.5s limit without timing out
