edge_cases:
- name: edge_01_B
  code: '[B]'
  title: Empty string and non-printable characters in `is_consonant`
  input: "is_consonant(\"\") and is_consonant(\"\t\n\x01\x1F\")"
  expected: Preserve non-alphabetic characters unmodified
- name: edge_02_B
  code: '[B]'
  title: Argument count verification (argc != 2) in `is_consonant`
  input: Execute is_consonant with 0 arguments and with > 1 argument
  expected: Print newline only
- name: edge_03_D
  code: '[D]'
  title: Idempotence and involution property check for `is_consonant`
  input: 'Apply transformation twice: is_consonant(is_consonant(s))'
  expected: Valid transformation output matching mathematical cipher cycle
- name: edge_04_B
  code: '[B]'
  title: Boundary alphabetic letters ('a', 'z', 'A', 'Z') in `is_consonant`
  input: is_consonant("a z A Z")
  expected: Accurate wraparound without overflowing outside alphabet bounds
