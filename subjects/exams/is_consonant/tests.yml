mode: c_function
fixed_tests:
- name: cur_is_consonant_T01
  description: 'Functional verification of input: `is_consonant(''b'')`'
  expr: is_consonant('b')
  stdout: '1

    '
  category: Functional
  tier: baseline
- name: cur_is_consonant_T02
  description: 'Functional verification of input: `is_consonant(''E'')`'
