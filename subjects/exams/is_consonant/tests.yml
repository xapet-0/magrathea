  - '1'
  expected: ''
  cat_e: false
- id: subj_ex_03
  origin: subject.en.txt
  command: is_consonant('o') = 0
  args: &id003
  - '='
  - '0'
  expected: ''
  cat_e: false
- id: subj_ex_04
