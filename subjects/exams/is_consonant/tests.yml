    '
  category: Edge Case
  tier: baseline
- name: cur_is_consonant_T05
  description: edge_is_consonant_non_letter
  expr: is_consonant('1')
  stdout: '0

    '
  category: Edge Case
  tier: baseline
- name: test_06_uppercase_consonant_Z
  expr: is_consonant('Z')
  tier: baseline
  stdout: '1

    '
- name: test_07_lowercase_consonant_z
  expr: is_consonant('z')
  tier: baseline
  stdout: '1

    '
- name: test_08_all_lowercase_vowels
  expr: is_consonant('e') + is_consonant('i') + is_consonant('o') + is_consonant('u')
  tier: edge
  stdout: '0

    '
- name: test_09_all_uppercase_vowels
  expr: is_consonant('A') + is_consonant('I') + is_consonant('O') + is_consonant('U')
  tier: edge
  stdout: '0

    '
- name: test_10_non_alpha_boundaries
  expr: is_consonant('@') + is_consonant('[') + is_consonant('`') + is_consonant('{')
  tier: stress
  stdout: '0

    '
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: is_consonant ('b') = 1
  args: &id001
  - (b)
  - '='
  - '1'
  expected: ''
  cat_e: false
- id: subj_ex_02
  origin: subject.en.txt
  command: is_consonant('C') = 1
  args: &id002
