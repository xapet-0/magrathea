oracle_tests:
- name: case_itoa_base_edges
  source: "int main(void)\n{\n    char *s1 = itoa_base(0, 10);\n    char *s2 = itoa_base(-42,\
    \ 16);\n    char *s3 = itoa_base(42, 2);\n    char *s4 = itoa_base(-2147483648,\
    \ 10);\n    if (!s1 || strcmp(s1, \"0\") != 0) return (1);\n    if (!s2 || strcmp(s2,\
    \ \"2A\") != 0) return (1);\n    if (!s3 || strcmp(s3, \"101010\") != 0) return\
    \ (1);\n    if (!s4 || strcmp(s4, \"-2147483648\") != 0) return (1);\n    free(s1);\
    \ free(s2); free(s3); free(s4);\n    return (0);\n}\n"
mode: c_function
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt (contract specification)
  command: eval itoa_base
  args: []
  expected: Conform to subject.en.txt prototype and output specification
  cat_e: false
folder_examples:
- id: e1337_itoa_base_T07
  origin: subject_folder/examples.txt
  input: itoa_base(255, 16)         -> "FF"
  expected: itoa_base(-42, 10)         -> "-42"\nitoa_base(5, 2)            -> "101"\nitoa_base(0,
    10)           -> "0"\nitoa_base(-2147483648, 10) -> "-2147483648"
- id: folder_fixture_02
  origin: subject_folder/tests.yml
  input: tests.yml
  expected: "subject_id: itoa_base\nfixed_tests:\n- name: hex_uppercase\n  call: char\
    \ *s = itoa_base(255, 16); printf(\"%s\\n\", s); free(s);\n  stdout: 'FF\n\n \
    \   '\n- name: negative"
near_examples:
- id: near_subj_01_arity_perturbation
  derived_from: subj_ex_01
  strategy: Perturb argument count / adjacent input around subject.en.txt example
  original_input: eval itoa_base
  perturbed_input:
  - itoa_base_near_arg_1
  - itoa_base_near_arg_2
- id: near_folder_01_boundary_neighbor
  derived_from: e1337_itoa_base_T07
  strategy: Neighbouring perturbation of folder example (subject_folder/examples.txt)
  original_input: itoa_base(255, 16)         -> "FF"
