mode: cpp
main_cpp: "#include \"Warlock.hpp\"\nint main()\n{\n  Warlock const richard(\"Richard\"\
  , \"Mistress of Magma\");\n  richard.introduce();\n  std::cout << richard.getName()\
  \ << \" - \" << richard.getTitle() << std::endl;\n\n  Warlock* jack = new Warlock(\"\
  Jack\", \"the Long\");\n  jack->introduce();\n  jack->setTitle(\"the Mighty\");\n\
  \  jack->introduce();\n\n  delete jack;\n  return (0);\n}\n"
expected_stdout: 'Richard: This looks like another boring day.

  Richard: I am Richard, Mistress of Magma!

  Richard - Mistress of Magma

  Jack: This looks like another boring day.

  Jack: I am Jack, the Long!

  Jack: I am Jack, the Mighty!

  Jack: My job here is done!

  Richard: My job here is done!

  '
must_not_compile:
- '#include "Warlock.hpp"

  int main() { Warlock bob; return 0; }

  '
- '#include "Warlock.hpp"

  int main() { Warlock a("A","B"); Warlock b(a); return 0; }

  '
- '#include "Warlock.hpp"

  int main() { Warlock a("A","B"); Warlock b("C","D"); b = a; return 0; }

  '
extra_cpp_tests:
- name: warlock_const_getters_and_introduce
  main_cpp: "#include \"Warlock.hpp\"\n\nint main()\n{\n  Warlock const w(\"Merlin\"\
    , \"Archmage\");\n  std::cout << w.getName() << \"|\" << w.getTitle() << std::endl;\n\
    \  w.introduce();\n  return (0);\n}\n"
  expected_stdout: 'Merlin: This looks like another boring day.

    Merlin|Archmage

    Merlin: I am Merlin, Archmage!

    Merlin: My job here is done!

    '
