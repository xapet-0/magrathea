subject_id: tsp
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: cat square.txt
  args: &id001
  - square.txt
  expected: '1, 1

    0, 1

    1, 0

    0, 0

    '
  cat_e: false
- id: subj_ex_02
  origin: subject.en.txt
  command: ./tsp < square.txt | cat -e
  args: &id002
  - <
  - square.txt
  expected: '4.00


    Hint : in order to use sqrtf , add -lm at the end of your compilation command

    '
  cat_e: true
folder_examples: []
near_examples:
- id: near_subj_01_lexical_shift
  derived_from: subj_ex_01
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input: *id001
  perturbed_input:
  - tquare.txt
- id: near_subj_01_whitespace_envelope
  derived_from: subj_ex_01
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input: *id001
  perturbed_input:
  - '  square.txt  '
- id: near_subj_02_lexical_shift
  derived_from: subj_ex_02
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input: *id002
  perturbed_input:
  - <!
  - tquare.txt
- id: near_subj_02_whitespace_envelope
  derived_from: subj_ex_02
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input: *id002
  perturbed_input:
  - '  <  '
  - square.txt
