edge_cases:
- name: edge_01_B
  code: '[B]'
  title: Empty array (size = 0), single element, and NULL pointer in `gold_gain`
  input: gold_gain(tab, 0) and gold_gain(NULL, 0)
  expected: Safe return without memory violation
- name: edge_02_B
  code: '[B]'
  title: Array with duplicate elements and all elements identical in `gold_gain`
  input: gold_gain([5, 5, 5, 5], 4)
  expected: Preserve stable sort or return correct count
- name: edge_03_B
  code: '[B]'
  title: Array already sorted in reverse order in `gold_gain`
  input: gold_gain([9, 8, 7, 6, 5], 5)
  expected: Properly sort array with no missing elements
- name: edge_04_T
  code: '[T]'
  title: Performance verification on large array in `gold_gain`
  input: Run gold_gain on array of 10,000 elements
  expected: Complete within timeout limit
fixed_tests:
- name: test_01_m_3
  expr: gold_gain(m, 3)
  setup:
  - int r0[]={1,0,0}, r1[]={0,3,0}, r2[]={0,0,4}; int *m[]={r0,r1,r2}
  stdout: '8

    '
- name: test_02_m_1
  expr: gold_gain(m, 1)
  setup:
  - int r0[]={42}; int *m[]={r0}
  stdout: '42

    '
- name: test_03_m_2
  expr: gold_gain(m, 2)
  setup:
  - int r0[]={1,2}, r1[]={3,4}; int *m[]={r0,r1}
  stdout: '7

    '
- name: test_04_NULL_0
  expr: gold_gain(NULL, 0)
  stdout: '0

    '
- name: test_05_2x2_bottom_row_best
  setup:
  - int r0[]={1,1}, r1[]={10,20}; int *m[]={r0,r1};
  expr: gold_gain(m, 2)
  tier: baseline
  stdout: '30

    '
- name: test_06_3x3_all_zeros
  setup:
  - int r0[]={0,0,0}, r1[]={0,0,0}, r2[]={0,0,0}; int *m[]={r0,r1,r2};
  expr: gold_gain(m, 3)
  tier: edge
  stdout: '0

    '
- name: test_07_3x3_diagonal_climb
  setup:
  - int r0[]={0,0,10}, r1[]={0,10,0}, r2[]={10,0,0}; int *m[]={r0,r1,r2};
  expr: gold_gain(m, 3)
  tier: baseline
  stdout: '30

    '
- name: test_08_3x3_zigzag_middle
  setup:
  - int r0[]={5,1,5}, r1[]={1,10,1}, r2[]={2,1,2}; int *m[]={r0,r1,r2};
  expr: gold_gain(m, 3)
  tier: edge
  stdout: '20

    '
- name: test_09_3x3_uniform_ones
  setup:
  - int r0[]={1,1,1}, r1[]={1,1,1}, r2[]={1,1,1}; int *m[]={r0,r1,r2};
  expr: gold_gain(m, 3)
  tier: baseline
  stdout: '3

    '
- name: test_10_4x4_mine
  setup:
  - int r0[]={1,3,1,5}, r1[]={2,2,4,1}, r2[]={5,0,2,3}, r3[]={0,6,1,2}; int *m[]={r0,r1,r2,r3};
  expr: gold_gain(m, 4)
  tier: stress
  stdout: '16

    '
