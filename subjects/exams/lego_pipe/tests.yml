mode: shell
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: printf "B\na\nB\n\n" | sh lego_pipe.sh | cat -e
  args:
  - B\na\nB\n\n
  expected: 'a

    b

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: printf "Z\nA\nz\nA\n" | sh lego_pipe.sh | cat -e
  args:
  - Z\nA\nz\nA\n
  expected: 'a

    z

    '
  cat_e: true
- id: subj_ex_03
  origin: subject.en.txt
  command: printf "hello\nHELLO\nworld\n" | sh lego_pipe.sh | cat -e
  args:
  - hello\nHELLO\nworld\n
  expected: 'hello

    world

    '
  cat_e: true
