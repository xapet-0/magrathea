fixed_tests:
- name: test_01_stdin
  env:
    FT_VAR: '1337'
  stdin: 'Hello $FT_VAR

    '
  stdout: 'Hello 1337

    '
  tier: baseline
- name: folder_ex_01
  tier: folder_example
  args: []
  stdout: 'Hello 1337

    '
  env:
    FT_VAR: '1337'
  stdin: 'Hello $FT_VAR

    '
- name: folder_ex_02
  tier: folder_example
  args: []
  stdout: 'Welcome to 42_School!

    '
  env:
    FT_VAR: 42_School
  stdin: 'Welcome to $FT_VAR!

    '
- name: folder_ex_03
  tier: folder_example
  args: []
  stdout: 'OK

    '
  env:
    FT_VAR: OK
  stdin: '$FT_VAR

    '
- name: test_05_stdin_auto
