subject_id: env_expander
mode: shell
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: printf "Hello $FT_VAR\n" | FT_VAR="1337" sh env_expander.sh | cat -e
  args: &id001
  - Hello $FT_VAR\n
  expected: 'Hello 1337

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: printf "Welcome to $FT_VAR!\n" | FT_VAR="42_School" sh env_expander.sh
    | cat -e
  args: &id002
  - Welcome to $FT_VAR!\n
  expected: 'Welcome to 42_School!

    '
  cat_e: true
- id: subj_ex_03
  origin: subject.en.txt
  command: printf "$FT_VAR\n" | FT_VAR="OK" sh env_expander.sh | cat -e
  args: &id003
  - $FT_VAR\n
  expected: 'OK

    '
  cat_e: true
folder_examples:
- id: e1337_env_expander_T04
  origin: subject_folder/examples.txt
  input: printf "Hello $FT_VAR\n" \| FT_VAR="1337" sh env_expander.sh \| cat -e
  expected: Hello 1337$
- id: e1337_env_expander_T05
  origin: subject_folder/examples.txt
  input: printf "Welcome to $FT_VAR!\n" \| FT_VAR="42_School" sh env_expander.sh \|
    cat -e
  expected: Welcome to 42_School!$
- id: e1337_env_expander_T06
  origin: subject_folder/examples.txt
  input: printf "$FT_VAR\n" \| FT_VAR="OK" sh env_expander.sh \| cat -e
  expected: OK$
- id: folder_fixture_04
  origin: subject_folder/tests.yml
  input: tests.yml
  expected: "fixed_tests:\n- env:\n    FT_VAR: '1337'\n  stdin: 'Hello $FT_VAR\n\n\
    \    '\n  stdout: 'Hello 1337\n\n    '\n- env:\n    FT_VAR: 42_School\n  stdin:\
    \ 'Welcome to $FT_VAR!\n\n "
near_examples:
- id: near_subj_01_lexical_shift
  derived_from: subj_ex_01
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input: *id001
  perturbed_input:
  - Iello $FT_VAR\n
- id: near_subj_01_whitespace_envelope
  derived_from: subj_ex_01
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input: *id001
  perturbed_input:
  - '  Hello $FT_VAR\n  '
- id: near_subj_02_lexical_shift
  derived_from: subj_ex_02
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input: *id002
  perturbed_input:
  - Xelcome to $FT_VAR!\n
- id: near_subj_02_whitespace_envelope
  derived_from: subj_ex_02
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input: *id002
  perturbed_input:
  - '  Welcome to $FT_VAR!\n  '
- id: near_subj_03_lexical_shift
  derived_from: subj_ex_03
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input: *id003
  perturbed_input:
  - $GT_VAR\n
- id: near_subj_03_whitespace_envelope
  derived_from: subj_ex_03
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input: *id003
  perturbed_input:
  - '  $FT_VAR\n  '
- id: near_folder_01_boundary_neighbor
  derived_from: e1337_env_expander_T04
  strategy: Neighbouring perturbation of folder example (subject_folder/examples.txt)
  original_input: printf "Hello $FT_VAR\n" \| FT_VAR="1337" sh env_expander.sh \|
    cat -e
  perturbed_input: qrintf "Hello $FT_VAR\n" \| FT_VAR="1337
- id: near_folder_02_boundary_neighbor
  derived_from: e1337_env_expander_T05
  strategy: Neighbouring perturbation of folder example (subject_folder/examples.txt)
  original_input: printf "Welcome to $FT_VAR!\n" \| FT_VAR="42_School" sh env_expander.sh
    \| cat -e
  perturbed_input: qrintf "Welcome to $FT_VAR!\n" \| FT_VAR
