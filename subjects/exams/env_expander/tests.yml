fixed_tests:
- name: test_01_stdin
  env:
    FT_VAR: '1337'
  stdin: 'Hello $FT_VAR

    '
  stdout: 'Hello 1337

    '
  tier: baseline
- name: folder_ex_01
  tier: folder_example
  args: []
  stdout: 'Hello 1337

    '
  env:
    FT_VAR: '1337'
  stdin: 'Hello $FT_VAR

    '
- name: folder_ex_02
  tier: folder_example
  args: []
  stdout: 'Welcome to 42_School!

    '
  env:
    FT_VAR: 42_School
  stdin: 'Welcome to $FT_VAR!

    '
- name: folder_ex_03
  tier: folder_example
  args: []
  stdout: 'OK

    '
  env:
    FT_VAR: OK
  stdin: '$FT_VAR

    '
- name: env_expander_multiple_occurrences
  args: []
  env:
    FT_VAR: '42'
  stdin: '$FT_VAR+$FT_VAR=$FT_VAR

    '
  stdout: '42+42=42

    '
  tier: edge_case
- name: env_expander_empty_var
  args: []
  env:
    FT_VAR: ''
  stdin: 'pre[$FT_VAR]post

    '
  stdout: 'pre[]post

    '
  tier: edge_case
- name: env_expander_multiline
  args: []
  env:
    FT_VAR: piscine
  stdin: 'line1 $FT_VAR

    no var here

    $FT_VAR end

    '
  stdout: 'line1 piscine

    no var here

    piscine end

    '
  tier: edge_case
- name: env_expander_empty_stdin
  args: []
  env:
    FT_VAR: '1337'
  stdin: ''
  stdout: ''
  tier: edge_case
- name: env_expander_other_var_untouched
  args: []
  env:
    FT_VAR: '42'
  stdin: 'OTHER=$OTHER

    '
  stdout: 'OTHER=$OTHER

    '
  tier: edge_case
subject_id: env_expander
mode: shell
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: printf "Hello $FT_VAR\n" | FT_VAR="1337" sh env_expander.sh | cat -e
  args:
  - Hello $FT_VAR\n
  expected: 'Hello 1337

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: printf "Welcome to $FT_VAR!\n" | FT_VAR="42_School" sh env_expander.sh
    | cat -e
  args:
  - Welcome to $FT_VAR!\n
  expected: 'Welcome to 42_School!

    '
  cat_e: true
- id: subj_ex_03
  origin: subject.en.txt
  command: printf "$FT_VAR\n" | FT_VAR="OK" sh env_expander.sh | cat -e
  args:
  - $FT_VAR\n
  expected: 'OK

    '
  cat_e: true
folder_examples:
- id: e1337_env_expander_T04
  origin: subject_folder/examples.txt
  input: printf "Hello $FT_VAR\n" \| FT_VAR="1337" sh env_expander.sh \| cat -e
  expected: Hello 1337$
- id: e1337_env_expander_T05
  origin: subject_folder/examples.txt
  input: printf "Welcome to $FT_VAR!\n" \| FT_VAR="42_School" sh env_expander.sh \|
    cat -e
  expected: Welcome to 42_School!$
- id: e1337_env_expander_T06
  origin: subject_folder/examples.txt
  input: printf "$FT_VAR\n" \| FT_VAR="OK" sh env_expander.sh \| cat -e
  expected: OK$
- id: folder_fixture_04
  origin: subject_folder/tests.yml
  input: tests.yml
  expected: "fixed_tests:\n- env:\n    FT_VAR: '1337'\n  stdin: 'Hello $FT_VAR\n\n\
    \    '\n  stdout: 'Hello 1337\n\n    '\n- env:\n    FT_VAR: 42_School\n  stdin:\
    \ 'Welcome to $FT_VAR!\n\n "
near_examples:
- id: near_subj_01_lexical_shift
  derived_from: subj_ex_01
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input:
  - Hello $FT_VAR\n
  perturbed_input:
  - Iello $FT_VAR\n
- id: near_subj_01_whitespace_envelope
  derived_from: subj_ex_01
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input:
  - Hello $FT_VAR\n
  perturbed_input:
  - '  Hello $FT_VAR\n  '
- id: near_subj_02_lexical_shift
  derived_from: subj_ex_02
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input:
  - Welcome to $FT_VAR!\n
  perturbed_input:
  - Xelcome to $FT_VAR!\n
- id: near_subj_02_whitespace_envelope
  derived_from: subj_ex_02
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input:
  - Welcome to $FT_VAR!\n
  perturbed_input:
  - '  Welcome to $FT_VAR!\n  '
- id: near_subj_03_lexical_shift
  derived_from: subj_ex_03
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input:
  - $FT_VAR\n
  perturbed_input:
  - $GT_VAR\n
- id: near_subj_03_whitespace_envelope
  derived_from: subj_ex_03
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input:
  - $FT_VAR\n
  perturbed_input:
  - '  $FT_VAR\n  '
