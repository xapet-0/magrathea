fixed_tests:
- name: test_01_d_d_d_d_d_n_buf_0_bu
  setup:
  - char buf[6] = "abcde"
  - bzero(buf + 1, 3)
  call: printf("%d,%d,%d,%d,%d\n", buf[0], buf[1], buf[2], buf[3], buf[4])
  stdout: '97,0,0,0,101

    '
  tier: baseline
- name: test_02_s_n_buf
  setup:
  - char buf[4] = "xyz"
  - bzero(buf, 0)
  call: printf("%s\n", buf)
  stdout: 'xyz

    '
  tier: baseline
- name: test_03_d_d_d_d_n_buf_0_buf
  setup:
  - char buf[4] = "xyz"
  - bzero(buf, 4)
  call: printf("%d,%d,%d,%d\n", buf[0], buf[1], buf[2], buf[3])
  stdout: '0,0,0,0

    '
  tier: baseline
- name: test_04_d_d_d_n_arr_0_arr_1
  setup:
  - int arr[3] = {42, 1337, 7}
  - bzero(arr, sizeof(int) * 2)
  call: printf("%d,%d,%d\n", arr[0], arr[1], arr[2])
  stdout: '0,0,7

    '
  tier: baseline
- name: test_05_single_byte_zero
  setup:
  - char buf[4] = "abc"
  - bzero(buf, 1)
  call: printf("%d,%c,%c\n", buf[0], buf[1], buf[2])
  tier: edge
  stdout: '0,b,c

    '
- name: test_06_last_byte_only
  setup:
  - char buf[4] = "abc"
  - bzero(buf + 2, 1)
  call: printf("%c,%c,%d\n", buf[0], buf[1], buf[2])
  tier: edge
  stdout: 'a,b,0

    '
- name: test_07_high_bytes_buffer
  setup:
  - unsigned char buf[4] = {255, 255, 255, 255}
  - bzero(buf, 3)
  call: printf("%d,%d,%d,%d\n", buf[0], buf[1], buf[2], buf[3])
  tier: baseline
  stdout: '0,0,0,255

    '
- name: test_08_middle_slice
  setup:
  - char buf[8] = "1234567"
  - bzero(buf + 2, 3)
  call: printf("%c,%c,%d,%d,%d,%c,%c\n", buf[0], buf[1], buf[2], buf[3], buf[4], buf[5],
    buf[6])
  tier: baseline
  stdout: '1,2,0,0,0,6,7

    '
- name: test_09_struct_or_long_array
  setup:
  - long a[2] = {-1L, 42L}
  - bzero(&a[0], sizeof(long))
  call: printf("%ld,%ld\n", a[0], a[1])
  tier: edge
  stdout: '0,42

    '
- name: test_10_sixteen_bytes
  setup:
  - char buf[16]; memset(buf, 'A', 16); bzero(buf, 16); int s=0; for(int i=0;i<16;i++)
    s+=buf[i];
  call: printf("%d\n", s)
  tier: stress
  stdout: '0

    '
