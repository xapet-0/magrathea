  original_input: *id003
  perturbed_input:
  - '  0  '
- id: near_folder_01_boundary_neighbor
  derived_from: cur_ascii_character_v2_T06
  strategy: Neighbouring perturbation of folder example (subject_folder/deepthought/corrections/exams/ascii_character_v2/generator.py)
  original_input: Dynamic generation rule via random_character()
  perturbed_input: Eynamic generation rule via random_chara
- id: near_folder_02_boundary_neighbor
  derived_from: cur_ascii_character_v2_T07
  strategy: Neighbouring perturbation of folder example (subject_folder/deepthought/corrections/exams/ascii_character_v2/generator.py)
  original_input: Dynamic generation rule via empty_test()
  perturbed_input: Eynamic generation rule via empty_test()
edge_cases:
- name: edge_01_B
  code: '[B]'
  title: Empty string and non-printable characters in `ascii_character_v2`
  input: "ascii_character_v2(\"\") and ascii_character_v2(\"\t\n\x01\x1F\")"
  expected: Preserve non-alphabetic characters unmodified
- name: edge_02_B
  code: '[B]'
  title: Argument count verification (argc != 2) in `ascii_character_v2`
  input: Execute ascii_character_v2 with 0 arguments and with > 1 argument
  expected: Print newline only
- name: edge_03_D
  code: '[D]'
  title: Idempotence and involution property check for `ascii_character_v2`
  input: 'Apply transformation twice: ascii_character_v2(ascii_character_v2(s))'
  expected: Valid transformation output matching mathematical cipher cycle
- name: edge_04_B
  code: '[B]'
  title: Boundary alphabetic letters ('a', 'z', 'A', 'Z') in `ascii_character_v2`
  input: ascii_character_v2("a z A Z")
  expected: Accurate wraparound without overflowing outside alphabet bounds
