mode: c_program
fixed_tests:
- name: cur_ascii_character_v2_T01
  description: 'Functional verification of input: `[''A'']`'
  args:
  - A
  expected: '65

    '
  category: Functional
  tier: baseline
- name: cur_ascii_character_v2_T02
  description: 'Functional verification of input: `[''z'']`'
  args:
  - z
  expected: '122

    '
  category: Functional
  tier: baseline
- name: cur_ascii_character_v2_T03
  description: 'Functional verification of input: `[''0'']`'
  args:
  - '0'
  expected: '48

    '
  category: Edge Case
  tier: baseline
- name: cur_ascii_character_v2_T04
  description: 'Functional verification of input: `['''']`'
  args:
  - ''
  expected: '

    '
  category: Functional
  tier: baseline
- name: cur_ascii_character_v2_T05
  description: Standard baseline execution and behavior check for `ascii_character_v2`
  args: []
  expected: '

    '
  category: Functional
  tier: baseline
- name: near_ex_too_many_args
  tier: near_example
  args:
  - arg1
  - arg2
  expected: '

    '
- name: edge_ascii_v2_multi_char
  args:
  - AB
  stdout: '

    '
  tier: edge_case
- name: edge_ascii_v2_space
  args:
  - ' '
  stdout: '32

    '
  tier: edge_case
- name: edge_ascii_v2_tilde
  args:
  - '~'
  stdout: '126

    '
  tier: edge_case
- name: edge_ascii_v2_bang
  args:
  - '!'
  stdout: '33

    '
  tier: edge_case
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./ascii_character_v2 "A" | cat -e
  args:
  - A
  expected: '65

    '
  cat_e: true
- id: subj_ex_02
  origin: subject.en.txt
  command: ./ascii_character_v2 "z" | cat -e
  args:
  - z
  expected: '122

    '
  cat_e: true
- id: subj_ex_03
  origin: subject.en.txt
  command: ./ascii_character_v2 "0" | cat -e
  args:
  - '0'
  expected: '48

    '
  cat_e: true
- id: subj_ex_04
  origin: subject.en.txt
  command: ./ascii_character_v2 | cat -e
  args: []
  expected: '

    '
  cat_e: true
folder_examples:
- id: cur_ascii_character_v2_T06
  origin: subject_folder/deepthought/corrections/exams/ascii_character_v2/generator.py
  input: Dynamic generation rule via random_character()
  expected: Deterministic output validated by Deepthought oracle
- id: cur_ascii_character_v2_T07
  origin: subject_folder/deepthought/corrections/exams/ascii_character_v2/generator.py
  input: Dynamic generation rule via empty_test()
  expected: Deterministic output validated by Deepthought oracle
- id: cur_ascii_character_v2_T08
  origin: subject_folder/deepthought/corrections/exams/ascii_character_v2/generator.py
  input: Dynamic generation rule via multiple_arguments_test()
  expected: Deterministic output validated by Deepthought oracle
near_examples:
- id: near_subj_01_lexical_shift
  derived_from: subj_ex_01
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input:
  - A
  perturbed_input:
  - B
- id: near_subj_01_whitespace_envelope
  derived_from: subj_ex_01
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input:
  - A
  perturbed_input:
  - '  A  '
- id: near_subj_02_lexical_shift
  derived_from: subj_ex_02
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input:
  - z
  perturbed_input:
  - z!
- id: near_subj_02_whitespace_envelope
  derived_from: subj_ex_02
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input:
  - z
  perturbed_input:
  - '  z  '
- id: near_subj_03_lexical_shift
  derived_from: subj_ex_03
  strategy: Perturb characters/numbers of subject.en.txt example to defeat hardcoded
    strcmp(argv[1])
  original_input:
  - '0'
  perturbed_input:
  - '1'
- id: near_subj_03_whitespace_envelope
  derived_from: subj_ex_03
  strategy: Wrap subject.en.txt example in leading/trailing spaces & tabs
  original_input:
  - '0'
  perturbed_input:
  - '  0  '
- id: near_subj_04_arity_perturbation
  derived_from: subj_ex_04
  strategy: Invoke binary with unexpected arguments to verify argc guard
  original_input: ./ascii_character_v2 | cat -e
  perturbed_input:
  - arg1
  - arg2
