mode: cpp
main_cpp: "#include \"Warlock.hpp\"\n#include \"Dummy.hpp\"\n#include \"Fwoosh.hpp\"\
  \nint main()\n{\n  Warlock richard(\"Richard\", \"the Titled\");\n  Dummy bob;\n\
  \  Fwoosh* fwoosh = new Fwoosh();\n  richard.learnSpell(fwoosh);\n  richard.introduce();\n\
  \  richard.launchSpell(\"Fwoosh\", bob);\n  richard.forgetSpell(\"Fwoosh\");\n \
  \ richard.launchSpell(\"Fwoosh\", bob);\n  delete fwoosh;\n  return 0;\n}\n"
expected_stdout: 'Richard: This looks like another boring day.

  Richard: I am Richard, the Titled!

  Target Practice Dummy has been fwooshed!

  Richard: My job here is done!

  '
must_not_compile:
- '#include "Warlock.hpp"

  int main() { Warlock bob; return 0; }

  '
- '#include "Warlock.hpp"

  int main() { Warlock a("A", "B"); Warlock b(a); return 0; }

  '
- '#include "Warlock.hpp"

  int main() { Warlock a("A", "B"); Warlock b("C", "D"); b = a; return 0; }

  '
- '#include "ASpell.hpp"

  int main() { ASpell s("Fwoosh", "fwooshed"); return 0; }

  '
- '#include "ATarget.hpp"

  int main() { ATarget t("Dummy"); return 0; }

  '
extra_cpp_tests:
- name: cpp01_const_contracts_clone_and_missing_spells
  main_cpp: "#include \"Warlock.hpp\"\n#include \"ASpell.hpp\"\n#include \"ATarget.hpp\"\
    \n#include \"Fwoosh.hpp\"\n#include \"Dummy.hpp\"\n\nint main()\n{\n  Warlock\
    \ w(\"Merlin\", \"Enchanter\");\n  const Dummy d;\n  Fwoosh f;\n  const ASpell\
    \ *cf = &f;\n  ASpell *cloned = cf->clone();\n  std::cout << cf->getName() <<\
    \ \":\" << cf->getEffects() << \":\" << d.getType() << std::endl;\n  cloned->launch(d);\n\
    \  d.getHitBySpell(*cf);\n  w.forgetSpell(\"Unknown\");\n  w.launchSpell(\"Unknown\"\
    , d);\n  w.learnSpell(&f);\n  w.learnSpell(&f);\n  w.launchSpell(\"Fwoosh\", d);\n\
    \  w.forgetSpell(\"Fwoosh\");\n  w.launchSpell(\"Fwoosh\", d);\n  delete cloned;\n\
    \  return 0;\n}\n"
  expected_stdout: 'Merlin: This looks like another boring day.

    Fwoosh:fwooshed:Target Practice Dummy

    Target Practice Dummy has been fwooshed!

    Target Practice Dummy has been fwooshed!

    Target Practice Dummy has been fwooshed!

    Merlin: My job here is done!

    '
