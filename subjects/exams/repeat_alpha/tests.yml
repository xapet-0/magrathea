mode: c_program
fixed_tests:
- name: can_repeat_alpha_T01
  description: lowercase_basic
  args:
  - abc!
  expected: 'abbccc!

    '
  category: Functional
  tier: baseline
- name: can_repeat_alpha_T02
  description: mixed_case
  args:
  - Az
  expected: 'Azzzzzzzzzzzzzzzzzzzzzzzzzz

    '
  category: Functional
  tier: baseline
- name: can_repeat_alpha_T03
  description: wrong_arg_count
  args: []
  expected: '

    '
  category: Functional
  tier: baseline
- name: can_repeat_alpha_T04
  description: edge_repeat_alpha_empty
  args:
  - ''
  expected: '

    '
  category: Edge Case
  tier: baseline
- name: can_repeat_alpha_T05
  description: edge_repeat_alpha_whitespace
  args:
  - " \t "
  expected: " \t \n"
  category: Edge Case
  tier: baseline
- name: subj_ex_01
  tier: subject_example
  args:
  - abc
  expected: 'abbccc

    '
- name: subj_ex_02
  tier: subject_example
  args:
  - Alex.
  expected: 'Alllllllllllleeeeexxxxxxxxxxxxxxxxxxxxxxxx.

    '
- name: subj_ex_03
  tier: subject_example
  args:
  - abacadaba 42!
  expected: 'abbacccaddddabba 42!

    '
- name: near_ex_too_many_args
  tier: near_example
  args:
  - near_arg_1
  - near_arg_2
  expected: '

    '
subject_examples:
- id: subj_ex_01
  origin: subject.en.txt
  command: ./repeat_alpha "abc"
  args: &id001
  - abc
  expected: 'abbccc

    '
  cat_e: false
- id: subj_ex_02
  origin: subject.en.txt
  command: ./repeat_alpha "Alex." | cat -e
  args: &id002
  - Alex.
  expected: 'Alllllllllllleeeeexxxxxxxxxxxxxxxxxxxxxxxx.

    '
  cat_e: true
- id: subj_ex_03
  origin: subject.en.txt
  command: ./repeat_alpha 'abacadaba 42!' | cat -e
  args: &id003
  - abacadaba 42!
  expected: 'abbacccaddddabba 42!

    '
  cat_e: true
- id: subj_ex_04
  origin: subject.en.txt
  command: ./repeat_alpha | cat -e
  args: []
  expected: '

    '
  cat_e: true
- id: subj_ex_05
  origin: subject.en.txt
  command: ./repeat_alpha "" | cat -e
  args:
  - ''
  expected: '

    '
  cat_e: true
