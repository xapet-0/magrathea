project: exit_truth
scale_version: 1337HUB-v4.2
stop_on_first_failure: true
zero_tolerance_gates:
- syntax_error
- forbidden_command
sections:
- id: preliminaries
  title: 'Step 1: Preliminaries & Rendu Shell Check'
  points: 20
  checks:
  - Verify expected script (exit_truth.sh) exists in the rendu/ exam workspace with
    no unauthorized files.
  - 'Verify clean POSIX shell execution without C compilation (`norminette: false`
    in exam mode).'
  - 'Verify only allowed shell commands/utilities are used: test, exit.'
- id: explain_before_checking
  title: 'Step 2: Conceptual Defense (Explain Before Checking)'
  points: 30
  checks:
  - Student explains pipelines, quoting/escaping, environment variables, and exit-status
    handling before executing tests.
- id: live_mutation
  title: 'Step 3: Live Environment & Edge-Case Verification'
  points: 50
  checks:
  - Run the script against varied environment variables, whitespace, and edge inputs
    checking exact `| cat -e` output.
