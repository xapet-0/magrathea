edge_cases:
- name: edge_01_B
  code: '[B]'
  title: Empty tree (NULL), single node, and linear skewed tree in `vbc (without tree)`
  input: vbc (without tree)(NULL) and linear tree of depth 30
  expected: Return 0/NULL for empty tree, correct calculation for unbalanced tree
- name: edge_02_B
  code: '[B]'
  title: No valid solution or duplicate/zero values in `vbc (without tree)`
  input: Input with no valid solution or containing duplicate values in vbc (without
    tree)
  expected: Do not emit corrupted output or duplicate equivalent solutions
- name: edge_03_M
  code: '[M]'
  title: Deallocation of auxiliary structures under leak checks in `vbc (without tree)`
  input: Run vbc (without tree) with DT_CHECK_LEAKS=1
  expected: 0 bytes leaked and structural integrity of left/right child pointers
- name: edge_04_D
  code: '[D]'
  title: Output order verification (Lexicographical / Infix Order) in `vbc (without
    tree)`
  input: Inspect sequence of traversed or printed nodes in vbc (without tree)
  expected: Exact match with standard traversal order required in subject
